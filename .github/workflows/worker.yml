name: Worker Cloudflare

# À chaque pull request (et push sur main) qui touche le Worker de collecte et de rapport
# (worker/, wrangler.toml ; et le moteur du jeu, js/engine/, que le monde partagé embarque) : le Worker est construit comme le ferait Cloudflare, sans rien
# déployer (wrangler deploy --dry-run : le code est regroupé, wrangler.toml lu, les liaisons
# listées). Une erreur de code ou de configuration du Worker apparaît ainsi dans la pull
# request, avec son journal, avant la fusion. Le déploiement lui-même reste fait par
# Cloudflare (Workers Builds, voir worker/README.md).
#
# wrangler est épinglé ici (pas dans package.json : le site n'en a pas besoin, et son
# installation est lourde). Pour le monter de version : changer WRANGLER plus bas.

on:
  push:
    branches: [main]
    paths: ['worker/**', 'wrangler.toml', '.github/workflows/worker.yml', 'js/engine/**', 'js/data.generated.js']
  pull_request:
    paths: ['worker/**', 'wrangler.toml', '.github/workflows/worker.yml', 'js/engine/**', 'js/data.generated.js']

permissions:
  contents: read

env:
  WRANGLER: wrangler@4.150.0

jobs:
  verifier:
    name: Construction du Worker (sans déploiement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tests du rapport quotidien et de la collecte
        run: node tests/test-report.mjs
      - name: Tests des comptes du jeu en ligne
        run: node tests/test-comptes.mjs
      - name: Tests du monde partagé
        run: node tests/test-monde.mjs
      - name: Construire le Worker comme au déploiement (wrangler deploy --dry-run)
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - name: Construire une version de branche (wrangler versions upload --dry-run)
        run: npx --yes "$WRANGLER" versions upload --dry-run --outdir "$RUNNER_TEMP/worker-version"
