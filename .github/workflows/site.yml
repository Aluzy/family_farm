name: Tests et mise en ligne

# À chaque push : les données sont régénérées, les tests passent, le site est
# construit (scripts/build-site.mjs). Sur main, s'il n'y a aucune erreur, le
# site construit est publié sur GitHub Pages ; à la moindre erreur, le site en
# ligne reste sur sa version précédente.
#
# Réglage du dépôt requis, une fois : Settings › Pages › Source : GitHub Actions.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer esbuild
        run: npm install --no-audit --no-fund
      # Les fichiers générés sont refaits ici : une donnée modifiée sans relancer
      # les scripts (depuis un téléphone, par exemple) est quand même prise en compte.
      - name: Données du jeu (vérifiées, puis générées)
        run: node scripts/build-data.mjs
      - name: Encyclopédie (générée)
        run: node build-encyclopedie.mjs
      - name: Vérification des données
        run: node test-data.mjs
      - name: Moteur du jeu
        run: node run-tests.mjs
      - name: Suivi de session
        run: node test-telemetry.mjs
      - name: Rapport quotidien
        run: node test-report.mjs
      - name: Actions de l'interface
        run: node scripts/check-actions.mjs
      - name: Modules et fichiers de la page
        run: node scripts/check-page.mjs
      - name: Construire le site
        run: node scripts/build-site.mjs
      - name: Préparer la mise en ligne
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Mise en ligne
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
