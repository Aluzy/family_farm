name: Tests et mise en ligne

# À chaque push sur main et à chaque pull request : les fichiers générés commités
# (données, encyclopédie, cartes) sont vérifiés à jour, les tests passent, le site
# est construit (scripts/build-site.mjs). Sur main, s'il n'y a aucune erreur, le
# site construit est publié sur GitHub Pages ; à la moindre erreur, le site en
# ligne reste sur sa version précédente.
#
# Un fichier généré pas à jour fait échouer l'action : relancer en local
# « npm run build:data », « node scripts/build-encyclopedie.mjs » ou
# « npm run build:map », puis commiter le résultat.
#
# Réglage du dépôt requis, une fois : Settings › Pages › Source : GitHub Actions.

# push limité à main : une branche avec une pull request n'est pas testée deux fois.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Installer esbuild (versions de package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Données du jeu (vérifiées, et à jour)
        run: node scripts/build-data.mjs --check
      - name: Encyclopédie (à jour)
        run: node scripts/build-encyclopedie.mjs --check
      - name: Cartes (à jour avec les cartes Tiled)
        run: node scripts/build-map.mjs --check
      # node:test, un processus par fichier : moteur (tests/engine/), données, suivi de
      # session, rapport quotidien ; nombre de tests et durée par fichier dans le journal.
      - name: Tests (moteur, données, suivi de session, rapport quotidien)
        run: node tests/run-tests.mjs --tous
      - name: Actions de l'interface
        run: node scripts/check-actions.mjs
      - name: Modules et fichiers de la page
        run: node scripts/check-page.mjs
      - name: Construire le site
        run: node scripts/build-site.mjs
      - name: Préparer la mise en ligne
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Mise en ligne
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
