name = "family-farm"
main = "worker/src/index.js"
compatibility_date = "2026-09-01"

[[r2_buckets]]
binding = "SESSIONS"
bucket_name = "ferme-familiale-sessions"
jurisdiction = "eu"

# Les comptes des joueurs (E-0, worker/src/comptes.mjs) : un Durable Object, sa base SQLite. Cloudflare
# le crée au premier déploiement (rien à créer à la main).
[[durable_objects.bindings]]
name = "COMPTES"
class_name = "Comptes"

[[migrations]]
tag = "v1-comptes"
new_sqlite_classes = ["Comptes"]

# Le monde partagé (E-1, worker/src/monde.mjs) : un Durable Object par monde, sa base SQLite (la partie,
# le journal des commandes, les membres). Il embarque le moteur du jeu (js/engine/), regroupé au
# déploiement.
[[durable_objects.bindings]]
name = "MONDES"
class_name = "Monde"

[[migrations]]
tag = "v2-mondes"
new_sqlite_classes = ["Monde"]

# Rapport quotidien : 13 h à Paris. Cloudflare compte en UTC ; 11 h UTC = 13 h en été
# (CEST), 12 h UTC = 13 h en hiver (CET). Le Worker ignore celui qui ne tombe pas à 13 h.
[triggers]
crons = ["0 11 * * *", "0 12 * * *"]

# L'adresse du jeu, où mènent les liens de connexion et d'invitation. Elle est publique : elle vit
# ici (une variable créée à la main dans Cloudflare serait effacée au prochain déploiement).
[vars]
JEU_URL = "https://moonbloom-village.com/jeu.html"

# Journaux visibles dans Cloudflare : Workers › family-farm › Observability.
[observability]
enabled = true

# Secrets à créer dans Cloudflare (Workers › family-farm › Settings › Variables and Secrets),
# jamais dans ce fichier :
#   REPORT_GITHUB_TOKEN  jeton GitHub « fine-grained » limité au dépôt de rapports,
#                        avec la seule permission « Issues : Read and write »
#   REPORT_GITHUB_REPO   dépôt PRIVÉ qui reçoit les rapports, au format compte/depot
#   REPORT_TOKEN         (facultatif) longue chaîne aléatoire qui active GET /report
#                        pour prévisualiser ou tester la publication
#   RESEND_API_KEY       (jeu en ligne) clé de l'API de Resend, qui envoie les liens de connexion
#   COMPTE_EXPEDITEUR    (jeu en ligne) l'expéditeur des liens, d'un domaine vérifié chez Resend,
#                        « Moon Bloom Village <connexion@mail.moonbloom-village.com> »
