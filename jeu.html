<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferme Familiale</title>
<link rel="stylesheet" href="css/jeu.css">
</head>
<body>

<h1 class="visually-hidden">Ferme Familiale</h1>
<div class="player-card" id="player-card"></div>

<div id="farm-stage" hidden aria-label="Carte de la ferme"></div>
<div id="map-stage" hidden aria-label="Carte"></div>

<main>
  <section id="tab-content" class="panel"></section>
</main>

<section class="test-panel" id="test-panel" aria-labelledby="test-panel-title" hidden>
  <div class="test-panel-head">
    <h2 id="test-panel-title">🧪 Mode test</h2>
    <button class="btn" type="button" data-action="test-close" aria-label="Fermer le mode test">✕</button>
  </div>
    <div class="stack">
      <strong>Ressources</strong>
      <div class="row">
        <button class="btn" type="button" data-action="test-ressources">+20 bois, pierres, fibres, planches</button>
        <button class="btn" type="button" data-action="test-metaux">+10 minerais et lingots</button>
        <button class="btn" type="button" data-action="test-blocs">+5 de chaque bloc</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-outils">Tous les outils</button>
        <button class="btn" type="button" data-action="test-atelier">Construire l'Atelier</button>
      </div>
      <div class="row">
        <label for="test-item">Objet</label>
        <select id="test-item"></select>
        <label for="test-qty">Qté</label>
        <input id="test-qty" type="number" inputmode="numeric" min="1" max="9999" value="10" size="4">
        <button class="btn" type="button" data-action="test-item">Ajouter</button>
      </div>
      <strong>Le reste</strong>
      <div class="row">
        <button class="btn" type="button" data-action="test-add-100">+100 💰</button>
        <button class="btn" type="button" data-action="test-add-1000">+1 000 💰</button>
        <button class="btn" type="button" data-action="test-add-xp">+1 000 XP</button>
        <button class="btn" type="button" data-action="test-next-level">Niveau suivant</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-fill-batteries">Remplir les batteries</button>
        <button class="btn" type="button" data-action="test-fill-tank">Remplir le réservoir</button>
      </div>
      <div class="row">
        <label for="test-device">Appareil</label>
        <select id="test-device"></select>
        <button class="btn" type="button" data-action="test-wear">Usure à 100 %</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-seeds">+10 de chaque graine</button>
        <button class="btn" type="button" data-action="test-ripen">Faire mûrir les parcelles</button>
        <button class="btn" type="button" data-action="test-no-energy">Énergie à 0</button>
        <button class="btn" type="button" data-action="test-fill-energy">Énergie pleine</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-wheat">+50 blés</button>
        <button class="btn" type="button" data-action="test-hens">+4 poules</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-sheep">+3 moutons</button>
        <button class="btn" type="button" data-action="test-wool">Laine prête</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-cows">+2 vaches</button>
        <button class="btn" type="button" data-action="test-straw">+20 pailles</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-food">+20 de chaque aliment</button>
        <button class="btn" type="button" data-action="test-age">Vieillir l'inventaire d'une nuit</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-stations">Construire toutes les stations</button>
        <button class="btn" type="button" data-action="test-flour">+10 farines</button>
        <button class="btn" type="button" data-action="test-oil">+10 huiles</button>
        <button class="btn" type="button" data-action="test-eggs">+20 œufs</button>
        <button class="btn" type="button" data-action="test-wear-mill">User le moulin</button>
      </div>
      <div class="row">
        <label for="test-building">Bâtiment</label>
        <select id="test-building">
          <option value="potager">Zone de culture</option>
          <option value="poulailler">Poulailler</option>
          <option value="silo">Silo</option>
          <option value="panneau">Panneau solaire</option>
          <option value="batterie">Batterie</option>
          <option value="pompe">Pompe</option>
          <option value="reservoir">Réservoir</option>
        </select>
        <button class="btn" type="button" data-action="test-level5">Niveau 5</button>
        <button class="btn" type="button" data-action="test-techs">Débloquer tous les nœuds</button>
        <button class="btn" type="button" data-action="test-tech-points">+10 PT</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-serre">Construire la Serre</button>
        <button class="btn" type="button" data-action="test-verger">Construire le Verger</button>
        <button class="btn" type="button" data-action="test-fridge">Construire le Réfrigérateur</button>
        <button class="btn" type="button" data-action="test-empty-batteries">Vider les batteries</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-complete-chapter">Valider le chapitre en cours</button>
        <label for="test-chapter">Chapitre</label>
        <select id="test-chapter"></select>
        <button class="btn" type="button" data-action="test-goto-chapter">Aller au chapitre</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-skip-awake">Aller à 21 h 50</button>
        <button class="btn" type="button" data-action="test-nights-1">Passer 1 nuit</button>
        <button class="btn" type="button" data-action="test-nights-5">Passer 5 nuits</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-simulate">Simuler 60 nuits (joueur appliqué)</button>
      </div>
      <div class="row">
        <label for="test-graine">Graine</label>
        <input id="test-graine" type="text" inputmode="numeric" size="8" placeholder="au hasard">
        <button class="btn" type="button" data-action="test-ferme-generee">Essayer la ferme générée</button>
        <button class="btn" type="button" data-action="test-ferme-dessinee">Revenir à la ferme dessinée</button>
      </div>
      <div class="sim-result" id="sim-result" hidden></div>
      <details id="test-state">
        <summary>L'état de la partie (JSON)</summary>
        <div class="state-dump" id="state-dump"></div>
      </details>
    </div>
</section>

<div class="hud" id="hud"></div>
<div class="sleep-fab" id="sleep-fab"></div>
<div class="tool-bar" id="tool-bar" hidden></div>
<div class="side-menu" id="side-menu">
  <nav class="bottom-nav" id="bottom-nav" aria-label="Menu principal"></nav>
  <button type="button" class="side-tab" id="side-tab" data-action="menu-toggle" aria-controls="bottom-nav" aria-expanded="false" aria-label="Ouvrir le menu" title="Menu"></button>
</div>
<div id="tuto-root"></div>
<div id="window-root"></div>
<div id="modal-root"></div>
<div id="toast-root" role="status" aria-live="polite"></div>


<script src="js/telemetry.js"></script>

<script src="js/carte/ferme/sol.js"></script>
<script src="js/carte/ferme/decor.js"></script>
<script src="js/carte/ferme/soleil.js"></script>

<script src="js/carte/ferme/camera.js"></script>
<script src="js/carte/ferme/etiquettes.js"></script>
<script src="js/carte/ferme/hache.js"></script>
<script src="js/carte/ferme/pioche.js"></script>
<script src="js/carte/ferme/coupfort.js"></script>
<script src="js/carte/ferme/cueillette.js"></script>
<script src="js/carte/ferme/chantier.js"></script>
<script src="js/carte/ferme/etage.js"></script>
<script src="js/carte/ferme/toits.js"></script>
<script src="js/carte/ferme/peche.js"></script>
<script src="js/carte/ferme/passages.js"></script>
<script src="js/carte/ferme/machines.js"></script>
<script src="js/carte/ferme/modele.js"></script>
<script src="js/farm-stage.js"></script>
<script src="js/carte/ville/config.js"></script>
<script src="js/carte/ville/circulation.js"></script>
<script src="js/carte/ville/ecole.js"></script>
<script src="js/carte/ville/hud.js"></script>
<script src="js/carte/ville/marche.js"></script>
<script src="js/carte/ville/train.js"></script>
<script src="js/carte/ville/navette.js"></script>

</body>
</html>
