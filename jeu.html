<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ferme Familiale</title>
<style>
:root {
  --color-sun: #f2a71b;
  --color-sun-dark: #d68c0c;
  --color-leaf: #4f8a3d;
  --color-leaf-dark: #386b2a;
  --color-earth: #8a5a34;

  --bg: #faf6ee;
  --bg-elevated: #ffffff;
  --bg-header: #fef3dc;
  --bg-muted: #f1ebdc;
  --text: #2c2416;
  --text-muted: #6b5f4a;
  --border: #e3d9c2;
  --accent: var(--color-leaf);
  --accent-contrast: #ffffff;
  --accent-secondary: var(--color-sun);
  --danger: #c1442e;
  --danger-contrast: #ffffff;
  --shadow: 0 1px 3px rgba(44, 36, 22, 0.12);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1a14;
    --bg-elevated: #26231b;
    --bg-header: #2c2718;
    --bg-muted: #2a271e;
    --text: #f2ecdd;
    --text-muted: #b9ae95;
    --border: #3c3626;
    --accent: #6fae5a;
    --accent-contrast: #10230d;
    --accent-secondary: #f2a71b;
    --danger: #e0664c;
    --danger-contrast: #2a0d06;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Le masquage du défilement horizontal est sur html seul : avec overflow sur html ET body,
   body devient un conteneur de défilement et le bandeau « sticky » ne reste plus en haut. */
html {
  overflow-x: hidden;
}

body {
  padding-bottom: 24px;
}

button {
  font-family: inherit;
  font-size: 1rem;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.app-title {
  font-weight: 700;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}

.indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:active { transform: translateY(1px); }

main {
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}

/* Barre de menu du bas : fixée ; le bouton « Zzz » flotte juste au-dessus, à droite. */
:root { --dock: calc(60px + env(safe-area-inset-bottom)); }

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 55;
  display: flex;
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--bg-elevated);
  border-top: 1px solid var(--border);
}

.nav-btn {
  flex: 1 1 0;
  min-width: 0;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px 2px;
  border: 0;
  border-top: 3px solid transparent;
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  cursor: pointer;
}

.nav-btn.active {
  color: var(--accent);
  border-top-color: var(--accent);
  background: var(--bg-muted);
}

.nav-icon { position: relative; font-size: 1.5rem; line-height: 1; }
.nav-label { font-size: 0.75rem; font-weight: 600; }

.nav-badge {
  position: absolute;
  top: -6px;
  right: -12px;
  min-width: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--danger);
  color: var(--danger-contrast);
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
}

.ferme-links {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 12px;
}

.ferme-link {
  flex: 1 1 auto;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}

.notif-list {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.notif {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  border-left-width: 5px;
  background: var(--bg-muted);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.notif.p1 { border-left-color: var(--danger); }
.notif.p2 { border-left-color: var(--color-sun-dark); }
.notif.p3 { border-left-color: var(--accent); }
.notif-icon { font-size: 1.4rem; }
.notif-text { flex: 1 1 auto; min-width: 0; font-weight: 600; }
.notif-go { color: var(--text-muted); font-size: 1.4rem; }
.notif-empty { padding: 12px 0; }

/* Version 1.3 : le courrier. Une lettre non lue se remarque ; la lettre ouverte est une
   feuille de papier (mêmes couleurs en thème clair et en thème sombre). */
.notif.mail { border-left-color: #b9772a; }
.notif.mail.lu { opacity: 0.8; }
.notif.mail:not(.lu) { background: #fff6dc; color: #3a2a12; border-color: #d9b56a; border-left-color: #b9772a; }
.notif.mail:not(.lu) .notif-where { color: #6b5330; }
.mail-new { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: #b9772a; color: #ffffff; font-size: 0.72rem; font-weight: 700; vertical-align: middle; }
.mail-title { margin-top: 18px; }
.modal.letter { background: #fdf6e3; color: #3a2a12; border: 1px solid #d9c9a0; }
.modal.letter h2 { color: #3a2a12; }
.letter-place { margin: 0 0 4px; text-align: right; font-style: italic; color: #6b5330; }
.letter-body { margin: 10px 0; font-family: Georgia, 'Times New Roman', serif; font-size: 1.02rem; line-height: 1.55; }
.letter-body p { margin: 0 0 10px; }
.letter-sign { margin: 0 0 14px; text-align: right; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 1.05rem; }
.letter-gifts { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; padding: 10px 12px; border: 1px dashed #b9772a; border-radius: var(--radius); background: #fff9ea; }
.letter-gifts .muted { color: #6b5330; }
.letter-gift-list { font-size: 1.05rem; font-weight: 700; }

.panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 16px;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.panel p.hint {
  color: var(--text-muted);
  margin: 0;
}

.btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}

.btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-contrast);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stack { display: flex; flex-direction: column; gap: 12px; }

textarea, input[type="text"] {
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  padding: 0;
}

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
}

.modal {
  background: var(--bg-elevated);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px 16px 28px;
  box-shadow: var(--shadow);
}

/* Version 1.1 : fenêtre « Modifier » d'un membre de la famille, et menu du Moulin. */
.member-name { overflow-wrap: anywhere; }
.member-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-muted);
  font-size: 1.15rem;
}
.member-preview .portrait-emoji { font-size: 2.6rem; }
.member-field { gap: 6px; }
.member-modal input.member-input {
  font-family: inherit;
  font-size: 1.05rem;
}
.choice-row, .swatch-row { gap: 8px; flex-wrap: wrap; }
.choice-btn { flex: 1 1 120px; gap: 8px; }
.choice-emoji { font-size: 1.5rem; line-height: 1; }
.swatch-btn { min-width: 48px; padding: 0 6px; font-size: 1.6rem; line-height: 1; }
.choice-btn.active, .swatch-btn.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  font-weight: 700;
}
.choice-btn:focus-visible, .swatch-btn:focus-visible { outline: 3px solid var(--color-sun); outline-offset: 2px; }
.mill-stock { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 1.05rem; }

/* Version 1.2 : composer la famille, animaux de compagnie. */
.family-count { margin: 0 0 10px; }
.family-add { gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
.family-add .btn { flex: 1 1 150px; }
.member-leave { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); gap: 6px; }
.pet .portrait-emoji { font-size: 2rem; }

@media (min-width: 640px) {
  .modal { border-radius: var(--radius); }
}

.modal h2 {
  margin-top: 0;
}

.modal-close {
  float: right;
}

details.test-panel {
  margin-top: 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  background: var(--bg-muted);
}

details.test-panel summary {
  cursor: pointer;
  font-weight: 600;
  padding: 8px 0;
  min-height: 28px;
}

.state-dump {
  white-space: pre-wrap;
  word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  max-height: 260px;
  overflow-y: auto;
}

/* ---------- Lot 1 : en-tête, cartes, appareils, interrupteurs, Dormir ---------- */

.app-header { flex-wrap: wrap; }

.indicators {
  order: 3;
  width: 100%;
  justify-content: space-between;
  gap: 8px 12px;
}

.indicator {
  white-space: nowrap;
}

@media (min-width: 640px) {
  .indicators { justify-content: flex-start; gap: 8px 28px; }
}

.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (min-width: 640px) {
  .cards { grid-template-columns: 1fr 1fr; }
}

.card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  width: 100%;
  min-width: 0;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font: inherit;
}

button.card { cursor: pointer; min-height: 44px; }
button.card:active { transform: translateY(1px); }

.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
  font-size: 1.05rem;
}

.card-title .chevron { color: var(--text-muted); font-weight: 400; }

.big {
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.muted { color: var(--text-muted); font-size: 0.9rem; }

/* ---------- bandeau de choix sur le suivi ---------- */
.consent-banner {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 60;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  background: var(--bg-elevated);
  color: var(--text);
  border-top: 1px solid var(--border);
  box-shadow: 0 -2px 10px rgba(44, 36, 22, 0.15);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.consent-banner p { margin: 0; font-size: 0.92rem; line-height: 1.45; }
.consent-banner a { color: var(--accent); font-weight: 600; }
.consent-banner .row .btn { flex: 1; }
@media (min-width: 720px) {
  .consent-banner { flex-direction: row; align-items: center; justify-content: center; gap: 24px; }
  .consent-banner p { max-width: 640px; }
  .consent-banner .row .btn { flex: none; min-width: 120px; }
}
.num { font-variant-numeric: tabular-nums; }

.alert {
  color: var(--danger);
  font-weight: 600;
  font-size: 0.9rem;
}

.chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.chip.panne { background: var(--danger); border-color: var(--danger); color: var(--danger-contrast); }
.chip.warn { border-color: var(--danger); color: var(--danger); }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.bar {
  display: block;
  height: 10px;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  background: var(--accent);
}

.bar-fill.warn { background: var(--color-sun); }
.bar-fill.bad { background: var(--danger); }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 14px 0 6px;
  border-radius: 999px;
  border: 2px solid var(--danger);
  background: var(--danger);
  color: var(--danger-contrast);
  font-weight: 700;
  cursor: pointer;
}

.switch .knob {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--shadow);
}

.switch[aria-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
  flex-direction: row-reverse;
  padding: 0 6px 0 14px;
}

.switch:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.switch:focus-visible, .btn:focus-visible, .card:focus-visible, .nav-btn:focus-visible, .ferme-link:focus-visible {
  outline: 3px solid var(--color-sun);
  outline-offset: 2px;
}

.device-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.device-actions .btn { padding: 0 12px; }

.device-list { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }

.screen-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.screen-head h2 { margin: 0; }

/* Bouton « Zzz » (Dormir) : rond, flottant en bas à droite de l'écran, au-dessus du menu
   du bas, sur tous les onglets. Désactivé, il affiche les secondes restantes. */
.sleep-fab {
  position: fixed;
  right: calc(12px + env(safe-area-inset-right));
  bottom: calc(var(--dock) + 12px);
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none; /* seuls le bouton et la pastille reçoivent les appuis */
}

.sleep-fab > * { pointer-events: auto; }

.sleep-fab .sleep-btn {
  width: 56px;
  height: 56px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: var(--accent);
  color: var(--accent-contrast);
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
}

.sleep-fab .sleep-btn:active { transform: translateY(1px); }

.sleep-fab .sleep-btn:disabled {
  border-color: var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: not-allowed;
}

.sleep-fab .sleep-wait {
  font-size: 0.72rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.report-list { list-style: none; margin: 12px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

/* Résumé de réveil allégé */
.wake-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
.wake-kpi { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: var(--radius); background: var(--bg-muted); border: 1px solid var(--border); }
.wake-kpi strong { font-size: 1.4rem; }
.wake-harvest { margin: 0 0 12px; line-height: 1.5; }
.wake-actions { margin-top: 12px; justify-content: flex-end; }
.btn.btn-pill { border-radius: 999px; min-width: 44px; }

select {
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  padding: 0 8px;
  font: inherit;
  max-width: 100%;
}

.toast {
  position: fixed;
  bottom: 88px;
  left: 16px;
  right: 16px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--text);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 200;
  text-align: center;
}

/* ---------- Lot 2 : potager, famille, inventaire, aperçu du repas ---------- */

body { padding-bottom: calc(88px + var(--dock)); } /* menu du bas + bouton « Zzz » : la fin du contenu passe au-dessus du bouton */
.toast { bottom: calc(84px + var(--dock)); }

/* Aperçu du repas : une pastille à côté du bouton « Zzz », seulement si le repas prévu est insuffisant. */
.sleep-fab .meal-chip {
  min-height: 28px;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 10px;
}

.section-head h3, .section-title { margin: 0; font-size: 1.05rem; }
.section-title { margin-top: 22px; margin-bottom: 10px; }

.plots {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

@media (min-width: 640px) {
  .plots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.plot { padding: 12px; gap: 6px; }
.plot.mature { border-color: var(--accent); border-width: 2px; }
.plot .btn { width: 100%; padding: 0 8px; font-size: 0.92rem; }
.plot-foot { margin-top: 12px; }

.portraits {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}

@media (min-width: 640px) {
  .portraits { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.portrait { align-items: flex-start; }
.portrait .btn { width: 100%; padding: 0 8px; font-size: 0.92rem; }
.portrait-emoji { font-size: 2.2rem; line-height: 1.1; }
.portrait .bar { width: 100%; }

.inv-group { margin: 12px 0 20px; }
.inv-group h3 { margin: 0 0 8px; font-size: 1.05rem; }

.inv-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.inv-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
}

.reserve { gap: 10px; }
.step-btn { min-width: 44px; padding: 0; font-size: 1.3rem; line-height: 1; }

.plant-choice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  width: 100%;
  padding: 8px 14px;
  text-align: left;
}

.modal .stack { margin: 12px 0; }

/* ---------- Lot 3 : inventaire par lots, Marché ---------- */

.subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 8px;
}

.subtab-btn {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 600;
}

.subtab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}


.subtab-btn:focus-visible { outline: 3px solid var(--color-sun); outline-offset: 2px; }

.lot-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lot-list li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}

.lot-list li.soon-spoil { color: var(--danger); font-weight: 600; }

.chip.badge { border-color: var(--color-sun-dark); color: var(--color-sun-dark); }

@media (prefers-color-scheme: dark) {
  .chip.badge { border-color: var(--color-sun); color: var(--color-sun); }
}

.shop-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.shop-row > .btn { width: 100%; }
.shop-row.unavailable > :not(.btn) { opacity: 0.7; }

.qty-row { gap: 8px; }
.qty-row .qty { min-width: 2.5ch; text-align: center; font-weight: 700; font-size: 1.1rem; }
.qty-row .sell-go { flex: 1 1 140px; }


/* ---------- Lot 6 : Pâturage et moutons ---------- */

.sheep-list { margin-top: 12px; }
.sheep.ready { border-color: var(--accent); border-width: 2px; background: var(--bg-elevated); }
.sheep .device-actions .btn { flex: 1 1 130px; }

/* ---------- Lot 5 : ateliers (Ferme) et Livre de recette ---------- */

.station.busy { border-color: var(--color-sun-dark); }

.recipes {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.recipe.ready { border-color: var(--accent); border-width: 2px; background: var(--bg-elevated); }
.recipe.unavailable .card-title, .recipe.unavailable .muted { opacity: 0.75; }
.recipe .btn { width: 100%; }

.ingredients {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}

.ingredients .missing { color: var(--danger); font-weight: 600; }

/* ---------- Lot 7 : arbre des technologies et automatisations ---------- */

.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.branch { margin: 8px 0 22px; }
.branch-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.branch-head h3 { margin: 0; font-size: 1.1rem; }
.branch-nodes { display: flex; flex-direction: column; gap: 12px; }
.tech-node .desc { font-size: 0.95rem; }
.tech-node.available { border-color: var(--accent); border-width: 2px; background: var(--bg-elevated); }
.tech-node.owned { border-color: var(--accent); }
.tech-node.locked .card-title, .tech-node.locked .desc { opacity: 0.75; }
.tech-node .btn { width: 100%; }
.prereqs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 0.95rem; }
.prereqs .missing { color: var(--danger); font-weight: 600; }
.level-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; border-radius: var(--radius); border: 1px dashed var(--border); }
.level-row .level-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.level-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.level-row .chip { white-space: normal; }
.chip.auto { border-color: var(--accent); color: var(--accent); }
.season-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.season-card .bar { margin-top: 2px; }
.fridge.cold { border-color: var(--accent); }
.fridge.warm { border-color: var(--danger); border-width: 2px; }
.tree.adult { border-color: var(--accent); }
.tree.free { border-style: dashed; }
.semis-choice { justify-content: flex-start; text-align: left; height: auto; min-height: 44px; padding: 8px 12px; flex-direction: column; align-items: flex-start; gap: 2px; }
.semis-choice > span { display: block; }
.semis-choice[aria-pressed="true"] { border-color: var(--accent); border-width: 2px; }

/* ---------- Lot 9 : chapitres et autonomie ---------- */

.indicator-btn {
  min-height: 44px;
  padding: 0 8px;
  border: 0;
  border-radius: var(--radius);
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
.indicator-btn:focus-visible { outline: 3px solid var(--color-sun); outline-offset: 2px; }
.chapter-card { border-color: var(--accent); border-width: 2px; background: var(--bg-elevated); margin-bottom: 12px; }
.chapter-card.done { border-color: var(--color-sun-dark); }
.objectives { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.objective { display: flex; flex-direction: column; gap: 4px; }
.objective-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.objective.ok .objective-label { color: var(--accent); font-weight: 700; }
.objective-value { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.unlock-list { list-style: none; margin: 8px 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.unlock-list li { padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--accent); background: var(--bg-muted); }
.modal h3 { margin: 12px 0 4px; font-size: 1.05rem; }
#chapter-close { margin-top: 16px; }
.autonomy-card { margin-bottom: 12px; }
.chart { display: block; width: 100%; max-width: 480px; height: auto; }
.chart-grid { stroke: var(--border); stroke-width: 1; }
.chart-label { fill: var(--text-muted); font-size: 9px; }
.chart-empty { fill: var(--text-muted); font-size: 10px; }
.chart-bar { fill: var(--accent); }
.chart-bar.full { fill: var(--color-sun-dark); }
.chart-target { stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart-curve { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart-raw { fill: none; stroke: var(--text-muted); stroke-width: 1; opacity: 0.55; }
.chart-death { fill: var(--danger); opacity: 0.18; }
.sim-result { display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); }
.sim-result p { margin: 0; font-size: 0.85rem; }

/* ---------- Lot 11 : accessibilité (contrastes, focus, cibles de 44 px) ---------- */

/* Contrastes AA mesurés (texte ≥ 4,5:1, contours ≥ 3:1) : vert et rouge un peu
   plus foncés en clair, rouge un peu plus clair en sombre, ambre lisible pour
   les pastilles, anneau de focus visible sur tous les fonds. */
:root {
  --accent: #3a7530;
  --danger: #b23a25;
  --warn-text: #855400;
  --focus: #a35a00;
}

@media (prefers-color-scheme: dark) {
  :root {
    --accent: #6fae5a;
    --danger: #ea7a61;
    --warn-text: #f2a71b;
    --focus: #f2a71b;
  }
}

.chip.badge { border-color: var(--warn-text); color: var(--warn-text); }
.chart-bar.full { fill: var(--warn-text); }
.chapter-card.done, .station.busy { border-color: var(--warn-text); }

:where(button, a[href], input, select, textarea, summary, [tabindex]):focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

details.test-panel summary { min-height: 44px; display: flex; align-items: center; }
.check-row { min-height: 44px; gap: 12px; cursor: pointer; }
.check-row input[type="checkbox"] { width: 24px; height: 24px; margin: 0; accent-color: var(--accent); }

/* ---------- Lot 11 : notifications ---------- */

#toast-root {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(84px + var(--dock));
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}

#toast-root .toast {
  position: static;
  width: 100%;
  max-width: 480px;
  margin: 0;
  pointer-events: auto;
  font-weight: 600;
}

#toast-root .toast.alerte {
  background: var(--danger);
  color: var(--danger-contrast);
}

/* Notification qui mène au menu concerné : un bouton, sur toute la largeur. */
#toast-root .toast-link {
  border: 0;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
#toast-root .toast-link:focus-visible { outline: 3px solid var(--color-sun); outline-offset: 2px; }
.toast-go { display: inline-block; margin-left: 4px; font-weight: 800; }
.wake-hour { margin: -4px 0 8px; font-size: 0.85rem; }

/* ---------- Lot 11 : illustrations SVG ---------- */

/* Couleurs des dessins (le sprite est dans la page, les <use> en héritent). */
:root {
  --a-soil: #9b6a43; --a-soil2: #6f4526; --a-leaf: #5b9e3f; --a-leaf2: #3f7d2c;
  --a-orange: #e8792b; --a-red: #d63b2f; --a-yellow: #f2c230; --a-yellow2: #b98a12;
  --a-purple: #6b3a86; --a-green: #2f6e2a; --a-brown: #8a5a2b; --a-white: #fdfaf3;
  --a-line: #5c4a36; --a-dark: #3b3024; --a-grey: #a9b1b6; --a-grey2: #6d777d;
  --a-blue: #3d6fb6; --a-blue2: #9cc3ef; --a-wood: #a0703f; --a-roof: #b5452f;
  --a-brick: #c0643f; --a-glass: #d6eef6; --a-sun: #f2a71b; --a-skin: #efc4b0;
  --a-egg: #f6e7cc; --a-water: #4a90d9;
}

@media (prefers-color-scheme: dark) {
  :root {
    --a-soil: #8c613f; --a-soil2: #5e3c22; --a-white: #efe8da; --a-line: #d9ccb4;
    --a-dark: #15110c; --a-grey: #8b949a; --a-glass: #3b5561; --a-egg: #eadbbd;
  }
}

.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.art { display: block; width: 48px; height: 48px; flex: none; overflow: visible; }
.art-icon { display: inline-block; width: 28px; height: 28px; vertical-align: -7px; margin-right: 6px; }
.plot-art { width: 56px; height: 56px; margin: 0 auto; }
.tree .plot-art { width: 64px; height: 64px; }
.card-art-row { display: flex; align-items: center; gap: 10px; }
.card-art-row .art { width: 56px; height: 56px; }
.egg-art { width: 28px; height: 28px; }
.art-hidden { visibility: hidden; }
.sheep .card-art-row .art { width: 64px; height: 64px; }

/* ---------- Lot 11 : aide des bâtiments ---------- */

.help-btn {
  min-width: 44px;
  width: 44px;
  padding: 0;
  border-radius: 50%;
  font-weight: 700;
  font-size: 1.1rem;
  line-height: 1;
  flex: none;
}

.card-title .chips { flex-wrap: nowrap; align-items: center; }
.help-list { margin: 8px 0 16px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
.help-list li { padding: 10px 12px; border-radius: var(--radius); background: var(--bg-muted); border: 1px solid var(--border); }
.help-list strong { display: block; margin-bottom: 2px; }
.help-head { display: flex; align-items: center; gap: 12px; }
.help-head h2 { margin: 0; }

/* ---------- Lot 11 : bulles d'aide de la première partie ---------- */

.tuto {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(118px + var(--dock));
  z-index: 60;
  max-width: 560px;
  margin: 0 auto;
  padding: 14px 16px 12px;
  border-radius: var(--radius);
  border: 2px solid var(--accent);
  background: var(--bg-elevated);
  color: var(--text);
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
}

.tuto::after {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 50%;
  width: 16px;
  height: 16px;
  background: var(--bg-elevated);
  border-right: 2px solid var(--accent);
  border-bottom: 2px solid var(--accent);
  transform: translateX(-50%) rotate(45deg);
}

.tuto.up::after { display: none; }
/* Bulle « Dormir » : calée à droite, la pointe au-dessus du bouton « Zzz » ; elle descend
   près du bouton quand le bandeau de choix sur le suivi n'occupe plus le bas de l'écran. */
.tuto:not(.up) { margin-right: 0; }
body:not(:has(#consent-banner)) .tuto:not(.up) { bottom: calc(86px + var(--dock)); }
.tuto:not(.up)::after { left: auto; right: 16px; transform: rotate(45deg); }
.tuto h2 { margin: 0 0 4px; font-size: 1.05rem; display: flex; justify-content: space-between; gap: 8px; }
.tuto p { margin: 0 0 10px; font-size: 0.95rem; }
.tuto .row { justify-content: flex-end; }
body.has-tuto { padding-bottom: calc(300px + var(--dock)); }

.tuto-target {
  scroll-margin-top: 140px;
  outline: 3px dashed var(--accent);
  outline-offset: 4px;
  border-radius: var(--radius);
  animation: tuto-pulse 1.6s ease-in-out infinite;
}

@keyframes tuto-pulse {
  0%, 100% { outline-color: var(--accent); }
  50% { outline-color: transparent; }
}

/* ---------- Lot 11 : À propos ---------- */

.about-rules { margin: 8px 0 16px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.about-version { font-variant-numeric: tabular-nums; }

/* ---------- Lot 11 : rendu par tranches et animations ---------- */

/* Chaque tranche de la Ferme est mise à jour à part ; elle n'ajoute aucune boîte. */
.slot { display: contents; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
/* ---------- Carte Phaser : zone entre le bandeau et le menu du bas ---------- */
:root { --header-h: 56px; }
#farm-stage {
  position: fixed;
  left: 0;
  right: 0;
  top: var(--header-h);
  bottom: var(--dock);
  z-index: 5;
  overflow: hidden;
  background: #699654;
  touch-action: none; /* le doigt fait glisser la carte, pas la page */
  -webkit-user-select: none;
  user-select: none;
}
#farm-stage[hidden] { display: none; }
/* La taille réelle du canvas (× densité de l'écran) est gérée par farm-stage.js. */
#farm-stage canvas { display: block; width: 100% !important; height: 100% !important; image-rendering: pixelated; cursor: grab; }
body.has-stage main { display: none; }
body.has-stage { padding-bottom: 0; }

/* ---------- Fenêtres de la carte : au-dessus de la carte et du menu, sous les fenêtres de #modal-root ---------- */
.window-layer {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.window-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
}
.stage-window {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 720px;
  max-height: 88vh;
  max-height: 88dvh;
  background: var(--bg);
  border-radius: var(--radius) var(--radius) 0 0;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}
.stage-window.tall { height: 88vh; height: 88dvh; }
.window-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px 8px 16px;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
}
.window-head h2 { margin: 0; font-size: 1.15rem; }
.window-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
}
.window-body > :first-child { margin-top: 0; }
.window-body > .subtabs:first-child { margin-top: 0; }
@media (min-width: 640px) {
  .window-layer { align-items: center; padding: 16px; }
  .stage-window { border-radius: var(--radius); }
}
.modal a { color: var(--accent); font-weight: 600; }

/* ---------- 1.1 : navigation de la carte (étiquettes, points, objectif, fenêtres, bandeau) ---------- */

/* Bandeau : la nuit et l'heure à côté du titre ; dessous, une rangée d'indicateurs. Chaque
   indicateur a sa valeur et, en petit, sa légende. Ceux qui mènent quelque part sont des boutons. */
.app-title { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.app-clock { display: flex; align-items: stretch; gap: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
.indicators { gap: 4px 6px; align-items: stretch; }
.indicator { flex-direction: column; justify-content: center; gap: 1px; line-height: 1.15; }
.ind-val { display: flex; align-items: center; gap: 4px; }
.ind-leg { font-size: 0.68rem; font-weight: 600; color: var(--text-muted); }
.indicator-btn { padding: 2px 8px; border: 1px solid var(--border); background: var(--bg-elevated); box-shadow: var(--shadow); }
.indicator-btn:active { transform: translateY(1px); }

/* Étiquettes des bâtiments : en DOM, par-dessus le canvas, replacées à chaque image par
   farm-stage.js. Elles ne prennent pas les appuis : la carte glisse aussi quand le doigt part
   d'une étiquette, et c'est la scène qui reconnaît un appui dessus.
   Version 1.1.1 : le nom ne s'affiche qu'au survol du lieu (classe `show`, posée par la
   scène : souris dessus, doigt posé, ou focus clavier). Sans survol, il ne reste que la
   pastille « à faire » ; sans pastille, rien du tout. */
.stage-labels { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
.stage-label {
  position: absolute;
  left: 0;
  top: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 22px;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid rgba(44, 36, 22, 0.45);
  background: rgba(255, 250, 238, 0.94);
  color: #2c2416;
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  pointer-events: none;
  will-change: transform;
}
.stage-label.todo { border-color: #c1442e; }
.stage-label:not(.show) { min-height: 0; padding: 0; border-color: transparent; background: none; box-shadow: none; }
.stage-label:not(.show) .stage-label-name { display: none; }
.stage-label:not(.show):not(.todo) { opacity: 0; }
.stage-label:not(.show) .stage-label-badge { box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); border: 1px solid #ffffff; }
.stage-label:focus-visible { outline: 3px solid var(--color-sun); outline-offset: 2px; }
.stage-label-badge {
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: #c1442e;
  color: #ffffff;
  font-size: 0.7rem;
  line-height: 17px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.stage-label-badge[hidden] { display: none; }

/* Objectif du chapitre : une ligne en haut de la carte ; un appui ouvre la fenêtre Chapitres. */
.stage-hud {
  position: absolute;
  top: 2px;
  left: calc(8px + env(safe-area-inset-left));
  right: calc(8px + env(safe-area-inset-right));
  z-index: 6;
  display: flex;
  pointer-events: none;
}
.stage-chip {
  min-width: 0;
  max-width: 100%;
  min-height: 44px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  display: flex;
  align-items: center;
  cursor: pointer;
  pointer-events: auto;
}
.stage-chip-pill {
  position: relative;
  min-width: 0;
  max-width: 100%;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 0.85rem;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  overflow: hidden;
}
.stage-chip:focus-visible { outline: none; }
.stage-chip:focus-visible .stage-chip-pill { outline: 3px solid var(--color-sun); outline-offset: 1px; }
.stage-chip:active .stage-chip-pill { transform: translateY(1px); }
.stage-chip-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-chip-val { flex: none; color: var(--text-muted); white-space: nowrap; }
.stage-chip-go { flex: none; color: var(--text-muted); font-size: 1.1rem; line-height: 1; }
.stage-chip-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--bg-muted); }
.stage-chip-bar > span { display: block; height: 100%; background: var(--accent); }

/* Les trois points (un par écran de la carte) et les flèches des bords. */
.stage-dots {
  position: absolute;
  left: 50%;
  bottom: 0;
  z-index: 6;
  transform: translateX(-50%);
  display: flex;
}
.stage-dots::before {
  content: "";
  position: absolute;
  left: 6px;
  right: 6px;
  top: 50%;
  height: 22px;
  margin-top: -11px;
  border-radius: 999px;
  background: rgba(28, 26, 20, 0.5);
}
.stage-dot {
  position: relative;
  width: 36px;
  height: 44px;
  padding: 0;
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.stage-dot > span { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); transition: transform 0.15s, background 0.15s; }
.stage-dot.active > span { background: #ffffff; transform: scale(1.35); }
.stage-dot:focus-visible { outline: 3px solid var(--color-sun); outline-offset: -6px; border-radius: 999px; }
.stage-arrow {
  position: absolute;
  top: 27%; /* au-dessus de la zone de culture, sous la ligne de l'objectif */
  z-index: 6;
  width: 44px;
  height: 56px;
  margin-top: -28px;
  padding: 0;
  border: 0;
  background: none;
  color: #ffffff;
  display: flex;
  align-items: center;
  cursor: pointer;
}
.stage-arrow.gauche { left: 0; justify-content: flex-start; }
.stage-arrow.droite { right: 0; justify-content: flex-end; }
.stage-arrow > span {
  width: 24px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(28, 26, 20, 0.5);
  font-size: 1.6rem;
  line-height: 1;
  padding-bottom: 4px;
  animation: stage-arrow 1.6s ease-in-out infinite;
}
.stage-arrow.gauche > span { border-radius: 0 12px 12px 0; --pousse: -3px; }
.stage-arrow.droite > span { border-radius: 12px 0 0 12px; --pousse: 3px; }
.stage-arrow:focus-visible { outline: 3px solid var(--color-sun); outline-offset: -4px; }
@keyframes stage-arrow {
  0%, 100% { transform: translateX(0); opacity: 0.85; }
  50% { transform: translateX(var(--pousse)); opacity: 1; }
}

/* Fenêtres de la carte : deux tailles seulement, demi-hauteur ou pleine hauteur. Le ✕ est
   toujours au même endroit dans chacune. */
.stage-window.half { height: 54vh; height: 54dvh; }
.stage-window.tall { height: 92vh; height: 92dvh; max-height: 92vh; max-height: 92dvh; }
.window-head { min-height: 61px; }
.window-head h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.window-detail { font-size: 0.92rem; font-weight: 500; color: var(--text-muted); }
.window-tabs { flex: none; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
.window-tabs .subtabs { margin: 0; }
/* Le titre de la fenêtre dit déjà où l'on est : le premier titre du contenu, qui le répète,
   est masqué ici (la liste classique de la Ferme garde les siens). */
.window-body.sans-titre > h2:first-child,
.window-body.sans-titre > .section-head:first-child > h2,
.window-body.sans-titre > .section-head:first-child > h3 { display: none; }
.window-body.sans-titre > .section-head:first-child { justify-content: flex-end; }
.window-body .ancre { scroll-margin-top: 8px; }
main .ancre { scroll-margin-top: 150px; }

/* Sous-onglets (Maison, Inventaire, Marché) : toujours une seule rangée. À partir de quatre
   onglets sur un téléphone, seul l'onglet ouvert affiche son nom. */
.subtabs { flex-wrap: nowrap; gap: 6px; }
.subtab-btn {
  flex: 1 1 auto;
  min-width: 44px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 0.92rem;
  overflow: hidden;
}
.subtab-icon { flex: none; }
.subtab-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 639px) {
  .subtabs.compact .subtab-btn { flex: 0 0 44px; padding: 0; }
  .subtabs.compact .subtab-btn:not(.active) .subtab-label {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
  }
  .subtabs.compact .subtab-btn.active { flex: 1 1 auto; padding: 0 10px; }
  .subtabs.compact .subtab-btn.active .subtab-label { white-space: normal; text-align: left; font-size: 0.9rem; line-height: 1.1; }
}

/* Notifications : où mène la ligne. */
.notif-where { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
</style>
</head>

<script id="core">
'use strict';

/* ==========================================================================
   DATA — toutes les valeurs d'équilibrage du jeu.
   Chaque lot y a ajouté ses valeurs, par section. Aucune valeur d'équilibrage
   ne doit exister ailleurs que dans DATA.
   Références : conception v15, sections 1.2, 1.4 et 8.2.
   ========================================================================== */
const DATA = {
  // Départ de partie.
  START: {
    PIECES: 350,
    // Les appareils de départ sont offerts : prix d'achat 0, donc entretien
    // et réparation gratuits pour eux (l'entretien vaut 20 % du prix d'achat).
    DEVICE_PRICE: 0,
    // Inventaire de départ (section 8.1) : 160 conserves = 10 nuits, plus le kit de graines.
    INVENTAIRE: { conserve: 160, graine_carotte: 10, patate: 6, graine_tomate: 4 },
  },

  // Temps : la journée commence à 6 h au réveil.
  // SECONDS_PER_HOUR : durée d'une « heure de marche » des appareils (usure,
  // voir WEAR.HEURES_PAR_POINT). Ne pas la changer pour régler l'horloge.
  // CLOCK_SECONDS_PER_HOUR : l'horloge affichée au joueur avance d'une heure
  // toutes les 18 s d'éveil (version 1.1.3 ; 5 s auparavant). Voir hourOfDay()
  // et clockHours().
  // MEAL_HOUR (version 1.1.1) : à 19 h, la famille prend son repas (takeMeal()).
  // NIGHT_HOUR : à 22 h (version 1.1.3 ; minuit auparavant), la journée est
  // finie : la nuit se déroule d'elle-même si le joueur n'a pas cliqué sur
  // Dormir (bedtimeDue() ; c'est l'interface qui déclenche). La journée dure
  // donc de 6 h à 22 h : 16 heures de 18 s, soit 288 s.
  TIME: {
    DAY_START_HOUR: 6,
    SECONDS_PER_HOUR: 30,
    CLOCK_SECONDS_PER_HOUR: 18,
    MIN_AWAKE_S: 30,
    MEAL_HOUR: 19,
    NIGHT_HOUR: 22,
  },

  LEVEL_MAX: 5,

  // Grilles par niveau (index 0 = niveau 1), identiques pour chaque appareil
  // d'un même type.
  GRID: {
    // Énergie en entiers : Wh côté données, mWh dans l'état (1 Wh = 1 000 mWh).
    panneau: { whParS: [30, 50, 80, 120, 180] },
    // pleine : part de la capacité utile au-delà de laquelle une batterie qui ne
    // charge plus s'affiche « Pleine » (Lot 11 : sortie du moteur vers DATA).
    batterie: { wh: [5000, 10000, 20000, 40000, 80000], pleine: 98 }, // pleine en %
    pompe: {
      litresPerS: [1, 2, 4, 6, 10],
      reservoirL: [40, 80, 160, 300, 500], // le réservoir suit le niveau de la pompe
    },
  },

  // Coût pour atteindre un niveau (index 0 = niveau 1, non utilisé).
  UPGRADE_COST: [0, 40, 100, 250, 600],

  PUMP: { WH_PAR_L: 10 }, // 10 Wh par litre, soit 10 mWh par mL

  // Achat d'un appareil supplémentaire : base × growth^n, n = nombre déjà possédé.
  PURCHASE: {
    panneau: { base: 60, growth: 120 },
    batterie: { base: 80, growth: 120 },
  },

  // Usure : en points entiers (0 à 100), +1 point toutes les HEURES_PAR_POINT
  // heures de marche. Rendement (%) = 100 − ⌊usure × 100 ÷ EFFICIENCY_DIVISOR⌋.
  WEAR: {
    HEURES_PAR_POINT: 2,
    EFFICIENCY_DIVISOR: 200,
    SERVICE_THRESHOLD: 70,
    BREAKDOWN: 100,
    MAINTAIN_RATE: 20, // % du prix d'achat
    REPAIR_RATE: 50, // %
  },

  /* ---------- Lot 2 : objets, cultures, potager, famille ---------- */

  // Lot 11 (nutrition) : au chapitre §4, la valeur nutritionnelle de tous les
  // aliments de base existants a été augmentée de 25 % par rapport aux
  // valeurs d'origine (celles en commentaire, à droite de chaque objet), pour
  // rapprocher les plats des besoins réels de la famille (voir gratin_patates
  // ci-dessous). AUGMENTATION est la seule source de ce coefficient : toute
  // future revalorisation doit s'y référer plutôt que d'inventer un nouveau
  // pourcentage ailleurs. scaleEnergie() (fonctions utilitaires) applique la
  // règle d'arrondi centralisée (Math.round, arrondi standard au demi
  // supérieur) : les valeurs ci-dessous sont scaleEnergie(valeur d'origine),
  // vérifié par les tests DATA Lot 2 / Lot 11.
  NUTRITION: { AUGMENTATION: 125 }, // %

  // Objets (sections 1.1, 8.1 et 8.9). energie : énergie par unité (aliments
  // seulement) ; prix : prix de vente fixe en pièces ; edible : la famille peut
  // le manger ; category : légume, fruit, plat, graine, ingrédient, produit,
  // conserve. nom et icone servent uniquement à l'affichage.
  items: {
    carotte:        { nom: 'Carotte',              icone: '🥕', energie: 8,  prix: 1, edible: true,  category: 'légume' }, // 6 × 1,25
    patate:         { nom: 'Patate',               icone: '🥔', energie: 19, prix: 2, edible: true,  category: 'légume' }, // 15 × 1,25
    tomate:         { nom: 'Tomate',               icone: '🍅', energie: 8,  prix: 1, edible: true,  category: 'légume' }, // 6 × 1,25
    courgette:      { nom: 'Courgette',            icone: '🥒', energie: 10, prix: 2, edible: true,  category: 'légume' }, // 8 × 1,25
    aubergine:      { nom: 'Aubergine',            icone: '🍆', energie: 10, prix: 2, edible: true,  category: 'légume' }, // 8 × 1,25
    // Non périssable, non rachetable au Marché (Lot 3).
    conserve:       { nom: 'Conserve',             icone: '🥫', energie: 25, prix: 3, edible: true,  category: 'conserve', rachetable: false }, // 20 × 1,25
    graine_carotte:   { nom: 'Graines de carotte',   icone: '🌱', prix: 1, edible: false, category: 'graine' },
    graine_tomate:    { nom: 'Graines de tomate',    icone: '🌱', prix: 1, edible: false, category: 'graine' },
    graine_courgette: { nom: 'Graines de courgette', icone: '🌱', prix: 1, edible: false, category: 'graine' },
    graine_aubergine: { nom: 'Graines d\'aubergine', icone: '🌱', prix: 1, edible: false, category: 'graine' },
    // Lot 4 : blé (stock du Silo ; un blé sert de graine), graines de tournesol
    // (à replanter), œuf (12,5 → 13 énergie, 6 nuits : voir CONSERVATION).
    // category reste « ingrédient » (Silo, Moulin, alimentation des poules,
    // plancher de marché ×1,2) même si le blé sert aussi de semence : voir
    // isGraineComptoir(), qui l'ajoute en plus à l'onglet Graines du Marché.
    ble:              { nom: 'Blé',                  icone: '🌾', prix: 1, edible: false, category: 'ingrédient' },
    graine_tournesol: { nom: 'Graines de tournesol', icone: '🌻', prix: 1, edible: false, category: 'graine' },
    oeuf:             { nom: 'Œuf',                  icone: '🥚', energie: 13, prix: 2, edible: true, category: 'produit' }, // 10 × 1,25 = 12,5 → 13
    // Lot 5 : fruits, farine et huile (sections 1.1 et 8.9). Les fruits viennent
    // du Verger (Lot 8). La farine et l'huile valent 13 d'énergie dans les plats
    // mais ne se mangent pas seules. Les plats cuisinés (pain compris) sont
    // ajoutés à cette table au chargement, à partir de `recipes` : voir
    // registerDishItems().
    // Viandes (version 1.1) : plus aucun animal ne donne de viande, et elle ne
    // s'achète plus au Marché (rachetable: false). Les trois objets restent
    // définis pour les anciennes sauvegardes qui en contiennent : la famille
    // peut encore les manger ou les vendre jusqu'au dernier. Leur prix est écrit
    // ici tel qu'il était (déjà doublé : il ne passe plus par
    // applyProductionPriceMultiplier(), qui ne connaît que ce que la ferme produit).
    viande_mouton:    { nom: 'Viande de mouton',     icone: '🥩', energie: 38, prix: 10, edible: true,  category: 'produit', rachetable: false },
    pomme:            { nom: 'Pomme',                icone: '🍎', energie: 10, prix: 2, edible: true,  category: 'fruit' }, // 8 × 1,25
    poire:            { nom: 'Poire',                icone: '🍐', energie: 10, prix: 2, edible: true,  category: 'fruit' }, // 8 × 1,25
    farine:           { nom: 'Farine',               icone: '🥣', energie: 13, prix: 1, edible: false, category: 'ingrédient' }, // 10 × 1,25 = 12,5 → 13
    huile:            { nom: 'Huile de tournesol',   icone: '🛢️', energie: 13, prix: 4, edible: false, category: 'ingrédient' }, // 10 × 1,25 = 12,5 → 13
    // Lot 6 : laine (section 8.6). Ni périssable ni comestible : elle sert
    // uniquement à la vente. Elle ne se rachète pas au Marché.
    laine:            { nom: 'Laine',                icone: '🧶', prix: 6, edible: false, category: 'produit', rachetable: false },
    // 10 nouvelles cultures : Zone de culture (oignon, ail, poivron, épinard,
    // fraise, riz, houblon), Serre exclusivement (cacao, vanille, café). Poivron
    // reprend le mode « récolte » (comme tomate/courgette/aubergine) ; ail, riz,
    // houblon, cacao, vanille et café reprennent le mode « plant » (comme la
    // patate ou le blé : la récolte elle-même sert de graine, pas d'item séparé).
    // Cacao, vanille et café sont des cultures de rente : edible: false, donc
    // ignorées par planMeal()/mealOrder() (filtre déjà générique sur ce champ) —
    // elles ne nourrissent jamais la famille, même affamée. category:
    // 'ingrédient' pour ces trois-là et pour le houblon, comme farine/huile
    // (ingrédients de recette, jamais mangés seuls ; aucun plancher de marché
    // spécifique n'est attaché à cette catégorie, voir DATA.MARCHE.PLANCHER).
    oignon:           { nom: 'Oignon',                icone: '🧅', energie: 6,  prix: 1,  edible: true,  category: 'légume' },
    graine_oignon:    { nom: 'Graines d\'oignon',     icone: '🌱', prix: 1,  edible: false, category: 'graine' },
    ail:              { nom: 'Ail',                   icone: '🧄', energie: 6,  prix: 2,  edible: true,  category: 'légume' },
    poivron:          { nom: 'Poivron',               icone: '🫑', energie: 7,  prix: 2,  edible: true,  category: 'légume' },
    graine_poivron:   { nom: 'Graines de poivron',    icone: '🌱', prix: 1,  edible: false, category: 'graine' },
    epinard:          { nom: 'Épinard',               icone: '🥬', energie: 5,  prix: 1,  edible: true,  category: 'légume' },
    graine_epinard:   { nom: 'Graines d\'épinard',    icone: '🌱', prix: 1,  edible: false, category: 'graine' },
    fraise:           { nom: 'Fraise',                icone: '🍓', energie: 5,  prix: 2,  edible: true,  category: 'fruit' },
    graine_fraise:    { nom: 'Graines de fraise',     icone: '🌱', prix: 1,  edible: false, category: 'graine' },
    riz:              { nom: 'Riz',                   icone: '🍚', energie: 10, prix: 1,  edible: true,  category: 'légume' },
    houblon:          { nom: 'Houblon',               icone: '🌿', prix: 3,  edible: false, category: 'ingrédient' },
    cacao:            { nom: 'Cacao',                 icone: '🍫', prix: 8,  edible: false, category: 'ingrédient' },
    vanille:          { nom: 'Vanille',                icone: '🫘', prix: 15, edible: false, category: 'ingrédient' },
    cafe:             { nom: 'Café',                   icone: '☕', prix: 6,  edible: false, category: 'ingrédient' },
    // Anciennes viandes de bœuf et de volaille : voir la note sur viande_mouton
    // (restes des anciennes sauvegardes, ni produites ni rachetables).
    // lait : comestible et périssable comme l'œuf, un peu plus rare et cher.
    viande_boeuf:     { nom: 'Viande de bœuf',        icone: '🍖', energie: 38, prix: 10, edible: true,  category: 'produit', rachetable: false },
    viande_volaille:  { nom: 'Viande de volaille',    icone: '🍗', energie: 14, prix: 6,  edible: true,  category: 'produit', rachetable: false },
    lait:             { nom: 'Lait',                   icone: '🥛', energie: 16, prix: 4,  edible: true,  category: 'produit' },
    // Version 1.1 : la paille. Le Moulin en rend 1 par blé moulu (voir
    // `recipes.farine.sousProduit`) ; les moutons et les vaches la mangent
    // chaque nuit (voir DATA.ANIMAUX et feedLivestock()). Elle ne périme pas, ne
    // se mange pas, se vend 1 pièce et ne s'achète pas au Marché : elle vient
    // seulement du Moulin.
    paille:           { nom: 'Paille',                 icone: '🪹', prix: 1,  edible: false, category: 'produit', rachetable: false },
  },

  // Plats dont la recette a été retirée en version 1.1 (ils demandaient de la
  // viande, qui ne se produit plus). Une ancienne sauvegarde peut encore en
  // avoir : ils restent des plats (mangeables, vendables, bonus de santé), avec
  // l'énergie et le prix qu'ils avaient, mais ne se préparent plus et ne
  // s'achètent pas. Ajoutés à `items` par registerDishItems().
  PLATS_RETIRES: {
    ragout:          { nom: 'Ragoût',              icone: '🍖', energie: 144, prix: 36 },
    poivrons_farcis: { nom: 'Poivrons farcis',     icone: '🫑', energie: 81,  prix: 26 },
    roti_boeuf:      { nom: 'Rôti de bœuf',        icone: '🥩', energie: 144, prix: 36 },
    poulet_roti_ail: { nom: "Poulet rôti à l'ail", icone: '🍗', energie: 75,  prix: 23 },
  },

  /* ---------- Lot 5 : stations, recettes, Livre de recette ---------- */

  // Stations (sections 1.4 et 8.7) : une seule de chaque, une préparation à la
  // fois, sans file d'attente. cout : prix de construction ; electrique : la
  // station est un appareil du parc (interrupteur, usure, panne) qui prend
  // whParS Wh par seconde de fonctionnement ; requiert : station à bâtir
  // avant ; debloque : onglets ouverts par la construction.
  STATIONS: {
    four:    { nom: 'Four',    article: 'le', icone: '🔥', cout: 100, electrique: false, debloque: ['recettes'] },
    cuisine: { nom: 'Cuisine', article: 'la', icone: '🍳', cout: 150, electrique: false, requiert: 'four' },
    moulin:  { nom: 'Moulin',  article: 'le', icone: '⚙️', cout: 120, electrique: true, whParS: 20 },
    presse:  { nom: 'Presse',  article: 'la', icone: '🌻', cout: 150, electrique: true, whParS: 30 },
  },

  // Plats (sections 1.3, 1.4 et 6.8) : énergie = somme des énergies des
  // ingrédients × COEF_PLAT, arrondie ; prix de vente = somme des prix × COEF_PLAT,

// récolté et semé) : l'ensemble `keys` déduplique, donc chaque prix n'est
// doublé qu'une seule fois. Les graines dédiées (graine_carotte, etc.), les
// transformations (farine, huile) et les plats cuisinés ne figurent dans
// aucune de ces trois tables : ils restent donc intacts.
function productionItemKeys() {
  const keys = new Set();
  for (const [cropKey, crop] of Object.entries(DATA.crops)) {
    const item = crop.produit || cropKey;
    if (DATA.items[item] && DATA.items[item].category !== 'graine') keys.add(item);
  }
  for (const arbre of Object.values(DATA.VERGER.ARBRES)) {
    if (DATA.items[arbre.fruit]) keys.add(arbre.fruit);
  }
  for (const animal of Object.values(DATA.ANIMAUX)) {
    for (const champ of ['produit', 'laine', 'lait']) {
      if (animal[champ] && DATA.items[animal[champ]]) keys.add(animal[champ]);
    }
  }
  return keys;
}

function applyProductionPriceMultiplier() {
  const mult = DATA.MARCHE.MULTIPLICATEUR_PRODUCTION;
  const keys = productionItemKeys();
  for (const key of DATA.MARCHE.TRANSFORMATIONS_DOUBLEES) keys.add(key);
  for (const key of keys) {
    DATA.items[key].prix *= mult;
  }
}
// Appliqué immédiatement, avant registerDishItems() (plus bas) : les plats
// dont le prix se calcule à partir des prix des ingrédients (omelette, gratin,
// fromage frais, etc.) doivent lire des prix d'ingrédients déjà doublés, une
// seule fois, jamais l'inverse.
applyProductionPriceMultiplier();

// Lot 14 : temps de préparation des plats (voir DATA.RECETTES.DIVISEUR_TEMPS).
// Chaque recette est traitée une seule fois, ce qui rend le résultat stable
// (20 s → 10 s, 15 s → 8 s, 45 s → 23 s, etc.).
function applyDishTimeDivisor() {
  const R = DATA.RECETTES;
  for (const r of Object.values(DATA.recipes)) {
    if (R.STATIONS_TEMPS_DIVISE.includes(r.station)) r.temps = Math.ceil(r.temps / R.DIVISEUR_TEMPS);
  }
}
applyDishTimeDivisor();

/* ==========================================================================
   ENGINE — simulation pure. Aucun accès au DOM, à window, au stockage ou à
   l'horloge : le temps arrive en paramètre (dt, en secondes) et l'aléatoire
   vient exclusivement du générateur à graine stocké dans l'état.
   ========================================================================== */

// Générateur pseudo-aléatoire à graine (mulberry32).
// Renvoie une fonction () => nombre dans [0, 1).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const STATE_VERSION = 19;
// Version du jeu, affichée dans les Options (À propos).
const GAME_VERSION = '1.3.0';
const EPS = 1e-9; // tolérance de calcul flottant (pas une valeur d'équilibrage)

// Liste des étapes exécutées au clic sur "Dormir", dans l'ordre. Lot 2 :
// repas et santé, puis pousse. Lot 4 : la ponte. Lot 5 : les préparations en
// cours se terminent (après le repas du soir : un plat fini pendant la nuit se
// mange dès le repas suivant). Lot 6, revu en version 1.1 : les moutons et les
// vaches mangent leur paille juste après la ponte (feedLivestock) ; ceux qui ont
// mangé font avancer leur laine ou donnent leur lait. Lot 3 : la péremption, toujours en dernier. Les
// lots suivants insèrent leurs fonctions avant `spoil`. Lot 7 : les
// automatisations du niveau 5 passent juste après le repas, avant la pousse (une
// parcelle arrosée pousse cette nuit) et avant la ponte (une poule nourrie pond).
// Lot 8 : le verger donne ses fruits juste après les moutons ; puis le bloc
// nocturne du réfrigérateur (nightPower), sa panne éventuelle (fridgeNight) et
// enfin la péremption. Les préparations en cours se terminent avant le frigo :
// la paille du blé qui finit de se moudre pendant la nuit sert donc à partir
// de la nuit suivante.
// Chaque étape reçoit l'état et le modifie.
const NIGHT_STEPS = [feedFamily, rainNight, autoTasks, growAll, layEggs, feedLivestock, growOrchard, finishPreparations, autoMaintain, nightPower, fridgeNight, spoil];

/* ---------- Lot 8 : saisons ---------- */

// Indice de saison (0 à 3) d'une nuit : nuits 1 à 10 printemps, 11 à 20 été,
// 21 à 30 automne, 31 à 40 hiver, puis retour au printemps à la nuit 41.
function seasonIndex(day) {
  const S = DATA.SAISONS;
  return Math.floor((Math.max(1, day) - 1) / S.LONGUEUR) % S.ORDRE.length;
}

// Identifiant de la saison de la nuit courante ('printemps', 'ete', ...).
function currentSeason(state) {
  return DATA.SAISONS.ORDRE[seasonIndex(state.day)];
}

// Numéro de la nuit dans la saison (1 à LONGUEUR).
function seasonNight(state) {
  return ((Math.max(1, state.day) - 1) % DATA.SAISONS.LONGUEUR) + 1;
}

// Numéro de la nuit dans l'année (1 à 40).
function yearNight(day) {
  const S = DATA.SAISONS;
  return ((Math.max(1, day) - 1) % (S.LONGUEUR * S.ORDRE.length)) + 1;
}

// Facteur saisonnier d'un type de calcul : 'solaire', 'potager' ou 'eau'.
// Les calculs existants le multiplient à leur valeur de base.
// Arrondi entier de x × pct ÷ 100 (au plus proche, demi vers le haut).
function roundPct(x, pct) {
  return Math.floor((x * pct + 50) / 100);
}

// Facteur de saison en % (100 = sans effet).
function seasonFactor(state, kind) {
  return DATA.SAISONS.MODS[currentSeason(state)][kind];
}

// Facteur de rendement d'une récolte selon le lieu (1 pour la Serre).
function yieldSeasonFactor(state, lieu) {
  const kind = DATA.SAISONS.RENDEMENT_LIEU[lieu];
  return kind ? seasonFactor(state, kind) : 100;
}

// Facteur d'eau d'un arrosage selon le lieu (1 pour la Serre).
function waterSeasonFactor(state, lieu) {
  return DATA.SAISONS.EAU_LIEUX.includes(lieu) ? seasonFactor(state, 'eau') : 100;
}

/* ---------- Lot 5 : plats cuisinés (objets calculés depuis DATA.recipes) ---------- */

// Les ingrédients d'une recette : un seul objet, ou l'un des objets de `ou`.
function ingredientOptions(ing) {
  return ing.ou || [ing.item];
}

// Somme d'un champ (energie ou prix) des ingrédients d'une recette, eau comprise.
// Pour un ingrédient « l'un ou l'autre », on prend le premier (les valeurs sont égales).
function recipeSum(recipe, field, waterValue) {
  const sum = recipe.ingredients.reduce((t, ing) => t + (DATA.items[ingredientOptions(ing)[0]][field] || 0) * ing.qte, 0);
  return sum + (recipe.eau || 0) * waterValue;
}

// Lot 11 (nutrition) : applique la règle d'arrondi centralisée d'une
// revalorisation nutritionnelle des aliments de base (Math.round, arrondi
// standard au demi supérieur). Utilisée pour dériver DATA.items[*].energie
// (voir commentaires « × 1,25 » sur chaque objet) ; centralisée ici pour que
// toute future revalorisation applique la même règle, plutôt que des arrondis
// ad hoc dispersés dans DATA.
function scaleEnergie(valeurBase, augmentation = DATA.NUTRITION.AUGMENTATION) {
  return roundPct(valeurBase, augmentation);
}

// Énergie d'un plat : somme des ingrédients × 1,3, arrondie (pain 34, omelette 68, ragoût 144),
// sauf si la recette porte un champ energieForcee (override explicite, voir gratin_patates).
function dishEnergy(id) {
  const recipe = DATA.recipes[id];
  if (recipe.energieForcee != null) return recipe.energieForcee;
  const R = DATA.RECETTES;
  return roundPct(recipeSum(recipe, 'energie', R.ENERGIE_EAU), R.COEF_PLAT);
}

// Prix de vente d'un plat : somme des prix × 1,3, arrondi, sauf si la recette
// porte un champ priceMultiplier (override explicite du coefficient, pas de
// la formule elle-même — voir les 4 recettes « luxe » : chocolat chaud, café,
// crème à la vanille, bière artisanale, toutes à ×3 au lieu de ×1,3).
function dishPrice(id) {
  const recipe = DATA.recipes[id];
  const R = DATA.RECETTES;
  const coef = recipe.priceMultiplier != null ? recipe.priceMultiplier : R.COEF_PLAT;
  return roundPct(recipeSum(recipe, 'prix', R.PRIX_EAU), coef);
}

// Ajoute chaque plat à DATA.items (énergie et prix calculés). Ils se gardent
// 6 nuits (catégorie « plat »), sauf le pain (7 nuits, voir CONSERVATION).
// Les plats retirés du livre (DATA.PLATS_RETIRES) restent des plats, à valeurs
// fixes, pour les sauvegardes qui en ont encore : ils ne s'achètent pas.
function registerDishItems() {
  for (const [id, r] of Object.entries(DATA.recipes)) {
    if (r.transformation) continue;
    DATA.items[id] = { nom: r.nom, icone: r.icone, energie: dishEnergy(id), prix: dishPrice(id), edible: true, category: 'plat', plat: true };
  }
  for (const [id, p] of Object.entries(DATA.PLATS_RETIRES)) {
    DATA.items[id] = { nom: p.nom, icone: p.icone, energie: p.energie, prix: p.prix, edible: true, category: 'plat', plat: true, rachetable: false, retire: true };
  }
}
registerDishItems();

// Objet rendu par une recette et quantité rendue.
function recipeOutput(id) {
  return DATA.recipes[id].sortie || id;
}

function recipeOutputQty(id) {
  return DATA.recipes[id].qteSortie || 1;
}

/* ---------- appareils : fabrication et sélecteurs ---------- */

function newDayStats() {
  // produite, perdue : mWh ; eau : mL pompés ; ble : blé mangé par les poules
  // pendant la journée (Lot 4) ; soins : soins payés pendant la journée (Lot 9).
  return { produite: 0, perdue: 0, eau: 0, ble: 0, soins: 0 };
}

// Unités entières du moteur : le temps en ms, l'énergie en mWh, l'eau en mL.
// Une quantité par seconde (mWh/s, mL/s) × une durée en ms → ⌊taux × ms ÷ 1 000⌋.
function perTick(rate, dtMs) {
  return Math.floor((rate * dtMs) / 1000);
}

// Taux par seconde (arrondi vers le bas) d'une quantité écoulée en `dtMs` ms.
function perSecond(amount, dtMs) {
  return dtMs > 0 ? Math.floor((amount * 1000) / dtMs) : 0;
}

function makeDevice(type, id, prix) {
  // usure : points entiers ; usureMs : temps de marche (ms) depuis le dernier point.
  const d = { id, type, niveau: 1, allume: true, usure: 0, usureMs: 0, prix };
  if (type === 'batterie') {
    d.chargeMwh = 0;
    d.entree = 0; // mWh/s reçus au dernier tick
    d.sortie = 0; // mWh/s soutirés au dernier tick
  } else if (type === 'panneau') {
    d.prod = 0; // mWh/s produits au dernier tick
  } else if (type === 'pompe') {
    d.debit = 0; // mL/s réellement pompés au dernier tick
    d.conso = 0; // mWh/s consommés au dernier tick
  } else if (type === 'moulin' || type === 'presse' || type === 'frigo') {
    d.conso = 0; // mWh/s consommés au dernier tick (0 en pause ou au repos)
  }
  return d;
}

// Appareils des stations électriques déjà construites (Moulin, Presse).
function stationDevices(state) {
  if (!state.stations) return [];
  return Object.keys(DATA.STATIONS)
    .filter((id) => DATA.STATIONS[id].electrique && state.stations[id] && state.stations[id].appareil)
    .map((id) => state.stations[id].appareil);
}

// Parc et réserves de départ : 1 panneau, 1 batterie, la pompe et le réservoir.
// Les appareils sont des listes d'objets ; la pompe est un appareil unique ;
// le réservoir n'est pas un appareil (`eauMl` = son contenu en mL).
function startFarm() {
  const prix = DATA.START.DEVICE_PRICE;
  return {
    compteurs: { panneau: 1, batterie: 1 },
    panneaux: [makeDevice('panneau', 'panneau-1', prix)],
    batteries: [makeDevice('batterie', 'batterie-1', prix)],
    pompe: makeDevice('pompe', 'pompe', prix),
    eauMl: 0,
    flux: { perdue: 0, eau: 0 }, // mWh/s perdus, mL/s reçus par le réservoir au dernier tick
    jour: newDayStats(),
    report: null,
  };
}

// Lot 8 : le réfrigérateur est un appareil du parc une fois construit.
function fridgeDevices(state) {
  return state.frigo && state.frigo.construit && state.frigo.appareil ? [state.frigo.appareil] : [];
}

function allDevices(state) {
  return [...state.panneaux, ...state.batteries, state.pompe, ...stationDevices(state), ...fridgeDevices(state)];
}

function findDevice(state, id) {
  return allDevices(state).find((d) => d.id === id) || null;
}

// Rendement d'un appareil en % entier : 100 − ⌊usure ÷ 2⌋.
function efficiency(d) {
  return 100 - Math.floor((d.usure * 100) / DATA.WEAR.EFFICIENCY_DIVISOR);
}

function isBroken(d) {
  return d.usure >= DATA.WEAR.BREAKDOWN;
}

function needsService(d) {
  return !isBroken(d) && d.usure >= DATA.WEAR.SERVICE_THRESHOLD;
}

// Production d'un panneau à son niveau et son usure actuels (mWh/s entiers).
// Lot 8 : avec `state`, le facteur solaire de la saison s'y applique.
function panelOutput(d, state) {
  const base = Math.floor((DATA.GRID.panneau.whParS[d.niveau - 1] * 1000 * efficiency(d)) / 100);
  return state ? Math.floor((base * solarFactor(state)) / 100) : base;
}

// Facteur solaire de la saison (%) ; les Panneaux orientables relèvent l'hiver.
function solarFactor(state) {
  const f = seasonFactor(state, 'solaire');
  const hiver = currentSeason(state) === 'hiver' ? techFlag(state, 'solaireHiver') : null;
  return hiver ? Math.max(f, hiver) : f;
}

// Capacité utile d'une batterie (mWh) : capacité(niveau) × rendement.
function batteryCapacity(d) {
  return Math.floor((DATA.GRID.batterie.wh[d.niveau - 1] * 1000 * efficiency(d)) / 100);
}

// Débit de la pompe (mL/s) selon son niveau et son rendement.
function pumpFlow(d) {
  return Math.floor((DATA.GRID.pompe.litresPerS[d.niveau - 1] * 1000 * efficiency(d)) / 100);
}

// Capacité du réservoir (mL).
function tankCapacity(state) {
  return DATA.GRID.pompe.reservoirL[state.pompe.niveau - 1] * 1000;
}

// Prix du n-ième appareil d'un type, n étant le nombre déjà possédé.
function purchasePrice(type, owned) {
  const p = DATA.PURCHASE[type];
  return growthPrice(p.base, p.growth, owned);
}

function nextPurchasePrice(state, type) {
  const owned = type === 'panneau' ? state.panneaux.length : state.batteries.length;
  return purchasePrice(type, owned);
}

function maintainCost(d) {
  return percentCeil(d.prix, DATA.WEAR.MAINTAIN_RATE);
}

function repairCost(d) {
  return percentCeil(d.prix, DATA.WEAR.REPAIR_RATE);
}

// Le Moulin et la Presse n'ont pas de niveaux : pas d'amélioration (null).
function upgradeCost(d) {
  if (!DATA.GRID[d.type]) return null;
  return d.niveau >= DATA.LEVEL_MAX ? null : DATA.UPGRADE_COST[d.niveau];
}

// Pièces entières : tout prix calculé est arrondi à l'entier supérieur.
// percentCeil(x, p) = ⌈x × p ÷ 100⌉, en arithmétique entière.
function percentCeil(x, pct) {
  const num = BigInt(Math.round(x)) * BigInt(Math.round(pct));
  return Number((num + 99n) / 100n);
}

// Prix croissant : ⌈base × (pct ÷ 100)^n⌉, calculé exactement en entiers
// (BigInt) pour éviter toute dérive des puissances décimales.
function growthPrice(base, pct, n) {
  const k = Math.max(0, Math.floor(n));
  const num = BigInt(Math.round(base)) * BigInt(Math.round(pct)) ** BigInt(k);
  const den = 100n ** BigInt(k);
  return Number((num + den - 1n) / den);
}

/* ---------- l'heure ---------- */

// Éveil minimal avant de dormir : celui de départ, ou le plus bas des paliers
// « Réveil matinal » acquis (Lot 7).
function awakeRequired(state) {
  let required = DATA.TIME.MIN_AWAKE_S;
  for (const id of ownedTechs(state)) {
    const e = DATA.techtree.noeuds[id].effet;
    if (e && e.eveilMin !== undefined) required = Math.min(required, e.eveilMin);
  }
  return required;
}

// Heure de la journée (0 à 23) : 6 h au réveil, +1 heure toutes les
// CLOCK_SECONDS_PER_HOUR secondes d'éveil (18 s). À 19 h la famille prend son
// repas (mealDue / takeMeal) ; à 22 h la nuit se déroule d'elle-même
// (bedtimeDue : c'est l'interface qui lance sleep(), jeu ouvert). Si rien ne
// la lance, l'horloge repasse à 0 h et continue. (L'usure des appareils a sa
// propre « heure de marche », SECONDS_PER_HOUR : voir wearStep().)
function hourOfDay(state) {
  const hours = Math.floor(state.awakeMs / (DATA.TIME.CLOCK_SECONDS_PER_HOUR * 1000));
  return (DATA.TIME.DAY_START_HOUR + hours) % 24;
}

// La même heure avec sa partie décimale, dans [0, 24) : 6,5 pour 6 h 30. Sert à
// dessiner l'horloge et la lumière du jour sans à-coups.
function clockHours(state) {
  const ms = Math.max(0, Number(state.awakeMs) || 0);
  const perDay = 24 * DATA.TIME.CLOCK_SECONDS_PER_HOUR * 1000;
  const h = DATA.TIME.DAY_START_HOUR + (ms % perDay) / (DATA.TIME.CLOCK_SECONDS_PER_HOUR * 1000);
  return h >= 24 ? h - 24 : h;
}

// Temps d'éveil (ms) auquel l'horloge marque `hour` heures (19 h → 65 000 ms).
function awakeMsAtHour(hour) {
  return (hour - DATA.TIME.DAY_START_HOUR) * DATA.TIME.CLOCK_SECONDS_PER_HOUR * 1000;
}

// Version 1.1.1 : le repas de 19 h est-il à prendre maintenant ? (pas encore
// pris aujourd'hui, et l'horloge a atteint MEAL_HOUR)
function mealDue(state) {
  return !state.repas && state.awakeMs >= awakeMsAtHour(DATA.TIME.MEAL_HOUR);
}

// L'heure du coucher (NIGHT_HOUR, 22 h) est-elle passée sans que personne n'ait
// dormi ? L'interface lance alors
// la nuit (sleep()) : repas s'il n'a pas été pris, puis les étapes habituelles.
function bedtimeDue(state) {
  return state.awakeMs >= awakeMsAtHour(DATA.TIME.NIGHT_HOUR);
}

/* ---------- énergie : stockage et prélèvement ---------- */

// Range `energy` mWh dans les batteries allumées et non en panne, l'une après
// l'autre dans l'ordre de la liste. Renvoie ce qui n'a rentré nulle part.
function storeEnergy(state, energy) {
  let rest = energy;
  for (const b of state.batteries) {
    if (rest <= 0) break;
    if (!b.allume || isBroken(b)) continue;
    const room = Math.max(0, batteryCapacity(b) - b.chargeMwh);
    const added = Math.min(room, rest);
    if (added > 0) {
      b.chargeMwh += added;
      b.entree += added;
      rest -= added;
    }
  }
  return Math.max(0, rest);
}

// Prélève jusqu'à `energy` mWh dans les batteries, en sens inverse de la liste :
// la dernière remplie se vide la première. Renvoie l'énergie réellement fournie.
// Tous les consommateurs (pompe, puis moulin, presse, réfrigérateur) passent ici.
function drawEnergy(state, energy) {
  let rest = energy;
  for (let i = state.batteries.length - 1; i >= 0; i--) {
    if (rest <= 0) break;
    const b = state.batteries[i];
    if (!b.allume || isBroken(b)) continue;
    const taken = Math.min(b.chargeMwh, rest);
    if (taken > 0) {
      b.chargeMwh -= taken;
      b.sortie += taken;
      rest -= taken;
    }
  }
  return energy - Math.max(0, rest);
}

// Consommateurs d'énergie, exécutés dans l'ordre à chaque tick. Les lots
// suivants y ajouteront le moulin, la presse et le réfrigérateur.
// `run(state, dtMs)` prélève son énergie avec drawEnergy().
const CONSUMERS = [
  // Lot 8 : le frigo est une charge permanente, servie avant les autres pour que
  // la nourriture passe avant l'eau et les transformations.
  { id: 'frigo', run: runFridge },
  { id: 'pompe', run: runPump },
  { id: 'moulin', run: (state, dtMs) => runElectricStation(state, 'moulin', dtMs) },
  { id: 'presse', run: (state, dtMs) => runElectricStation(state, 'presse', dtMs) },
];

// Arbre v2 (Délestage intelligent) : sous le seuil de charge totale, la pompe,
// le Moulin et la Presse se mettent en pause pour garder le froid du frigo.
function loadShedding(state) {
  const d = techFlag(state, 'delestage');
  if (!d) return false;
  const cap = state.batteries.reduce((t, b) => (b.allume && !isBroken(b) ? t + batteryCapacity(b) : t), 0);
  return cap > 0 && availableEnergy(state) * 100 < cap * d.seuil;
}

// La pompe remplit le réservoir si elle est allumée, en état, et que le
// réservoir n'est pas plein. Si l'énergie manque, elle tourne au prorata
// (au mL près : chaque mL coûte WH_PAR_L mWh).
function runPump(state, dtMs) {
  const p = state.pompe;
  p.debit = 0;
  p.conso = 0;
  if (!p.allume || isBroken(p)) return;
  const room = tankCapacity(state) - state.eauMl;
  if (room <= 0) return;
  if (loadShedding(state)) return; // arbre v2 : délestage
  // mWh par mL × % (Pompe à haut rendement) : le coût d'un lot de mL est arrondi vers le haut.
  const kPct = DATA.PUMP.WH_PAR_L * techPct(state, 'whParLitre');
  const wanted = Math.min(perTick(pumpFlow(p), dtMs), room);
  const ml = Math.min(wanted, Math.floor((availableEnergy(state) * 100) / kPct));
  if (ml <= 0) return;
  const got = drawEnergy(state, Math.ceil((ml * kPct) / 100));
  state.eauMl += ml;
  state.jour.eau += ml;
  bumpCounter(state, 'eauMl', ml); // Lot 9
  p.debit = perSecond(ml, dtMs);
  p.conso = perSecond(got, dtMs);
  state.flux.eau = p.debit;
}

/* ---------- la boucle de simulation ---------- */

// Avance la simulation de dt secondes (converties en ms entières) : flux
// (production, stockage, consommation, préparations), usure, puis le temps d'éveil.
// Lot 11 : les trois phases sont séparées pour que la progression hors-ligne
// réutilise exactement les mêmes flux, sans l'usure (voir simulateOffline).
// Version 1.1.1 : `horlogeArretee` (le joueur lit le résumé du réveil) : tout
// continue de tourner, mais l'heure n'avance pas ; la journée commence quand il
// ferme le résumé.
function tick(state, dt, horlogeArretee = false) {
  const dtMs = Math.round((Number(dt) || 0) * 1000);
  if (!(dtMs > 0)) return state;
  flowStep(state, dtMs);
  wearStep(state, dtMs);

  // e. temps d'éveil (l'heure s'en déduit)
  if (!horlogeArretee) state.awakeMs += dtMs;
  refreshUnlocks(state); // Lot 7 : l'arbre des technologies s'ouvre à 100 pièces
  noteEnergyRecord(state); // Lot 9 : record d'énergie stockée, puis objectifs du chapitre
  updateChapters(state);
  return state;
}

// Phases a à c de tick : production, stockage, consommateurs, Four et Cuisine.
// Les quantités du pas (mWh) deviennent des puissances (mWh/s) pour l'affichage.
function flowStep(state, dtMs) {
  for (const b of state.batteries) {
    b.entree = 0;
    b.sortie = 0;
  }
  state.flux.eau = 0;

  // a. production : chaque panneau allumé et non en panne
  let produced = 0;
  for (const p of state.panneaux) {
    p.prod = 0;
    if (p.allume && !isBroken(p)) {
      const e = perTick(panelOutput(p, state), dtMs);
      produced += e;
      p.prod = perSecond(e, dtMs);
    }
  }

  // b. stockage : batteries remplies l'une après l'autre ; le reste est perdu
  const lost = storeEnergy(state, produced);
  state.jour.produite += produced;
  state.jour.perdue += lost;
  state.flux.perdue = perSecond(lost, dtMs);

  // c. consommation : chaque consommateur tire sur les batteries (sens inverse)
  for (const c of CONSUMERS) c.run(state, dtMs);

  // c bis. Lot 5 : le Four et la Cuisine n'ont pas besoin d'électricité
  runCooking(state, dtMs);

  // les quantités du tick deviennent des puissances (mWh/s)
  for (const b of state.batteries) {
    b.entree = perSecond(b.entree, dtMs);
    b.sortie = perSecond(b.sortie, dtMs);
  }
}

// Phase d de tick : l'usure, seulement pour un appareil qui a réellement
// fonctionné pendant le pas (d'après les puissances laissées par flowStep).
function wearStep(state, dtMs) {
  // Arbre v2 (Entretien préventif) : usure à 75 % → un point demande plus de marche.
  const msParPoint = Math.floor((DATA.WEAR.HEURES_PAR_POINT * DATA.TIME.SECONDS_PER_HOUR * 1000 * 100) / techPct(state, 'usure'));
  for (const d of allDevices(state)) {
    let worked = false;
    if (d.type === 'panneau') worked = d.prod > 0;
    else if (d.type === 'batterie') worked = d.entree > 0 || d.sortie > 0;
