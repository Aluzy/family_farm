<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ferme Familiale</title>
<style>
:root {
  --color-sun: #f2a71b;
  --color-sun-dark: #d68c0c;
  --color-leaf: #4f8a3d;
  --color-leaf-dark: #386b2a;
  --color-earth: #8a5a34;

  --bg: #faf6ee;
  --bg-elevated: #ffffff;
  --bg-header: #fef3dc;
  --bg-muted: #f1ebdc;
  --text: #2c2416;
  --text-muted: #6b5f4a;
  --border: #e3d9c2;
  --accent: var(--color-leaf);
  --accent-contrast: #ffffff;
  --accent-secondary: var(--color-sun);
  --danger: #c1442e;
  --danger-contrast: #ffffff;
  --shadow: 0 1px 3px rgba(44, 36, 22, 0.12);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1a14;
    --bg-elevated: #26231b;
    --bg-header: #2c2718;
    --bg-muted: #2a271e;
    --text: #f2ecdd;
    --text-muted: #b9ae95;
    --border: #3c3626;
    --accent: #6fae5a;
    --accent-contrast: #10230d;
    --accent-secondary: #f2a71b;
    --danger: #e0664c;
    --danger-contrast: #2a0d06;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

body {
  padding-bottom: 24px;
}

button {
  font-family: inherit;
  font-size: 1rem;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.app-title {
  font-weight: 700;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}

.indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:active { transform: translateY(1px); }

main {
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}

.tabbar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}

.tab-btn.active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

.panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 16px;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.panel p.hint {
  color: var(--text-muted);
  margin: 0;
}

.btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}

.btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-contrast);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stack { display: flex; flex-direction: column; gap: 12px; }

textarea, input[type="text"] {
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  padding: 0;
}

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
}

.modal {
  background: var(--bg-elevated);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px 16px 28px;
  box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  .modal { border-radius: var(--radius); }
}

.modal h2 {
  margin-top: 0;
}

.modal-close {
  float: right;
}

details.test-panel {
  margin-top: 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  background: var(--bg-muted);
}

details.test-panel summary {
  cursor: pointer;
  font-weight: 600;
  padding: 8px 0;
  min-height: 28px;
}

.state-dump {
  white-space: pre-wrap;
  word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  max-height: 260px;
  overflow-y: auto;
}

/* ---------- Lot 1 : en-tête, cartes, appareils, interrupteurs, Dormir ---------- */

body { padding-bottom: 104px; } /* place pour la barre « Dormir » */

.app-header { flex-wrap: wrap; }

.indicators {
  order: 3;
  width: 100%;
  justify-content: space-between;
  gap: 8px 12px;
}

.indicator {
  white-space: nowrap;
}

@media (min-width: 640px) {
  .indicators { justify-content: flex-start; gap: 8px 28px; }
}

.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (min-width: 640px) {
  .cards { grid-template-columns: 1fr 1fr; }
}

.card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  width: 100%;
  min-width: 0;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font: inherit;
}

button.card { cursor: pointer; min-height: 44px; }
button.card:active { transform: translateY(1px); }

.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
  font-size: 1.05rem;
}

.card-title .chevron { color: var(--text-muted); font-weight: 400; }

.big {
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.muted { color: var(--text-muted); font-size: 0.9rem; }
.num { font-variant-numeric: tabular-nums; }

.alert {
  color: var(--danger);
  font-weight: 600;
  font-size: 0.9rem;
}

.chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.chip.panne { background: var(--danger); border-color: var(--danger); color: var(--danger-contrast); }
.chip.warn { border-color: var(--danger); color: var(--danger); }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.bar {
  display: block;
  height: 10px;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  background: var(--accent);
}

.bar-fill.warn { background: var(--color-sun); }
.bar-fill.bad { background: var(--danger); }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 14px 0 6px;
  border-radius: 999px;
  border: 2px solid var(--danger);
  background: var(--danger);
  color: var(--danger-contrast);
  font-weight: 700;
  cursor: pointer;
}

.switch .knob {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--shadow);
}

.switch[aria-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
  flex-direction: row-reverse;
  padding: 0 6px 0 14px;
}

.switch:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.switch:focus-visible, .btn:focus-visible, .card:focus-visible, .tab-btn:focus-visible {
  outline: 3px solid var(--color-sun);
  outline-offset: 2px;
}

.device-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.device-actions .btn { padding: 0 12px; }

.device-list { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }

.screen-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.screen-head h2 { margin: 0; }

.sleep-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--bg-header);
  border-top: 1px solid var(--border);
}

.sleep-bar .btn {
  display: block;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  min-height: 52px;
  font-size: 1.1rem;
}

.report-list { list-style: none; margin: 12px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

select {
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  padding: 0 8px;
  font: inherit;
  max-width: 100%;
}

.toast {
  position: fixed;
  bottom: 88px;
  left: 16px;
  right: 16px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--text);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 200;
  text-align: center;
}

/* ---------- Lot 2 : potager, famille, inventaire, aperçu du repas ---------- */

body { padding-bottom: 136px; } /* la barre « Dormir » porte maintenant l'aperçu du repas */
.toast { bottom: 120px; }

.sleep-bar .meal-preview {
  max-width: 720px;
  margin: 0 auto 6px;
  text-align: center;
  font-size: 0.9rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.sleep-bar .meal-preview.short { color: var(--danger); }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin: 4px 0 10px;
}

.section-head h3, .section-title { margin: 0; font-size: 1.05rem; }
.section-title { margin-top: 22px; margin-bottom: 10px; }

.plots {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

@media (min-width: 640px) {
  .plots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.plot { padding: 12px; gap: 6px; }
.plot.mature { border-color: var(--accent); border-width: 2px; }
.plot .btn { width: 100%; padding: 0 8px; font-size: 0.92rem; }
.plot-emoji { font-size: 2rem; line-height: 1.1; }
.plot-foot { margin-top: 12px; }

.portraits {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}

@media (min-width: 640px) {
  .portraits { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

.portrait { align-items: flex-start; }
.portrait .btn { width: 100%; padding: 0 8px; font-size: 0.92rem; }
.portrait-emoji { font-size: 2.2rem; line-height: 1.1; }
.portrait .bar { width: 100%; }

.inv-group { margin: 12px 0 20px; }
.inv-group h3 { margin: 0 0 8px; font-size: 1.05rem; }

.inv-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.inv-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
}

.reserve { gap: 10px; }
.step-btn { min-width: 44px; padding: 0; font-size: 1.3rem; line-height: 1; }

.plant-choice {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  width: 100%;
  padding: 8px 14px;
  text-align: left;
}

.modal .stack { margin: 12px 0; }

/* ---------- Lot 3 : inventaire par lots, Comptoir ---------- */

.subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0 8px;
}

.subtab-btn {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 600;
}

.subtab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}

.subtab-btn.soon { opacity: 0.6; }

.subtab-btn:focus-visible { outline: 3px solid var(--color-sun); outline-offset: 2px; }

.lot-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lot-list li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  font-size: 0.95rem;
  font-variant-numeric: tabular-nums;
}

.lot-list li.soon-spoil { color: var(--danger); font-weight: 600; }

.chip.badge { border-color: var(--color-sun-dark); color: var(--color-sun-dark); }

@media (prefers-color-scheme: dark) {
  .chip.badge { border-color: var(--color-sun); color: var(--color-sun); }
}

.shop-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
}

.shop-row > .btn { width: 100%; }

.qty-row { gap: 8px; }
.qty-row .qty { min-width: 2.5ch; text-align: center; font-weight: 700; font-size: 1.1rem; }
.qty-row .sell-go { flex: 1 1 140px; }

.coming { padding: 8px 0; }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">🌾 Ferme Familiale</div>
  <div class="indicators" id="indicators"></div>
  <button class="icon-btn" id="options-btn" type="button" aria-label="Options" data-action="open-options">⚙️</button>
</header>

<main>
  <nav class="tabbar" id="tabbar"></nav>
  <section id="tab-content" class="panel"></section>

  <details class="test-panel" id="test-panel" hidden>
    <summary>🧪 Mode test</summary>
    <div class="stack">
      <div class="row">
        <button class="btn" type="button" data-action="test-add-100">+100 💰</button>
        <button class="btn" type="button" data-action="test-add-1000">+1 000 💰</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-add-panel">+1 panneau</button>
        <button class="btn" type="button" data-action="test-add-battery">+1 batterie</button>
        <button class="btn" type="button" data-action="test-fill-batteries">Remplir les batteries</button>
        <button class="btn" type="button" data-action="test-fill-tank">Remplir le réservoir</button>
      </div>
      <div class="row">
        <label for="test-device">Appareil</label>
        <select id="test-device"></select>
        <button class="btn" type="button" data-action="test-wear">Usure à 100 %</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-seeds">+10 de chaque graine</button>
        <button class="btn" type="button" data-action="test-ripen">Faire mûrir les parcelles</button>
        <button class="btn" type="button" data-action="test-sick">Santé à 0</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-food">+20 de chaque aliment</button>
        <button class="btn" type="button" data-action="test-age">Vieillir l'inventaire d'une nuit</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-skip-awake">Ignorer l'éveil minimal</button>
        <button class="btn" type="button" data-action="test-nights-1">Passer 1 nuit</button>
        <button class="btn" type="button" data-action="test-nights-5">Passer 5 nuits</button>
      </div>
      <div class="state-dump" id="state-dump"></div>
    </div>
  </details>
</main>

<div class="sleep-bar" id="sleep-bar"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script id="core">
'use strict';

/* ==========================================================================
   DATA — toutes les valeurs d'équilibrage du jeu.
   Les lots suivants viendront peupler cet objet. Aucune valeur d'équilibrage
   ne doit exister ailleurs que dans DATA.
   Références : conception v15, sections 1.2, 1.4 et 8.2.
   ========================================================================== */
const DATA = {
  // Départ de partie.
  START: {
    PIECES: 50,
    // Les appareils de départ sont offerts : prix d'achat 0, donc entretien
    // et réparation gratuits pour eux (l'entretien vaut 20 % du prix d'achat).
    DEVICE_PRICE: 0,
    // Inventaire de départ (section 8.1) : 160 conserves = 10 nuits, plus le kit de graines.
    INVENTAIRE: { conserve: 160, graine_carotte: 10, patate: 6, graine_tomate: 4 },
  },

  // Temps : la journée commence à 6 h, 1 heure de jeu = 30 s d'éveil.
  TIME: {
    DAY_START_HOUR: 6,
    SECONDS_PER_HOUR: 30,
    MIN_AWAKE_S: 30,
  },

  LEVEL_MAX: 5,

  // Grilles par niveau (index 0 = niveau 1), identiques pour chaque appareil
  // d'un même type.
  GRID: {
    panneau: { kwhPerS: [0.03, 0.05, 0.08, 0.12, 0.18] },
    batterie: { kwh: [5, 10, 20, 40, 80] },
    pompe: {
      litresPerS: [1, 2, 4, 6, 10],
      reservoirL: [40, 80, 160, 300, 500], // le réservoir suit le niveau de la pompe
    },
  },

  // Coût pour atteindre un niveau (index 0 = niveau 1, non utilisé).
  UPGRADE_COST: [0, 40, 100, 250, 600],

  PUMP: { KWH_PER_L: 0.01 },

  // Achat d'un appareil supplémentaire : base × growth^n, n = nombre déjà possédé.
  PURCHASE: {
    panneau: { base: 60, growth: 1.2 },
    batterie: { base: 80, growth: 1.2 },
  },

  // Usure : en points (0 à 100). Rendement = 1 − usure ÷ EFFICIENCY_DIVISOR.
  WEAR: {
    PER_HOUR: 0.5,
    EFFICIENCY_DIVISOR: 200,
    SERVICE_THRESHOLD: 70,
    BREAKDOWN: 100,
    MAINTAIN_RATE: 0.2, // part du prix d'achat
    REPAIR_RATE: 0.5,
  },

  /* ---------- Lot 2 : objets, cultures, potager, famille ---------- */

  // Objets (sections 1.1, 8.1 et 8.9). energie : énergie par unité (aliments
  // seulement) ; prix : prix de vente fixe en pièces ; edible : la famille peut
  // le manger ; category : légume, fruit, plat, graine, ingrédient, produit,
  // conserve. nom et icone servent uniquement à l'affichage.
  items: {
    carotte:        { nom: 'Carotte',              icone: '🥕', energie: 6,  prix: 1, edible: true,  category: 'légume' },
    patate:         { nom: 'Patate',               icone: '🥔', energie: 15, prix: 2, edible: true,  category: 'légume' },
    tomate:         { nom: 'Tomate',               icone: '🍅', energie: 6,  prix: 1, edible: true,  category: 'légume' },
    courgette:      { nom: 'Courgette',            icone: '🥒', energie: 8,  prix: 2, edible: true,  category: 'légume' },
    aubergine:      { nom: 'Aubergine',            icone: '🍆', energie: 8,  prix: 2, edible: true,  category: 'légume' },
    // Non périssable, non rachetable au Comptoir (Lot 3).
    conserve:       { nom: 'Conserve',             icone: '🥫', energie: 20, prix: 3, edible: true,  category: 'conserve', rachetable: false },
    graine_carotte:   { nom: 'Graines de carotte',   icone: '🌱', prix: 1, edible: false, category: 'graine' },

/* ==========================================================================
   ENGINE — simulation pure. Aucun accès au DOM, à window, au stockage ou à
   l'horloge : le temps arrive en paramètre (dt, en secondes) et l'aléatoire
   vient exclusivement du générateur à graine stocké dans l'état.
   ========================================================================== */

// Générateur pseudo-aléatoire à graine (mulberry32).
// Renvoie une fonction () => nombre dans [0, 1).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const STATE_VERSION = 4;
const EPS = 1e-9; // tolérance de calcul flottant (pas une valeur d'équilibrage)

// Liste des étapes exécutées au clic sur "Dormir", dans l'ordre. Lot 2 :
// repas et santé, puis pousse. Lot 3 : la péremption, toujours en dernier.
// Les lots suivants insèrent leurs fonctions (ponte...) avant `spoil`.
// Chaque étape reçoit l'état et le modifie.
const NIGHT_STEPS = [feedFamily, growAll, spoil];

/* ---------- appareils : fabrication et sélecteurs ---------- */

function newDayStats() {
  return { produite: 0, perdue: 0, eau: 0 };
}

function makeDevice(type, id, prix) {
  const d = { id, type, niveau: 1, allume: true, usure: 0, prix };
  if (type === 'batterie') {
    d.charge = 0;
    d.entree = 0; // kWh/s reçus au dernier tick
    d.sortie = 0; // kWh/s soutirés au dernier tick
  } else if (type === 'panneau') {
    d.prod = 0; // kWh/s produits au dernier tick
  } else if (type === 'pompe') {
    d.debit = 0; // L/s réellement pompés au dernier tick
    d.conso = 0; // kWh/s consommés au dernier tick
  }
  return d;
}

// Parc et réserves de départ : 1 panneau, 1 batterie, la pompe et le réservoir.
// Les appareils sont des listes d'objets ; la pompe est un appareil unique ;
// le réservoir n'est pas un appareil (`eau` = son contenu en litres).
function startFarm() {
  const prix = DATA.START.DEVICE_PRICE;
  return {
    compteurs: { panneau: 1, batterie: 1 },
    panneaux: [makeDevice('panneau', 'panneau-1', prix)],
    batteries: [makeDevice('batterie', 'batterie-1', prix)],
    pompe: makeDevice('pompe', 'pompe', prix),
    eau: 0,
    flux: { perdue: 0, eau: 0 }, // kWh/s perdus, L/s reçus par le réservoir au dernier tick
    jour: newDayStats(),
    report: null,
  };
}

function allDevices(state) {
  return [...state.panneaux, ...state.batteries, state.pompe];
}

function findDevice(state, id) {
  return allDevices(state).find((d) => d.id === id) || null;
}

function efficiency(d) {
  return 1 - d.usure / DATA.WEAR.EFFICIENCY_DIVISOR;
}

function isBroken(d) {
  return d.usure >= DATA.WEAR.BREAKDOWN - EPS;
}

function needsService(d) {
  return !isBroken(d) && d.usure >= DATA.WEAR.SERVICE_THRESHOLD - EPS;
}

// Production nominale d'un panneau à son niveau et son usure actuels (kWh/s).
function panelOutput(d) {
  return DATA.GRID.panneau.kwhPerS[d.niveau - 1] * efficiency(d);
}

// Capacité utile d'une batterie (kWh) : capacité(niveau) × rendement.
function batteryCapacity(d) {
  return DATA.GRID.batterie.kwh[d.niveau - 1] * efficiency(d);
}

function pumpFlow(d) {
  return DATA.GRID.pompe.litresPerS[d.niveau - 1] * efficiency(d);
}

function tankCapacity(state) {
  return DATA.GRID.pompe.reservoirL[state.pompe.niveau - 1];
}

// Prix du n-ième appareil d'un type, n étant le nombre déjà possédé.
function purchasePrice(type, owned) {
  const p = DATA.PURCHASE[type];
  return roundCoins(p.base * Math.pow(p.growth, owned));
}

function nextPurchasePrice(state, type) {
  const owned = type === 'panneau' ? state.panneaux.length : state.batteries.length;
  return purchasePrice(type, owned);
}

function maintainCost(d) {
  return roundCoins(d.prix * DATA.WEAR.MAINTAIN_RATE);
}

function repairCost(d) {
  return roundCoins(d.prix * DATA.WEAR.REPAIR_RATE);
}

function upgradeCost(d) {
  return d.niveau >= DATA.LEVEL_MAX ? null : DATA.UPGRADE_COST[d.niveau];
}

// Les pièces restent à deux décimales (les prix ×1,2ⁿ ne sont pas entiers).
function roundCoins(x) {
  return Math.round(x * 100) / 100;
}

/* ---------- l'heure ---------- */

function awakeRequired(state) {
  return DATA.TIME.MIN_AWAKE_S;
}

// Heure d'ambiance (0 à 23) : 6 h au réveil, +1 par SECONDS_PER_HOUR d'éveil.
function hourOfDay(state) {
  const hours = Math.floor(state.awakeSeconds / DATA.TIME.SECONDS_PER_HOUR + EPS);
  return (DATA.TIME.DAY_START_HOUR + hours) % 24;
}

/* ---------- énergie : stockage et prélèvement ---------- */

// Range `energy` kWh dans les batteries allumées et non en panne, l'une après
// l'autre dans l'ordre de la liste. Renvoie ce qui n'a rentré nulle part.
function storeEnergy(state, energy) {
  let rest = energy;
  for (const b of state.batteries) {
    if (rest <= EPS) break;
    if (!b.allume || isBroken(b)) continue;
    const room = Math.max(0, batteryCapacity(b) - b.charge);
    const added = Math.min(room, rest);
    if (added > 0) {
      b.charge += added;
      b.entree += added;
      rest -= added;
    }
  }
  return rest > EPS ? rest : 0;
}

// Prélève jusqu'à `energy` kWh dans les batteries, en sens inverse de la liste :
// la dernière remplie se vide la première. Renvoie l'énergie réellement fournie.
// Tous les consommateurs (pompe, puis moulin, presse, réfrigérateur) passent ici.
function drawEnergy(state, energy) {
  let rest = energy;
  for (let i = state.batteries.length - 1; i >= 0; i--) {
    if (rest <= EPS) break;
    const b = state.batteries[i];
    if (!b.allume || isBroken(b)) continue;
    const taken = Math.min(b.charge, rest);
    if (taken > 0) {
      b.charge -= taken;
      b.sortie += taken;
      rest -= taken;
    }
  }
  return energy - (rest > EPS ? rest : 0);
}

// Consommateurs d'énergie, exécutés dans l'ordre à chaque tick. Les lots
// suivants y ajouteront le moulin, la presse et le réfrigérateur.
// `run(state, dt)` prélève son énergie avec drawEnergy().
const CONSUMERS = [
  { id: 'pompe', run: runPump },
];

// La pompe remplit le réservoir si elle est allumée, en état, et que le
// réservoir n'est pas plein. Si l'énergie manque, elle tourne au prorata.
function runPump(state, dt) {
  const p = state.pompe;
  p.debit = 0;
  p.conso = 0;
  if (!p.allume || isBroken(p)) return;
  const room = tankCapacity(state) - state.eau;
  if (room <= EPS) return;
  const kwhPerL = DATA.PUMP.KWH_PER_L;
  const wanted = Math.min(pumpFlow(p) * dt, room);
  const got = drawEnergy(state, wanted * kwhPerL);
  const litres = Math.min(wanted, got / kwhPerL);
  state.eau += litres;
  state.jour.eau += litres;
  p.debit = litres / dt;
  p.conso = got / dt;
  state.flux.eau = litres / dt;
}

/* ---------- la boucle de simulation ---------- */

// Avance la simulation de dt secondes : production, stockage, consommation,
// usure, puis le temps d'éveil.
function tick(state, dt) {
  if (!(dt > 0)) return state;
  for (const b of state.batteries) {
    b.entree = 0;
    b.sortie = 0;
  }
  state.flux.eau = 0;

  // a. production : chaque panneau allumé et non en panne
  let produced = 0;
  for (const p of state.panneaux) {
    p.prod = 0;
    if (p.allume && !isBroken(p)) {
      const e = panelOutput(p) * dt;
      produced += e;
      p.prod = e / dt;
    }
  }

  // b. stockage : batteries remplies l'une après l'autre ; le reste est perdu
  const lost = storeEnergy(state, produced);
  state.jour.produite += produced;
  state.jour.perdue += lost;
  state.flux.perdue = lost / dt;

  // c. consommation : chaque consommateur tire sur les batteries (sens inverse)
  for (const c of CONSUMERS) c.run(state, dt);

  // les quantités du tick deviennent des puissances (kWh/s)
  for (const b of state.batteries) {
    b.entree /= dt;
    b.sortie /= dt;
  }

  // d. usure : seulement pour un appareil qui a réellement fonctionné
  const wear = DATA.WEAR.PER_HOUR * (dt / DATA.TIME.SECONDS_PER_HOUR);
  for (const d of allDevices(state)) {
    let worked = false;
    if (d.type === 'panneau') worked = d.prod > EPS;
    else if (d.type === 'batterie') worked = d.entree > EPS || d.sortie > EPS;
    else if (d.type === 'pompe') worked = d.debit > EPS;
    if (!worked) continue;
    d.usure = Math.min(DATA.WEAR.BREAKDOWN, d.usure + wear);
    if (isBroken(d)) {
      d.usure = DATA.WEAR.BREAKDOWN;
      d.allume = false;
    }
  }

  // e. temps d'éveil (l'heure s'en déduit)
  state.awakeSeconds += dt;
  return state;
}

/* ---------- synthèses pour l'interface (fonctions pures) ---------- */

function energyStats(state) {
  const producing = state.panneaux.filter((p) => p.allume && !isBroken(p));
  const s = {
    production: state.panneaux.reduce((t, p) => t + p.prod, 0),
    panneauxEnMarche: producing.length,
    panneauxTotal: state.panneaux.length,
    panneauxAEntretenir: state.panneaux.filter(needsService).length,
    panneauxEnPanne: state.panneaux.filter(isBroken).length,
    charge: state.batteries.reduce((t, b) => t + b.charge, 0),
    capacite: state.batteries.reduce((t, b) => t + batteryCapacity(b), 0),
    entree: state.batteries.reduce((t, b) => t + b.entree, 0),
    sortie: state.batteries.reduce((t, b) => t + b.sortie, 0),
    batteriesAEntretenir: state.batteries.filter(needsService).length,
    batteriesEnPanne: state.batteries.filter(isBroken).length,
  };
  s.net = s.entree - s.sortie;
  return s;
}

// État affichable d'un appareil : { code, label, badge }.
function deviceStatus(state, d) {
  let code;
  let label;
  if (isBroken(d)) {
    code = 'panne';
    label = 'En panne';
  } else if (!d.allume) {
    code = 'arret';
    label = 'À l\'arrêt';
  } else if (d.type === 'panneau') {
    code = 'marche';
    label = 'En marche';
  } else if (d.type === 'batterie') {
    const net = d.entree - d.sortie;
    if (net < -1e-6) { code = 'decharge'; label = 'En décharge'; }
    else if (net > 1e-6) { code = 'charge'; label = 'En charge'; }
    else if (d.charge >= batteryCapacity(d) * 0.98) { code = 'pleine'; label = 'Pleine'; }
    else if (d.charge <= EPS) { code = 'vide'; label = 'Vide'; }
    else { code = 'attente'; label = 'En attente'; }
  } else {
    if (state.eau >= tankCapacity(state) - EPS) { code = 'plein'; label = 'Réservoir plein'; }
    else if (d.debit > EPS) { code = 'marche'; label = 'En marche'; }
    else { code = 'attente'; label = 'En attente d\'énergie'; }
  }
  return { code, label, badge: needsService(d) ? 'À entretenir' : '' };
}

/* ---------- actions du moteur ---------- */

function fail(error) {
  return { ok: false, error };
}

function spend(state, cost) {
  state.pieces = roundCoins(state.pieces - cost);
}

function toggleDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  if (isBroken(d)) return fail('Appareil en panne : il faut le réparer.');
  d.allume = !d.allume;
  return { ok: true };
}

function buyDevice(state, type) {
  if (type !== 'panneau' && type !== 'batterie') return fail('Type d\'appareil inconnu.');
  const price = nextPurchasePrice(state, type);
  if (state.pieces + EPS < price) return fail('Pas assez de pièces.');
  spend(state, price);
  state.compteurs[type] += 1;
  const d = makeDevice(type, `${type}-${state.compteurs[type]}`, price);
  (type === 'panneau' ? state.panneaux : state.batteries).push(d);
  return { ok: true, device: d, price };
}

function upgradeDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  const cost = upgradeCost(d);
  if (cost === null) return fail('Niveau maximum atteint.');
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  d.niveau += 1;
  return { ok: true, cost };
}

function maintainDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  if (isBroken(d)) return fail('Appareil en panne : il faut le réparer.');
  if (d.usure <= EPS) return fail('Cet appareil n\'est pas usé.');
  const cost = maintainCost(d);
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  d.usure = 0;
  return { ok: true, cost };
}

// Une réparation remet l'usure à 0 ; l'appareil reste éteint : c'est au
// joueur de le rallumer.
function repairDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  if (!isBroken(d)) return fail('Cet appareil n\'est pas en panne.');
  const cost = repairCost(d);
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  d.usure = 0;
  d.allume = false;
  return { ok: true, cost };
}

/* ---------- Lots 2 et 3 : inventaire par lots ---------- */

// state.inventaire = { item: [ { qty, nightsLeft, origin } ] }, les lots étant
// rangés du plus ancien au plus récent. nightsLeft vaut null pour un item qui
// ne périme pas. origin vaut « produit » ou « acheté ». Tout le reste du code
// passe uniquement par countItem, addItem et takeItem (et par buyItem au
// Comptoir, qui pose l'origine « acheté »).

// Conservation d'un item en nuits, ou null s'il ne périme jamais.
function shelfLife(item) {
  if (DATA.CONSERVATION[item] !== undefined) return DATA.CONSERVATION[item];
  const def = DATA.items[item];
  if (def && DATA.CONSERVATION_CATEGORIE[def.category] !== undefined) return DATA.CONSERVATION_CATEGORIE[def.category];
  return null;
}

function isPerishable(item) {
  return shelfLife(item) !== null;
}

// Origine d'un lot ajouté sans précision : « produit », sauf les conserves.
function defaultOrigin(item) {
  const def = DATA.items[item];
  const byCategory = def ? DATA.ORIGINE.PAR_CATEGORIE[def.category] : undefined;
  return byCategory || DATA.ORIGINE.PRODUIT;
}

function lotsOf(state, item) {
  const lots = state.inventaire[item];
  return Array.isArray(lots) ? lots : [];
}

// Rang d'un lot pour l'ordre de retrait : moins il lui reste de nuits, plus
// il est « ancien ». Un lot qui ne périme pas passe en dernier.
function lotRank(lot) {
  return lot.nightsLeft === null ? Infinity : lot.nightsLeft;
}

function countItem(state, item) {
  return lotsOf(state, item).reduce((t, lot) => t + lot.qty, 0);
}

// Quantités totales par item : { item: quantité }, sans les items à zéro.
function inventoryCounts(state) {
  const out = {};
  for (const item of Object.keys(state.inventaire)) {
    const n = countItem(state, item);
    if (n > 0) out[item] = n;
  }
  return out;
}

// Ajoute un lot à conservation pleine ; il rejoint le lot existant de même
// origine et de même fraîcheur.
function addLot(state, item, qty, origin) {
  const nightsLeft = shelfLife(item);
  const lots = lotsOf(state, item);
  const same = lots.find((l) => l.nightsLeft === nightsLeft && l.origin === origin);
  if (same) {
    same.qty += qty;
  } else {
    lots.push({ qty, nightsLeft, origin });
    lots.sort((a, b) => (lotRank(a) === lotRank(b) ? 0 : lotRank(a) < lotRank(b) ? -1 : 1));
  }
  state.inventaire[item] = lots;
}

function addItem(state, item, qty) {
  if (!DATA.items[item] || !(qty > 0)) return 0;
  addLot(state, item, qty, defaultOrigin(item));
  return qty;
}

// Retire jusqu'à `qty` unités, toujours dans le lot le plus ancien, et renvoie
// le nombre réellement retiré.
function takeItem(state, item, qty) {
  const n = Math.min(countItem(state, item), qty);
  if (!(n > 0)) return 0;
  let rest = n;
  const lots = lotsOf(state, item);
  for (const lot of lots) {
    const taken = Math.min(lot.qty, rest);
    lot.qty -= taken;
    rest -= taken;
    if (rest <= 0) break;
  }
  const kept = lots.filter((l) => l.qty > 0);
  if (kept.length) state.inventaire[item] = kept;
  else delete state.inventaire[item];
  return n;
}

// Nuits restantes du lot le plus ancien d'un item (Infinity s'il n'y en a pas
// ou s'il ne périme pas).
function nextExpiry(state, item) {
  const lots = lotsOf(state, item);
  return lots.length ? lotRank(lots[0]) : Infinity;
}

// Quantités qui périmeront à la prochaine nuit (il leur reste 1 nuit).
function expiringSoon(state) {
  const out = {};
  for (const item of Object.keys(state.inventaire)) {
    const n = lotsOf(state, item)
      .filter((l) => l.nightsLeft === 1)
      .reduce((t, l) => t + l.qty, 0);
    if (n > 0) out[item] = n;
  }
  return out;
}

// Étape nocturne de péremption, toujours la dernière : retire une nuit à chaque
// lot qui périme, supprime ceux qui arrivent à 0 et note les pertes dans le
// rapport de la nuit. Renvoie les pertes : { item: quantité }.
function spoil(state) {
  const perdus = {};
  for (const item of Object.keys(state.inventaire)) {
    const kept = [];
    for (const lot of lotsOf(state, item)) {
      if (lot.nightsLeft === null) {
        kept.push(lot);
        continue;
      }
      lot.nightsLeft -= 1;
      if (lot.nightsLeft <= 0) perdus[item] = (perdus[item] || 0) + lot.qty;
      else kept.push(lot);
    }
    if (kept.length) state.inventaire[item] = kept;
    else delete state.inventaire[item];
  }
  if (!state.nuit.perdus) state.nuit.perdus = {};
  for (const [item, n] of Object.entries(perdus)) {
    state.nuit.perdus[item] = (state.nuit.perdus[item] || 0) + n;
  }
  return perdus;
}

/* ---------- Lot 3 : Comptoir ---------- */

// Plancher du coefficient d'achat d'un item (1,2 ; 2,0 pour les graines).
function marketFloor(item) {
  const P = DATA.MARCHE.PLANCHER;
  const p = P[DATA.items[item].category];
  return p === undefined ? P.defaut : p;
}

// Les coefficients ne sont notés dans state.marche qu'une fois sortis de leur
// plancher : { item: coefficient }.
function marketCoef(state, item) {
  const c = state.marche ? state.marche[item] : undefined;
  return typeof c === 'number' ? c : marketFloor(item);
}

function setMarketCoef(state, item, coef) {
  if (!state.marche) state.marche = {};
  const c = Math.max(marketFloor(item), Math.round(coef * 100) / 100);
  if (c <= marketFloor(item) + EPS) delete state.marche[item];
  else state.marche[item] = c;
}

function isBuyable(item) {
  const def = DATA.items[item];
  return !!def && def.rachetable !== false;
}

function sellPrice(item) {
  return DATA.items[item].prix;
}

// Prix de la prochaine unité achetée.
function buyPrice(state, item) {
  return roundCoins(sellPrice(item) * marketCoef(state, item));
}

// Achète jusqu'à `qty` unités, une par une : le prix monte entre deux unités.
// S'arrête quand les pièces manquent. Un item acheté arrive avec sa
// conservation pleine et l'origine « acheté ».
function buyItem(state, item, qty = 1) {
  const def = DATA.items[item];
  if (!def) return fail('Objet inconnu.');
  if (!isBuyable(item)) return fail(`${def.nom} ne s'achète pas.`);
  let bought = 0;
  let cost = 0;
  for (let i = 0; i < qty; i++) {
    const price = buyPrice(state, item);
    if (state.pieces + EPS < price) break;
    spend(state, price);
    addLot(state, item, 1, DATA.ORIGINE.ACHETE);
    setMarketCoef(state, item, marketCoef(state, item) + DATA.MARCHE.PAS);
    bought += 1;
    cost = roundCoins(cost + price);
  }
  if (bought === 0) return fail('Pas assez de pièces.');
  return { ok: true, bought, cost };
}

// Vend jusqu'à `qty` unités (les lots les plus anciens d'abord) au prix fixe ;
// chaque unité vendue retire un pas au coefficient, sans passer sous le plancher.
function sellItem(state, item, qty) {
  const def = DATA.items[item];
  if (!def) return fail('Objet inconnu.');
  const n = takeItem(state, item, Math.floor(Number(qty)) || 0);
  if (n <= 0) return fail('Rien à vendre.');
  const gain = roundCoins(n * sellPrice(item));
  state.pieces = roundCoins(state.pieces + gain);
  setMarketCoef(state, item, marketCoef(state, item) - DATA.MARCHE.PAS * n);
  return { ok: true, sold: n, gain };
}

/* ---------- Lot 2 : aléatoire à graine (état dans state.rngSeed) ---------- */

// Même suite que mulberry32(graine), mais l'état du générateur vit dans
// state.rngSeed : il est sauvegardé avec la partie et reste reproductible.
function nextRandom(state) {
  const a = ((state.rngSeed >>> 0) + 0x6d2b79f5) | 0;
  state.rngSeed = a;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// Entier tiré dans [min, max], bornes comprises.
function randomInt(state, min, max) {
  return min + Math.floor(nextRandom(state) * (max - min + 1));
}

/* ---------- Lot 2 : famille et santé ---------- */

function makeMember(def) {
  return { id: def.id, nom: def.nom, enfant: def.enfant, sante: DATA.FAMILY.SANTE_DEPART, malade: false };
}

function familyNeed(state) {
  return state.famille.membres.reduce((t, m) => t + DATA.FAMILY.AJ[m.enfant ? 'enfant' : 'adulte'], 0);
}

// Moyenne brute des santés (sert aux comptes rendus).
function rawAverageHealth(state) {
  const m = state.famille.membres;
  return m.length ? m.reduce((t, x) => t + x.sante, 0) / m.length : 0;
}

// Santé moyenne pour la productivité : un membre malade compte pour 0.
function averageHealth(state) {
  const m = state.famille.membres;
  return m.length ? m.reduce((t, x) => t + (x.malade ? 0 : x.sante), 0) / m.length : 0;
}

// Multiplicateur de productivité. Il ne s'applique qu'aux actions au clic
// (récolte manuelle) : jamais aux automatisations des lots suivants.
function productivity(state) {
  const h = averageHealth(state);
  for (const tier of DATA.FAMILY.PRODUCTIVITE) {
    if (h + EPS >= tier.min) return tier.mult;
  }
  return DATA.FAMILY.PRODUCTIVITE[DATA.FAMILY.PRODUCTIVITE.length - 1].mult;
}

// Variation de santé d'une nuit selon la couverture du besoin (0 à 1).
function healthDelta(coverage) {
  for (const tier of DATA.FAMILY.VARIATION) {
    if (coverage + EPS >= tier.min) return tier.delta;
  }
  return DATA.FAMILY.VARIATION[DATA.FAMILY.VARIATION.length - 1].delta;
}

// Aliments dans l'ordre où la famille les mange : d'abord ce qui périme le plus
// tôt (lot le plus ancien de chaque item ; ce qui ne périme pas passe en
// dernier, donc les conserves), puis par énergie décroissante.
function mealOrder(state) {
  const keys = Object.keys(DATA.items).filter((k) => DATA.items[k].edible);
  return keys.sort((a, b) => {
    const ea = nextExpiry(state, a);
    const eb = nextExpiry(state, b);
    if (ea !== eb) return ea < eb ? -1 : 1;
    return DATA.items[b].energie - DATA.items[a].energie;
  });
}

// Repas de la nuit, calculé sans rien modifier (sert aussi à l'aperçu de
// Dormir). Les quantités de la réserve de semences ne sont jamais mangées.
function planMeal(state) {
  const need = familyNeed(state);
  let covered = 0;
  const mange = {};
  for (const item of mealOrder(state)) {
    if (covered >= need - EPS) break;
    const spare = countItem(state, item) - (state.famille.reserve[item] || 0);
    if (spare <= 0) continue;
    const energy = DATA.items[item].energie;
    const n = Math.min(spare, Math.ceil((need - covered) / energy - EPS));
    if (n <= 0) continue;
    mange[item] = n;
    covered += n * energy;
  }
  return {
    besoin: need,
    energie: covered,
    mange,
    couverture: need > 0 ? Math.min(1, covered / need) : 1,
  };
}

// Applique la variation de santé. Un membre qui tombe à 0 devient malade ; un
// malade regagne RECUPERATION_MALADE points par nuit couverte à 100 % (sinon il
// subit la variation normale) et guérit en atteignant la santé d'un soin.
// Renvoie les membres devenus malades cette nuit.
function updateHealth(state, coverage) {
  const F = DATA.FAMILY;
  const delta = healthDelta(coverage);
  const fed = coverage + EPS >= 1;
  const nouveaux = [];
  for (const m of state.famille.membres) {
    const gain = m.malade && fed ? F.RECUPERATION_MALADE : delta;
    m.sante = Math.max(0, Math.min(F.SANTE_MAX, m.sante + gain));
    if (m.malade && m.sante >= F.SOIN.SANTE) {
      m.malade = false;
    } else if (!m.malade && m.sante <= 0) {
      m.malade = true;
      nouveaux.push(m.nom);
    }
  }
  return nouveaux;
}

function newNightStats() {
  return { besoin: 0, energie: 0, couverture: 1, mange: {}, santeAvant: 0, santeApres: 0, nouveauxMalades: [], perdus: {} };
}

// Première étape nocturne : le repas, puis la santé.
function feedFamily(state) {
  const plan = planMeal(state);
  for (const [item, n] of Object.entries(plan.mange)) takeItem(state, item, n);
  const avant = rawAverageHealth(state);
  const nouveaux = updateHealth(state, plan.couverture);
  state.nuit = {
    besoin: plan.besoin,
    energie: plan.energie,
    couverture: plan.couverture,
    mange: plan.mange,
    santeAvant: avant,
    santeApres: rawAverageHealth(state),
    nouveauxMalades: nouveaux,
    perdus: {},
  };
  return plan;
}

function careCost(state) {
  const c = DATA.FAMILY.SOIN;
  return Math.round(c.base * Math.pow(c.croissance, state.famille.soinsPayes));
}

function findMember(state, id) {
  return state.famille.membres.find((m) => m.id === id) || null;
}

// Soigne un malade : coût croissant, santé remise à SOIN.SANTE.
function heal(state, memberId) {
  const m = findMember(state, memberId);
  if (!m) return fail('Membre introuvable.');
  if (!m.malade) return fail(`${m.nom} n'est pas malade.`);
  const cost = careCost(state);
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  state.famille.soinsPayes += 1;
  m.sante = DATA.FAMILY.SOIN.SANTE;
  m.malade = false;
  return { ok: true, cost };
}

// Items que la famille pourrait manger mais qui servent aussi de plants
// (aujourd'hui la patate) : ce sont ceux dont la réserve se règle.
function reservableItems() {
  return Object.keys(DATA.crops)
    .map((c) => DATA.crops[c].graines.item)
    .filter((item, i, all) => DATA.items[item].edible && all.indexOf(item) === i);
}

function setSeedReserve(state, item, qty) {
  if (!DATA.items[item]) return fail('Objet inconnu.');
  const n = Math.max(0, Math.floor(Number(qty)));
  if (!Number.isFinite(n)) return fail('Quantité invalide.');
  state.famille.reserve[item] = n;
  return { ok: true, reserve: n };
}

/* ---------- Lot 2 : potager ---------- */

function makePlot(n) {
  return { id: `${DATA.POTAGER.LIEU}-${n}`, lieu: DATA.POTAGER.LIEU, culture: null, stade: 0, arrose: false, montee: false };
}

function makePlots(count) {
  const plots = [];
  for (let i = 1; i <= count; i++) plots.push(makePlot(i));
  return plots;
}

function findPlot(state, id) {
  return state.potager.parcelles.find((p) => p.id === id) || null;
}

function seedItem(culture) {
  return DATA.crops[culture].graines.item;
}

function plantableCrops(lieu) {
  return Object.keys(DATA.crops).filter((c) => DATA.crops[c].lieux.includes(lieu));
}

// Dernier stade d'une plante : la montée en graine de la carotte en ajoute.
function maxStage(plot) {
  const def = DATA.crops[plot.culture];
  return def.stades + (plot.montee ? def.graines.stadesSupp : 0);
}

function isMature(plot) {
  return !!plot.culture && plot.stade >= maxStage(plot);
}

// Rendement d'une récolte au clic (× productivité) ou automatique (× 1).
function harvestYield(state, culture, auto = false) {
  return Math.round(DATA.crops[culture].rendement * (auto ? 1 : productivity(state)));
}

// Parcelles mûres regroupées par culture et par mode : [{ culture, nombre, montee }].
function readyCrops(state) {
  const out = [];
  for (const p of state.potager.parcelles) {
    if (!isMature(p)) continue;
    let e = out.find((x) => x.culture === p.culture && x.montee === p.montee);
    if (!e) {
      e = { culture: p.culture, nombre: 0, montee: p.montee };
      out.push(e);
    }
    e.nombre += 1;
  }
  return out;
}

function plant(state, plotId, culture) {
  const plot = findPlot(state, plotId);
  if (!plot) return fail('Parcelle introuvable.');
  const def = DATA.crops[culture];
  if (!def) return fail('Culture inconnue.');
  if (plot.culture) return fail('Cette parcelle est déjà plantée.');
  if (!def.lieux.includes(plot.lieu)) return fail(`${def.nom} ne se plante pas ici.`);
  if (takeItem(state, seedItem(culture), 1) < 1) return fail(`Pas de graines : ${def.nom}.`);
  plot.culture = culture;
  plot.stade = 0;
  plot.arrose = false;
  plot.montee = false;
  return { ok: true };
}

// Une fois par nuit et par parcelle ; consomme l'eau du réservoir.
function water(state, plotId) {
  const plot = findPlot(state, plotId);
  if (!plot) return fail('Parcelle introuvable.');
  if (!plot.culture) return fail('Rien n\'est planté ici.');
  if (plot.arrose) return fail('Déjà arrosée : une fois par nuit.');
  if (isMature(plot)) return fail('Déjà mûre, inutile d\'arroser.');
  const litres = DATA.crops[plot.culture].litres;
  if (state.eau + EPS < litres) return fail('Pas assez d\'eau dans le réservoir.');
  state.eau = Math.max(0, state.eau - litres);
  plot.arrose = true;
  return { ok: true, litres };
}

// Carotte seulement, et seulement une fois mûre : elle reste alors 2 stades de
// plus et rend des graines au lieu de carottes. Rebasculer annule.
function toggleBolting(state, plotId) {
  const plot = findPlot(state, plotId);
  if (!plot) return fail('Parcelle introuvable.');
  if (!plot.culture) return fail('Rien n\'est planté ici.');
  const def = DATA.crops[plot.culture];
  if (def.graines.mode !== 'montee') return fail(`${def.nom} ne monte pas en graine.`);
  if (plot.stade < def.stades) return fail('Pas encore mûre.');
  plot.montee = !plot.montee;
  return { ok: true, montee: plot.montee };
}

// Récolte : la parcelle est libérée. `auto` = true pour une automatisation
// (non pénalisée par la santé) ; le clic du joueur applique la productivité.
function harvest(state, plotId, auto = false) {
  const plot = findPlot(state, plotId);
  if (!plot) return fail('Parcelle introuvable.');
  if (!plot.culture) return fail('Rien à récolter ici.');
  if (!isMature(plot)) return fail('Pas encore mûre.');
  const culture = plot.culture;
  const def = DATA.crops[culture];
  const items = {};
  const gain = (item, qty) => {
    if (qty > 0) {
      addItem(state, item, qty);
      items[item] = (items[item] || 0) + qty;
    }
  };
  if (plot.montee) {
    gain(def.graines.item, def.graines.quantite);
  } else {
    gain(culture, harvestYield(state, culture, auto));
    if (def.graines.mode === 'recolte') gain(def.graines.item, randomInt(state, def.graines.min, def.graines.max));
  }
  plot.culture = null;
  plot.stade = 0;
  plot.arrose = false;
  plot.montee = false;
  return { ok: true, culture, items };
}

// Deuxième étape nocturne : +1 stade si la parcelle a été arrosée (jusqu'au
// dernier stade), puis remise à zéro de l'arrosage.
function growAll(state) {
  for (const p of state.potager.parcelles) {
    if (!p.culture) {
      p.arrose = false;
      continue;
    }
    if (p.arrose && p.stade < maxStage(p)) p.stade += 1;
    p.arrose = false;
  }
}

function potagerUpgradeCost(state) {
  return state.potager.niveau >= DATA.LEVEL_MAX ? null : DATA.POTAGER.COUT[state.potager.niveau];
}

function upgradePotager(state) {
  const cost = potagerUpgradeCost(state);
  if (cost === null) return fail('Niveau maximum atteint.');
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  state.potager.niveau += 1;
  const target = DATA.POTAGER.PARCELLES[state.potager.niveau - 1];
  for (let n = state.potager.parcelles.length + 1; n <= target; n++) state.potager.parcelles.push(makePlot(n));
  return { ok: true, cost };
}

/* ---------- la nuit ---------- */

function canSleep(state) {
  return state.awakeSeconds >= awakeRequired(state) - EPS;
}

function buildMorningReport(state) {
  const aSurveiller = (d) => ({ id: d.id, type: d.type, usure: d.usure });
  return {
    nuit: state.day,
    energie: state.batteries.reduce((t, b) => t + b.charge, 0),
    capacite: state.batteries.reduce((t, b) => t + batteryCapacity(b), 0),
    energiePerdue: state.jour.perdue,
    eau: state.eau,
    capaciteEau: tankCapacity(state),
    aEntretenir: allDevices(state).filter(needsService).map(aSurveiller),
    enPanne: allDevices(state).filter(isBroken).map(aSurveiller),
    // Lot 2 : repas, santé et récoltes prêtes.
    besoin: state.nuit.besoin,
    energieMangee: state.nuit.energie,
    couverture: state.nuit.couverture,
    mange: { ...state.nuit.mange },
    santeAvant: state.nuit.santeAvant,
    santeApres: state.nuit.santeApres,
    nouveauxMalades: [...state.nuit.nouveauxMalades],
    pretes: readyCrops(state),
    // Lot 3 : ce qui a péri cette nuit, et ce qui périra à la prochaine.
    perimes: { ...(state.nuit.perdus || {}) },
    aPerimer: expiringSoon(state),
  };
}

// Ne fait rien tant que l'éveil minimal n'est pas atteint (renvoie null).
// Sinon : étapes nocturnes dans l'ordre, jour suivant, éveil remis à 0
// (l'heure repart à 6 h), rapport de réveil.
function sleep(state) {
  if (!canSleep(state)) return null;
  state.nuit = newNightStats();
  for (const step of NIGHT_STEPS) step(state);
  state.day += 1;
  state.awakeSeconds = 0;
  state.report = buildMorningReport(state);
  state.jour = newDayStats();
  return state.report;
}

/* ---------- actions du mode test ---------- */

function testAddPieces(state, amount) {
  state.pieces = roundCoins(state.pieces + amount);
  return { ok: true };
}

function testAddDevice(state, type) {
  const n = ++state.compteurs[type];
  const d = makeDevice(type, `${type}-${n}`, 0);
  (type === 'panneau' ? state.panneaux : state.batteries).push(d);
  return { ok: true, device: d };
}

function testFillBatteries(state) {
  for (const b of state.batteries) b.charge = batteryCapacity(b);
  return { ok: true };
}

function testFillTank(state) {
  state.eau = tankCapacity(state);
  return { ok: true };
}

function testSetWear(state, id, usure) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  d.usure = Math.max(0, Math.min(DATA.WEAR.BREAKDOWN, usure));
  if (isBroken(d)) d.allume = false;
  return { ok: true };
}

function testSkipAwake(state) {
  state.awakeSeconds = Math.max(state.awakeSeconds, awakeRequired(state));
  return { ok: true };
}

// Lot 2 : 10 de chaque graine (et de chaque plant).
function testAddSeeds(state) {
  for (const culture of Object.keys(DATA.crops)) addItem(state, seedItem(culture), 10);
  return { ok: true };
}

// Lot 2 : toutes les parcelles plantées deviennent mûres.
function testRipenAll(state) {
  for (const p of state.potager.parcelles) {
    if (p.culture) p.stade = maxStage(p);
  }
  return { ok: true };
}

// Lot 2 : santé de toute la famille à 0 (tous malades).
function testSetHealthZero(state) {
  for (const m of state.famille.membres) {
    m.sante = 0;
    m.malade = true;
  }
  return { ok: true };
}

// Lot 3 : 20 unités de chaque aliment (à conservation pleine).
function testAddFood(state) {
  for (const item of Object.keys(DATA.items)) {
    if (DATA.items[item].edible) addItem(state, item, 20);
  }
  return { ok: true };
}

// Lot 3 : vieillit tout l'inventaire d'une nuit (sans passer la nuit) ; les
// lots arrivés à 0 disparaissent. Renvoie les pertes.
function testAgeInventory(state) {
  return { ok: true, perdus: spoil(state) };
}

function testSleepNights(state, count) {
  let report = null;
  for (let i = 0; i < count; i++) {
    testSkipAwake(state);
    report = sleep(state);
  }
  return { ok: true, report };
}

// Lot 2 : inventaire de départ, potager, famille et compte rendu de la nuit.
// Lot 3 : l'inventaire de départ, en lots à conservation pleine.
function startInventory() {
  const inv = {};
  for (const [item, qty] of Object.entries(DATA.START.INVENTAIRE)) {
    inv[item] = [{ qty, nightsLeft: shelfLife(item), origin: defaultOrigin(item) }];
  }
  return inv;
}

function startHousehold() {
  return {
    inventaire: startInventory(),
    potager: { niveau: 1, parcelles: makePlots(DATA.POTAGER.PARCELLES[0]) },
    famille: {
      membres: DATA.FAMILY.MEMBRES.map(makeMember),
      soinsPayes: 0,
      reserve: { ...DATA.FAMILY.RESERVE_DEPART },
    },
    nuit: newNightStats(),
  };
}

// État initial du jeu. `seed` doit être fourni par l'appelant (l'app),
// jamais lu depuis l'horloge ici : l'ENGINE reste pur et testable.
function createInitialState(seed = 1) {
  return {
    version: STATE_VERSION,
    day: 1,
    awakeSeconds: 0,
    pieces: DATA.START.PIECES,
    rngSeed: seed >>> 0,
    unlockedTabs: ['ferme', 'famille', 'inventaire', 'comptoir'],
    stats: {},
    marche: {}, // Lot 3 : coefficients d'achat au-dessus de leur plancher
    ...startFarm(),
    ...startHousehold(),
  };
}

// Table de migrations successives : MIGRATIONS[n] transforme un état de
// version n vers n+1. L'entrée 0 sert de filet pour toute sauvegarde
// antérieure au champ `version` (et de cas de test).
const MIGRATIONS = {
  0: (state) => ({ ...state, version: 1 }),
  // v1 (Lot 0) → v2 (Lot 1) : ajout du parc d'appareils, de l'eau et du rapport.
  1: (state) => ({ ...startFarm(), ...state, version: 2 }),
  // v2 (Lot 1) → v3 (Lot 2) : inventaire de départ, potager, famille, onglet Famille.
  2: (state) => {
    const tabs = Array.isArray(state.unlockedTabs) ? [...state.unlockedTabs] : ['ferme', 'inventaire', 'comptoir'];
    if (!tabs.includes('famille')) tabs.splice(Math.min(1, tabs.length), 0, 'famille');
    return { ...startHousehold(), ...state, unlockedTabs: tabs, version: 3 };
  },
  // v3 (Lot 2) → v4 (Lot 3) : l'inventaire { item: quantité } devient des lots
  // d'origine « produit » (« acheté » pour les conserves) à conservation pleine ;
  // le Comptoir et le rapport de péremption apparaissent.
  3: (state) => {
    const inventaire = {};
    const old = state.inventaire && typeof state.inventaire === 'object' ? state.inventaire : {};
    for (const [item, v] of Object.entries(old)) {
      if (Array.isArray(v)) {
        inventaire[item] = v;
        continue;
      }
      const qty = Number(v);
      if (qty > 0) inventaire[item] = [{ qty, nightsLeft: shelfLife(item), origin: defaultOrigin(item) }];
    }
    const nuit = state.nuit && typeof state.nuit === 'object'
      ? { ...state.nuit, perdus: state.nuit.perdus || {} }
      : newNightStats();
    return { ...state, inventaire, nuit, marche: state.marche || {}, version: 4 };
  },
};

// Applique les migrations successives à une sauvegarde { v, t, s } (ou à un
// état brut) jusqu'à atteindre la version courante. Ne lance jamais
// d'exception : une entrée invalide retombe sur un état migré au mieux.
function migrate(save) {
  let state = save && typeof save === 'object' && save.s && typeof save.s === 'object'
    ? { ...save.s }
    : (save && typeof save === 'object' ? { ...save } : {});
  let version = typeof state.version === 'number' ? state.version : 0;
  let guard = 0;
  while (MIGRATIONS[version] && guard < 1000) {
    state = MIGRATIONS[version](state);
    version = typeof state.version === 'number' ? state.version : version + 1;
    guard++;
  }
  if (typeof state.version !== 'number') state.version = version;
  return state;
}

// Formatage des nombres à la française : entiers avec espace tous les
// 3 chiffres en dessous de 10 000, milliers en "k" et millions en "M"
// au-delà, avec une décimale séparée par une virgule.
// Fonction pure : elle vit dans ENGINE pour rester testable par Node, même
// si c'est l'app qui l'utilise pour l'affichage.
function formatNumber(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '0';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) {
    return sign + formatFixed(abs / 1_000_000, 1) + ' M';
  }
  if (abs >= 10_000) {
    return sign + formatFixed(abs / 1_000, 1) + ' k';
  }
  return sign + groupThousands(Math.round(abs));
}

// Groupe un entier positif par milliers avec des espaces : 1234 -> "1 234".
function groupThousands(intValue) {
  const s = String(Math.trunc(intValue));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const posFromEnd = s.length - i;
    out += s[i];
    if (posFromEnd > 1 && posFromEnd % 3 === 1) out += ' ';
  }
  return out;
}

// Formate un nombre décimal avec `digits` décimales et une virgule française.
function formatFixed(value, digits) {
  return value.toFixed(digits).replace('.', ',');
}

// Pièces : entier si possible, sinon 1 ou 2 décimales (les prix ×1,2ⁿ ne sont
// pas entiers : 86,4 ; 103,68).
function formatCoins(n) {
  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r) || Math.abs(r) >= 10000) return formatNumber(r);
  const sign = r < 0 ? '-' : '';
  const abs = Math.abs(r);
  const digits = Math.abs(abs * 10 - Math.round(abs * 10)) < 1e-9 ? 1 : 2;
  const [i, dec] = abs.toFixed(digits).split('.');
  return sign + groupThousands(Number(i)) + ',' + dec;
}

// Puissance signée en kWh/s avec le vrai signe moins : « +0,02 » ou « −0,01 ».
function formatRate(value, digits = 2) {
  const text = formatFixed(Math.abs(value), digits);
  if (Number(text.replace(',', '.')) === 0) return text; // zéro : sans signe
  return (value < 0 ? '−' : '+') + text;
}

function formatHour(h) {
  return `${h} h`;
}

// Multiplicateur de productivité : « 1 », « 0,8 », « 0,25 ».
function formatMult(m) {
  return String(m).replace('.', ',');
}
</script>

'use strict';

/* ==========================================================================
   Tests du moteur (bloc "core" uniquement). Petite fonction test/assert
   maison : pas de dépendance externe. Ce bloc est en type="text/plain" pour
   ne jamais s'exécuter dans le navigateur ; run-tests.mjs l'extrait et
   l'exécute avec Node, à la suite du bloc core.
   ========================================================================== */

const __tests = [];

function test(name, fn) {
  __tests.push({ name, fn });
}

function assert(condition, message) {
  if (!condition) throw new Error(message || 'assertion échouée');
}

function assertEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) {
    throw new Error(message || `attendu ${b}, obtenu ${a}`);
  }
}

function runTests() {
  const results = { total: __tests.length, passed: 0, failed: [] };
  for (const t of __tests) {
    try {
      t.fn();
      results.passed++;
    } catch (e) {
      results.failed.push({ name: t.name, error: e && e.message ? e.message : String(e) });
    }
  }
  // Assignation explicite sur globalThis : une déclaration `let`/`const` de
  // premier niveau ne devient pas une propriété de l'objet global (ni dans
  // un navigateur, ni dans un contexte vm Node), donc run-tests.mjs ne
  // pourrait pas la relire depuis l'extérieur du script sans ceci.
  if (typeof globalThis !== 'undefined') {
    globalThis.__testResults = results;
  }
  return results;
}

// État de test : réservoir plein d'eau (le potager s'arrose avec).
function garden() {
  const s = createInitialState(1);
  s.pompe.allume = false;
  s.eau = 40;

// Plante une culture sur une parcelle et la fait mûrir d'un coup.
function plantRipe(s, plotId, culture) {
  assert(plant(s, plotId, culture).ok, `planter ${culture}`);
  const p = findPlot(s, plotId);
  p.stade = maxStage(p);
  return p;
}

// Lot 3 : remplace l'inventaire par ces quantités (lots à conservation pleine).
function setInv(s, quantities) {
  s.inventaire = {};
  for (const [item, n] of Object.entries(quantities)) addItem(s, item, n);
}

function setHealth(s, value) {
  for (const m of s.famille.membres) {
    m.sante = value;
    m.malade = false;
  }
}

test('graines rendues : tomate, courgette et aubergine rendent 1 à 2 graines, reproductibles', () => {
  function run(seed, culture) {
    const s = createInitialState(seed);
    setHealth(s, 100);
    const gains = [];
    const seedName = seedItem(culture);
    addItem(s, seedName, 40);
    for (let i = 0; i < 30; i++) {
      plant(s, 'potager-1', culture);
      const p = findPlot(s, 'potager-1');
      p.stade = maxStage(p);
      const before = countItem(s, seedName);
      const r = harvest(s, 'potager-1');
      gains.push(countItem(s, seedName) - before);
      assertEqual(r.items[culture], DATA.crops[culture].rendement);
    }
    return gains;
  }
  for (const culture of ['tomate', 'courgette', 'aubergine']) {
    const a = run(7, culture);
    assert(a.every((g) => g === 1 || g === 2), `${culture} : 1 ou 2 graines, obtenu ${a}`);
    assert(a.includes(1) && a.includes(2), `${culture} : les deux valeurs sortent`);
    assertEqual(run(7, culture), a, 'même graine, même suite');
  }
});

// Compte les unités d'un item selon l'origine de leurs lots.
function countByOrigin(s, item, origin) {
  return lotsOf(s, item).filter((l) => l.origin === origin).reduce((t, l) => t + l.qty, 0);
}

test('Comptoir : prix d\'achat = prix de vente × coefficient, plancher 1,2', () => {

  assertEqual(marketCoef(s, 'patate'), 1.2);
  assertEqual(buyPrice(s, 'patate'), 2.4);
  assertEqual(buyPrice(s, 'carotte'), 1.2);
  assertEqual(buyPrice(s, 'courgette'), 2.4);
  assertEqual(isBuyable('carotte'), true);
});

test('Comptoir : le prix d\'achat monte de 0,1 de coefficient par unité, unité par unité', () => {
  const s = garden();
  s.pieces = 100;
  const paid = [];
  for (let i = 0; i < 3; i++) {
    const before = s.pieces;
    const r = buyItem(s, 'patate');
    assertEqual([r.ok, r.bought], [true, 1]);
    paid.push(roundCoins(before - s.pieces));
    assertEqual(r.cost, paid[i]);
  }
  assertEqual(paid, [2.4, 2.6, 2.8]);
  assertEqual(marketCoef(s, 'patate'), 1.5);
  assertEqual(buyPrice(s, 'patate'), 3);
  assertEqual(countItem(s, 'patate'), 9, '6 de départ + 3');
  // un achat de plusieurs unités reprend le même chemin, le prix montant entre chacune
  const t = garden();
  t.pieces = 100;
  const r = buyItem(t, 'patate', 3);
  assertEqual([r.bought, r.cost], [3, 7.8]);
  assertEqual(t.pieces, 92.2);
});

test('Comptoir : la vente est au prix fixe et fait baisser le coefficient de 0,1 par unité', () => {
  const s = garden();
  s.pieces = 100;
  buyItem(s, 'patate', 3); // coefficient 1,5
  const before = s.pieces;
  const r = sellItem(s, 'patate', 2);
  assertEqual([r.ok, r.sold, r.gain], [true, 2, 4]);
  assertEqual(s.pieces, roundCoins(before + 4), 'prix de vente fixe : 2 pièces par patate');
  assertEqual(marketCoef(s, 'patate'), 1.3);
  assertEqual(buyPrice(s, 'patate'), 2.6, 'vendre 2 patates ramène le prix à 2,6');
  // la vente ne dépend ni de l'âge ni de l'origine
  assertEqual(sellItem(s, 'conserve', 10).gain, 30);
});

test('Comptoir : le coefficient ne descend jamais sous le plancher de 1,2', () => {
  const s = garden();
  sellItem(s, 'patate', 5);
  assertEqual(marketCoef(s, 'patate'), 1.2);
  assertEqual(buyPrice(s, 'patate'), 2.4);
  buyItem(s, 'carotte', 1); // acheté : 1,3 — puis vendu 10 : bloqué à 1,2
  addItem(s, 'carotte', 10);
  sellItem(s, 'carotte', 11);
  assertEqual(marketCoef(s, 'carotte'), 1.2);

});

test('Comptoir : graines, coefficient de départ et plancher à 2,0', () => {

test('Comptoir : les coefficients sont propres à chaque item et ne redescendent pas avec le temps', () => {
