<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ferme Familiale</title>
<style>
:root {
  --color-sun: #f2a71b;
  --color-sun-dark: #d68c0c;
  --color-leaf: #4f8a3d;
  --color-leaf-dark: #386b2a;
  --color-earth: #8a5a34;

  --bg: #faf6ee;
  --bg-elevated: #ffffff;
  --bg-header: #fef3dc;
  --bg-muted: #f1ebdc;
  --text: #2c2416;
  --text-muted: #6b5f4a;
  --border: #e3d9c2;
  --accent: var(--color-leaf);
  --accent-contrast: #ffffff;
  --accent-secondary: var(--color-sun);
  --danger: #c1442e;
  --danger-contrast: #ffffff;
  --shadow: 0 1px 3px rgba(44, 36, 22, 0.12);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1a14;
    --bg-elevated: #26231b;
    --bg-header: #2c2718;
    --bg-muted: #2a271e;
    --text: #f2ecdd;
    --text-muted: #b9ae95;
    --border: #3c3626;
    --accent: #6fae5a;
    --accent-contrast: #10230d;
    --accent-secondary: #f2a71b;
    --danger: #e0664c;
    --danger-contrast: #2a0d06;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

body {
  padding-bottom: 24px;
}

button {
  font-family: inherit;
  font-size: 1rem;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.app-title {
  font-weight: 700;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}

.indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:active { transform: translateY(1px); }

main {
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}

.tabbar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}

.tab-btn.active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

.panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 16px;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.panel p.hint {
  color: var(--text-muted);
  margin: 0;
}

.btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}

.btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-contrast);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stack { display: flex; flex-direction: column; gap: 12px; }

textarea, input[type="text"] {
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  padding: 0;
}

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
}

.modal {
  background: var(--bg-elevated);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px 16px 28px;
  box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  .modal { border-radius: var(--radius); }
}

.modal h2 {
  margin-top: 0;
}

.modal-close {
  float: right;
}

details.test-panel {
  margin-top: 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  background: var(--bg-muted);
}

details.test-panel summary {
  cursor: pointer;
  font-weight: 600;
  padding: 8px 0;
  min-height: 28px;
}

.state-dump {
  white-space: pre-wrap;
  word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  max-height: 260px;
  overflow-y: auto;
}

/* ---------- Lot 1 : en-tête, cartes, appareils, interrupteurs, Dormir ---------- */

body { padding-bottom: 104px; } /* place pour la barre « Dormir » */

.app-header { flex-wrap: wrap; }

.indicators {
  order: 3;
  width: 100%;
  justify-content: space-between;
  gap: 8px 12px;
}

.indicator {
  white-space: nowrap;
}

@media (min-width: 640px) {
  .indicators { justify-content: flex-start; gap: 8px 28px; }
}

.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

@media (min-width: 640px) {
  .cards { grid-template-columns: 1fr 1fr; }
}

.card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: left;
  width: 100%;
  min-width: 0;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font: inherit;
}

button.card { cursor: pointer; min-height: 44px; }
button.card:active { transform: translateY(1px); }

.card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 700;
  font-size: 1.05rem;
}

.card-title .chevron { color: var(--text-muted); font-weight: 400; }

.big {
  font-size: 1.4rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.muted { color: var(--text-muted); font-size: 0.9rem; }
.num { font-variant-numeric: tabular-nums; }

.alert {
  color: var(--danger);
  font-weight: 600;
  font-size: 0.9rem;
}

.chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 0.85rem;
  font-weight: 600;
  white-space: nowrap;
}

.chip.panne { background: var(--danger); border-color: var(--danger); color: var(--danger-contrast); }
.chip.warn { border-color: var(--danger); color: var(--danger); }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.bar {
  display: block;
  height: 10px;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  background: var(--accent);
}

.bar-fill.warn { background: var(--color-sun); }
.bar-fill.bad { background: var(--danger); }

.switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 14px 0 6px;
  border-radius: 999px;
  border: 2px solid var(--danger);
  background: var(--danger);
  color: var(--danger-contrast);
  font-weight: 700;
  cursor: pointer;
}

.switch .knob {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--shadow);
}

.switch[aria-checked="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
  flex-direction: row-reverse;
  padding: 0 6px 0 14px;
}

.switch:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.switch:focus-visible, .btn:focus-visible, .card:focus-visible, .tab-btn:focus-visible {
  outline: 3px solid var(--color-sun);
  outline-offset: 2px;
}

.device-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.device-actions .btn { padding: 0 12px; }

.device-list { display: flex; flex-direction: column; gap: 12px; margin: 12px 0; }

.screen-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.screen-head h2 { margin: 0; }

.sleep-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: var(--bg-header);
  border-top: 1px solid var(--border);
}

.sleep-bar .btn {
  display: block;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  min-height: 52px;
  font-size: 1.1rem;
}

.report-list { list-style: none; margin: 12px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

select {
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  padding: 0 8px;
  font: inherit;
  max-width: 100%;
}

.toast {
  position: fixed;
  bottom: 88px;
  left: 16px;
  right: 16px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--text);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 200;
  text-align: center;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">🌾 Ferme Familiale</div>
  <div class="indicators" id="indicators"></div>
  <button class="icon-btn" id="options-btn" type="button" aria-label="Options" data-action="open-options">⚙️</button>
</header>

<main>
  <nav class="tabbar" id="tabbar"></nav>
  <section id="tab-content" class="panel"></section>

  <details class="test-panel" id="test-panel" hidden>
    <summary>🧪 Mode test</summary>
    <div class="stack">
      <div class="row">
        <button class="btn" type="button" data-action="test-add-100">+100 💰</button>
        <button class="btn" type="button" data-action="test-add-1000">+1 000 💰</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-add-panel">+1 panneau</button>
        <button class="btn" type="button" data-action="test-add-battery">+1 batterie</button>
        <button class="btn" type="button" data-action="test-fill-batteries">Remplir les batteries</button>
        <button class="btn" type="button" data-action="test-fill-tank">Remplir le réservoir</button>
      </div>
      <div class="row">
        <label for="test-device">Appareil</label>
        <select id="test-device"></select>
        <button class="btn" type="button" data-action="test-wear">Usure à 100 %</button>
      </div>
      <div class="row">
        <button class="btn" type="button" data-action="test-skip-awake">Ignorer l'éveil minimal</button>
        <button class="btn" type="button" data-action="test-nights-1">Passer 1 nuit</button>
        <button class="btn" type="button" data-action="test-nights-5">Passer 5 nuits</button>
      </div>
      <div class="state-dump" id="state-dump"></div>
    </div>
  </details>
</main>

<div class="sleep-bar" id="sleep-bar"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script id="core">
'use strict';

/* ==========================================================================
   DATA — toutes les valeurs d'équilibrage du jeu.
   Les lots suivants viendront peupler cet objet. Aucune valeur d'équilibrage
   ne doit exister ailleurs que dans DATA.
   Références : conception v15, sections 1.2, 1.4 et 8.2.
   ========================================================================== */
const DATA = {
  // Départ de partie.
  START: {
    PIECES: 50,
    // Les appareils de départ sont offerts : prix d'achat 0, donc entretien
    // et réparation gratuits pour eux (l'entretien vaut 20 % du prix d'achat).
    DEVICE_PRICE: 0,
  },

  // Temps : la journée commence à 6 h, 1 heure de jeu = 30 s d'éveil.
  TIME: {
    DAY_START_HOUR: 6,
    SECONDS_PER_HOUR: 30,
    MIN_AWAKE_S: 30,
  },

  LEVEL_MAX: 5,

  // Grilles par niveau (index 0 = niveau 1), identiques pour chaque appareil
  // d'un même type.
  GRID: {
    panneau: { kwhPerS: [0.03, 0.05, 0.08, 0.12, 0.18] },
    batterie: { kwh: [5, 10, 20, 40, 80] },
    pompe: {
      litresPerS: [1, 2, 4, 6, 10],
      reservoirL: [40, 80, 160, 300, 500], // le réservoir suit le niveau de la pompe
    },
  },

  // Coût pour atteindre un niveau (index 0 = niveau 1, non utilisé).
  UPGRADE_COST: [0, 40, 100, 250, 600],

  PUMP: { KWH_PER_L: 0.01 },

  // Achat d'un appareil supplémentaire : base × growth^n, n = nombre déjà possédé.
  PURCHASE: {
    panneau: { base: 60, growth: 1.2 },
    batterie: { base: 80, growth: 1.2 },
  },

  // Usure : en points (0 à 100). Rendement = 1 − usure ÷ EFFICIENCY_DIVISOR.
  WEAR: {
    PER_HOUR: 0.5,
    EFFICIENCY_DIVISOR: 200,
    SERVICE_THRESHOLD: 70,
    BREAKDOWN: 100,
    MAINTAIN_RATE: 0.2, // part du prix d'achat
    REPAIR_RATE: 0.5,
  },
};

/* ==========================================================================
   ENGINE — simulation pure. Aucun accès au DOM, à window, au stockage ou à
   l'horloge : le temps arrive en paramètre (dt, en secondes) et l'aléatoire
   vient exclusivement du générateur à graine stocké dans l'état.
   ========================================================================== */

// Générateur pseudo-aléatoire à graine (mulberry32).
// Renvoie une fonction () => nombre dans [0, 1).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const STATE_VERSION = 2;
const EPS = 1e-9; // tolérance de calcul flottant (pas une valeur d'équilibrage)

// Liste des étapes exécutées au clic sur "Dormir", dans l'ordre. Vide au
// Lot 1 (aucun système « par jour » n'existe encore) ; les lots suivants y
// ajouteront leurs fonctions (repas, pousse, ponte, péremption...).
// Chaque étape reçoit l'état et le modifie.
const NIGHT_STEPS = [];

/* ---------- appareils : fabrication et sélecteurs ---------- */

function newDayStats() {
  return { produite: 0, perdue: 0, eau: 0 };
}

function makeDevice(type, id, prix) {
  const d = { id, type, niveau: 1, allume: true, usure: 0, prix };
  if (type === 'batterie') {
    d.charge = 0;
    d.entree = 0; // kWh/s reçus au dernier tick
    d.sortie = 0; // kWh/s soutirés au dernier tick
  } else if (type === 'panneau') {
    d.prod = 0; // kWh/s produits au dernier tick
  } else if (type === 'pompe') {
    d.debit = 0; // L/s réellement pompés au dernier tick
    d.conso = 0; // kWh/s consommés au dernier tick
  }
  return d;
}

// Parc et réserves de départ : 1 panneau, 1 batterie, la pompe et le réservoir.
// Les appareils sont des listes d'objets ; la pompe est un appareil unique ;
// le réservoir n'est pas un appareil (`eau` = son contenu en litres).
function startFarm() {
  const prix = DATA.START.DEVICE_PRICE;
  return {
    compteurs: { panneau: 1, batterie: 1 },
    panneaux: [makeDevice('panneau', 'panneau-1', prix)],
    batteries: [makeDevice('batterie', 'batterie-1', prix)],
    pompe: makeDevice('pompe', 'pompe', prix),
    eau: 0,
    flux: { perdue: 0, eau: 0 }, // kWh/s perdus, L/s reçus par le réservoir au dernier tick
    jour: newDayStats(),
    report: null,
  };
}

function allDevices(state) {
  return [...state.panneaux, ...state.batteries, state.pompe];
}

function findDevice(state, id) {
  return allDevices(state).find((d) => d.id === id) || null;
}

function efficiency(d) {
  return 1 - d.usure / DATA.WEAR.EFFICIENCY_DIVISOR;
}

function isBroken(d) {
  return d.usure >= DATA.WEAR.BREAKDOWN - EPS;
}

function needsService(d) {
  return !isBroken(d) && d.usure >= DATA.WEAR.SERVICE_THRESHOLD - EPS;
}

// Production nominale d'un panneau à son niveau et son usure actuels (kWh/s).
function panelOutput(d) {
  return DATA.GRID.panneau.kwhPerS[d.niveau - 1] * efficiency(d);
}

// Capacité utile d'une batterie (kWh) : capacité(niveau) × rendement.
function batteryCapacity(d) {
  return DATA.GRID.batterie.kwh[d.niveau - 1] * efficiency(d);
}

function pumpFlow(d) {
  return DATA.GRID.pompe.litresPerS[d.niveau - 1] * efficiency(d);
}

function tankCapacity(state) {
  return DATA.GRID.pompe.reservoirL[state.pompe.niveau - 1];
}

// Prix du n-ième appareil d'un type, n étant le nombre déjà possédé.
function purchasePrice(type, owned) {
  const p = DATA.PURCHASE[type];
  return roundCoins(p.base * Math.pow(p.growth, owned));
}

function nextPurchasePrice(state, type) {
  const owned = type === 'panneau' ? state.panneaux.length : state.batteries.length;
  return purchasePrice(type, owned);
}

function maintainCost(d) {
  return roundCoins(d.prix * DATA.WEAR.MAINTAIN_RATE);
}

function repairCost(d) {
  return roundCoins(d.prix * DATA.WEAR.REPAIR_RATE);
}

function upgradeCost(d) {
  return d.niveau >= DATA.LEVEL_MAX ? null : DATA.UPGRADE_COST[d.niveau];
}

// Les pièces restent à deux décimales (les prix ×1,2ⁿ ne sont pas entiers).
function roundCoins(x) {
  return Math.round(x * 100) / 100;
}

/* ---------- l'heure ---------- */

function awakeRequired(state) {
  return DATA.TIME.MIN_AWAKE_S;
}

// Heure d'ambiance (0 à 23) : 6 h au réveil, +1 par SECONDS_PER_HOUR d'éveil.
function hourOfDay(state) {
  const hours = Math.floor(state.awakeSeconds / DATA.TIME.SECONDS_PER_HOUR + EPS);
  return (DATA.TIME.DAY_START_HOUR + hours) % 24;
}

/* ---------- énergie : stockage et prélèvement ---------- */

// Range `energy` kWh dans les batteries allumées et non en panne, l'une après
// l'autre dans l'ordre de la liste. Renvoie ce qui n'a rentré nulle part.
function storeEnergy(state, energy) {
  let rest = energy;
  for (const b of state.batteries) {
    if (rest <= EPS) break;
    if (!b.allume || isBroken(b)) continue;
    const room = Math.max(0, batteryCapacity(b) - b.charge);
    const added = Math.min(room, rest);
    if (added > 0) {
      b.charge += added;
      b.entree += added;
      rest -= added;
    }
  }
  return rest > EPS ? rest : 0;
}

// Prélève jusqu'à `energy` kWh dans les batteries, en sens inverse de la liste :
// la dernière remplie se vide la première. Renvoie l'énergie réellement fournie.
// Tous les consommateurs (pompe, puis moulin, presse, réfrigérateur) passent ici.
function drawEnergy(state, energy) {
  let rest = energy;
  for (let i = state.batteries.length - 1; i >= 0; i--) {
    if (rest <= EPS) break;
    const b = state.batteries[i];
    if (!b.allume || isBroken(b)) continue;
    const taken = Math.min(b.charge, rest);
    if (taken > 0) {
      b.charge -= taken;
      b.sortie += taken;
      rest -= taken;
    }
  }
  return energy - (rest > EPS ? rest : 0);
}

// Consommateurs d'énergie, exécutés dans l'ordre à chaque tick. Les lots
// suivants y ajouteront le moulin, la presse et le réfrigérateur.
// `run(state, dt)` prélève son énergie avec drawEnergy().
const CONSUMERS = [
  { id: 'pompe', run: runPump },
];

// La pompe remplit le réservoir si elle est allumée, en état, et que le
// réservoir n'est pas plein. Si l'énergie manque, elle tourne au prorata.
function runPump(state, dt) {
  const p = state.pompe;
  p.debit = 0;
  p.conso = 0;
  if (!p.allume || isBroken(p)) return;
  const room = tankCapacity(state) - state.eau;
  if (room <= EPS) return;
  const kwhPerL = DATA.PUMP.KWH_PER_L;
  const wanted = Math.min(pumpFlow(p) * dt, room);
  const got = drawEnergy(state, wanted * kwhPerL);
  const litres = Math.min(wanted, got / kwhPerL);
  state.eau += litres;
  state.jour.eau += litres;
  p.debit = litres / dt;
  p.conso = got / dt;
  state.flux.eau = litres / dt;
}

/* ---------- la boucle de simulation ---------- */

// Avance la simulation de dt secondes : production, stockage, consommation,
// usure, puis le temps d'éveil.
function tick(state, dt) {
  if (!(dt > 0)) return state;
  for (const b of state.batteries) {
    b.entree = 0;
    b.sortie = 0;
  }
  state.flux.eau = 0;

  // a. production : chaque panneau allumé et non en panne
  let produced = 0;
  for (const p of state.panneaux) {
    p.prod = 0;
    if (p.allume && !isBroken(p)) {
      const e = panelOutput(p) * dt;
      produced += e;
      p.prod = e / dt;
    }
  }

  // b. stockage : batteries remplies l'une après l'autre ; le reste est perdu
  const lost = storeEnergy(state, produced);
  state.jour.produite += produced;
  state.jour.perdue += lost;
  state.flux.perdue = lost / dt;

  // c. consommation : chaque consommateur tire sur les batteries (sens inverse)
  for (const c of CONSUMERS) c.run(state, dt);

  // les quantités du tick deviennent des puissances (kWh/s)
  for (const b of state.batteries) {
    b.entree /= dt;
    b.sortie /= dt;
  }

  // d. usure : seulement pour un appareil qui a réellement fonctionné
  const wear = DATA.WEAR.PER_HOUR * (dt / DATA.TIME.SECONDS_PER_HOUR);
  for (const d of allDevices(state)) {
    let worked = false;
    if (d.type === 'panneau') worked = d.prod > EPS;
    else if (d.type === 'batterie') worked = d.entree > EPS || d.sortie > EPS;
    else if (d.type === 'pompe') worked = d.debit > EPS;
    if (!worked) continue;
    d.usure = Math.min(DATA.WEAR.BREAKDOWN, d.usure + wear);
    if (isBroken(d)) {
      d.usure = DATA.WEAR.BREAKDOWN;
      d.allume = false;
    }
  }

  // e. temps d'éveil (l'heure s'en déduit)
  state.awakeSeconds += dt;
  return state;
}

/* ---------- synthèses pour l'interface (fonctions pures) ---------- */

function energyStats(state) {
  const producing = state.panneaux.filter((p) => p.allume && !isBroken(p));
  const s = {
    production: state.panneaux.reduce((t, p) => t + p.prod, 0),
    panneauxEnMarche: producing.length,
    panneauxTotal: state.panneaux.length,
    panneauxAEntretenir: state.panneaux.filter(needsService).length,
    panneauxEnPanne: state.panneaux.filter(isBroken).length,
    charge: state.batteries.reduce((t, b) => t + b.charge, 0),
    capacite: state.batteries.reduce((t, b) => t + batteryCapacity(b), 0),
    entree: state.batteries.reduce((t, b) => t + b.entree, 0),
    sortie: state.batteries.reduce((t, b) => t + b.sortie, 0),
    batteriesAEntretenir: state.batteries.filter(needsService).length,
    batteriesEnPanne: state.batteries.filter(isBroken).length,
  };
  s.net = s.entree - s.sortie;
  return s;
}

// État affichable d'un appareil : { code, label, badge }.
function deviceStatus(state, d) {
  let code;
  let label;
  if (isBroken(d)) {
    code = 'panne';
    label = 'En panne';
  } else if (!d.allume) {
    code = 'arret';
    label = 'À l\'arrêt';
  } else if (d.type === 'panneau') {
    code = 'marche';
    label = 'En marche';
  } else if (d.type === 'batterie') {
    const net = d.entree - d.sortie;
    if (net < -1e-6) { code = 'decharge'; label = 'En décharge'; }
    else if (net > 1e-6) { code = 'charge'; label = 'En charge'; }
    else if (d.charge >= batteryCapacity(d) * 0.98) { code = 'pleine'; label = 'Pleine'; }
    else if (d.charge <= EPS) { code = 'vide'; label = 'Vide'; }
    else { code = 'attente'; label = 'En attente'; }
  } else {
    if (state.eau >= tankCapacity(state) - EPS) { code = 'plein'; label = 'Réservoir plein'; }
    else if (d.debit > EPS) { code = 'marche'; label = 'En marche'; }
    else { code = 'attente'; label = 'En attente d\'énergie'; }
  }
  return { code, label, badge: needsService(d) ? 'À entretenir' : '' };
}

/* ---------- actions du moteur ---------- */

function fail(error) {
  return { ok: false, error };
}

function spend(state, cost) {
  state.pieces = roundCoins(state.pieces - cost);
}

function toggleDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  if (isBroken(d)) return fail('Appareil en panne : il faut le réparer.');
  d.allume = !d.allume;
  return { ok: true };
}

function buyDevice(state, type) {
  if (type !== 'panneau' && type !== 'batterie') return fail('Type d\'appareil inconnu.');
  const price = nextPurchasePrice(state, type);
  if (state.pieces + EPS < price) return fail('Pas assez de pièces.');
  spend(state, price);
  state.compteurs[type] += 1;
  const d = makeDevice(type, `${type}-${state.compteurs[type]}`, price);
  (type === 'panneau' ? state.panneaux : state.batteries).push(d);
  return { ok: true, device: d, price };
}

function upgradeDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  const cost = upgradeCost(d);
  if (cost === null) return fail('Niveau maximum atteint.');
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  d.niveau += 1;
  return { ok: true, cost };
}

function maintainDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  if (isBroken(d)) return fail('Appareil en panne : il faut le réparer.');
  if (d.usure <= EPS) return fail('Cet appareil n\'est pas usé.');
  const cost = maintainCost(d);
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  d.usure = 0;
  return { ok: true, cost };
}

// Une réparation remet l'usure à 0 ; l'appareil reste éteint : c'est au
// joueur de le rallumer.
function repairDevice(state, id) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  if (!isBroken(d)) return fail('Cet appareil n\'est pas en panne.');
  const cost = repairCost(d);
  if (state.pieces + EPS < cost) return fail('Pas assez de pièces.');
  spend(state, cost);
  d.usure = 0;
  d.allume = false;
  return { ok: true, cost };
}

/* ---------- la nuit ---------- */

function canSleep(state) {
  return state.awakeSeconds >= awakeRequired(state) - EPS;
}

function buildMorningReport(state) {
  const aSurveiller = (d) => ({ id: d.id, type: d.type, usure: d.usure });
  return {
    nuit: state.day,
    energie: state.batteries.reduce((t, b) => t + b.charge, 0),
    capacite: state.batteries.reduce((t, b) => t + batteryCapacity(b), 0),
    energiePerdue: state.jour.perdue,
    eau: state.eau,
    capaciteEau: tankCapacity(state),
    aEntretenir: allDevices(state).filter(needsService).map(aSurveiller),
    enPanne: allDevices(state).filter(isBroken).map(aSurveiller),
  };
}

// Ne fait rien tant que l'éveil minimal n'est pas atteint (renvoie null).
// Sinon : étapes nocturnes dans l'ordre, jour suivant, éveil remis à 0
// (l'heure repart à 6 h), rapport de réveil.
function sleep(state) {
  if (!canSleep(state)) return null;
  for (const step of NIGHT_STEPS) step(state);
  state.day += 1;
  state.awakeSeconds = 0;
  state.report = buildMorningReport(state);
  state.jour = newDayStats();
  return state.report;
}

/* ---------- actions du mode test ---------- */

function testAddPieces(state, amount) {
  state.pieces = roundCoins(state.pieces + amount);
  return { ok: true };
}

function testAddDevice(state, type) {
  const n = ++state.compteurs[type];
  const d = makeDevice(type, `${type}-${n}`, 0);
  (type === 'panneau' ? state.panneaux : state.batteries).push(d);
  return { ok: true, device: d };
}

function testFillBatteries(state) {
  for (const b of state.batteries) b.charge = batteryCapacity(b);
  return { ok: true };
}

function testFillTank(state) {
  state.eau = tankCapacity(state);
  return { ok: true };
}

function testSetWear(state, id, usure) {
  const d = findDevice(state, id);
  if (!d) return fail('Appareil introuvable.');
  d.usure = Math.max(0, Math.min(DATA.WEAR.BREAKDOWN, usure));
  if (isBroken(d)) d.allume = false;
  return { ok: true };
}

function testSkipAwake(state) {
  state.awakeSeconds = Math.max(state.awakeSeconds, awakeRequired(state));
  return { ok: true };
}

function testSleepNights(state, count) {
  let report = null;
  for (let i = 0; i < count; i++) {
    testSkipAwake(state);
    report = sleep(state);
  }
  return { ok: true, report };
}

// État initial du jeu. `seed` doit être fourni par l'appelant (l'app),
// jamais lu depuis l'horloge ici : l'ENGINE reste pur et testable.
function createInitialState(seed = 1) {
  return {
    version: STATE_VERSION,
    day: 1,
    awakeSeconds: 0,
    pieces: DATA.START.PIECES,
    rngSeed: seed >>> 0,
    unlockedTabs: ['ferme', 'inventaire', 'comptoir'],
    stats: {},
    ...startFarm(),
  };
}

// Table de migrations successives : MIGRATIONS[n] transforme un état de
// version n vers n+1. L'entrée 0 sert de filet pour toute sauvegarde
// antérieure au champ `version` (et de cas de test).
const MIGRATIONS = {
  0: (state) => ({ ...state, version: 1 }),
  // v1 (Lot 0) → v2 (Lot 1) : ajout du parc d'appareils, de l'eau et du rapport.
  1: (state) => ({ ...startFarm(), ...state, version: 2 }),
};

// Applique les migrations successives à une sauvegarde { v, t, s } (ou à un
// état brut) jusqu'à atteindre la version courante. Ne lance jamais
// d'exception : une entrée invalide retombe sur un état migré au mieux.
function migrate(save) {
  let state = save && typeof save === 'object' && save.s && typeof save.s === 'object'
    ? { ...save.s }
    : (save && typeof save === 'object' ? { ...save } : {});
  let version = typeof state.version === 'number' ? state.version : 0;
  let guard = 0;
  while (MIGRATIONS[version] && guard < 1000) {
    state = MIGRATIONS[version](state);
    version = typeof state.version === 'number' ? state.version : version + 1;
    guard++;
  }
  if (typeof state.version !== 'number') state.version = version;
  return state;
}

// Formatage des nombres à la française : entiers avec espace tous les
// 3 chiffres en dessous de 10 000, milliers en "k" et millions en "M"
// au-delà, avec une décimale séparée par une virgule.
// Fonction pure : elle vit dans ENGINE pour rester testable par Node, même
// si c'est l'app qui l'utilise pour l'affichage.
function formatNumber(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '0';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) {
    return sign + formatFixed(abs / 1_000_000, 1) + ' M';
  }
  if (abs >= 10_000) {
    return sign + formatFixed(abs / 1_000, 1) + ' k';
  }
  return sign + groupThousands(Math.round(abs));
}

// Groupe un entier positif par milliers avec des espaces : 1234 -> "1 234".
function groupThousands(intValue) {
  const s = String(Math.trunc(intValue));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const posFromEnd = s.length - i;
    out += s[i];
    if (posFromEnd > 1 && posFromEnd % 3 === 1) out += ' ';
  }
  return out;
}

// Formate un nombre décimal avec `digits` décimales et une virgule française.
function formatFixed(value, digits) {
  return value.toFixed(digits).replace('.', ',');
}

// Pièces : entier si possible, sinon 1 ou 2 décimales (les prix ×1,2ⁿ ne sont
// pas entiers : 86,4 ; 103,68).
function formatCoins(n) {
  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r) || Math.abs(r) >= 10000) return formatNumber(r);
  const sign = r < 0 ? '-' : '';
  const abs = Math.abs(r);
  const digits = Math.abs(abs * 10 - Math.round(abs * 10)) < 1e-9 ? 1 : 2;
  const [i, dec] = abs.toFixed(digits).split('.');
  return sign + groupThousands(Number(i)) + ',' + dec;
}

// Puissance signée en kWh/s avec le vrai signe moins : « +0,02 » ou « −0,01 ».
function formatRate(value, digits = 2) {
  const text = formatFixed(Math.abs(value), digits);
  if (Number(text.replace(',', '.')) === 0) return text; // zéro : sans signe
  return (value < 0 ? '−' : '+') + text;
}

function formatHour(h) {
  return `${h} h`;
}
</script>

<script id="tests" type="text/plain">
'use strict';

/* ==========================================================================
   Tests du moteur (bloc "core" uniquement). Petite fonction test/assert
   maison : pas de dépendance externe. Ce bloc est en type="text/plain" pour
   ne jamais s'exécuter dans le navigateur ; run-tests.mjs l'extrait et
   l'exécute avec Node, à la suite du bloc core.
   ========================================================================== */

const __tests = [];

function test(name, fn) {
  __tests.push({ name, fn });
}

function assert(condition, message) {
  if (!condition) throw new Error(message || 'assertion échouée');
}

function assertEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) {
    throw new Error(message || `attendu ${b}, obtenu ${a}`);
  }
}

function runTests() {
  const results = { total: __tests.length, passed: 0, failed: [] };
  for (const t of __tests) {
    try {
      t.fn();
      results.passed++;
    } catch (e) {
      results.failed.push({ name: t.name, error: e && e.message ? e.message : String(e) });
    }
  }
  // Assignation explicite sur globalThis : une déclaration `let`/`const` de
  // premier niveau ne devient pas une propriété de l'objet global (ni dans
  // un navigateur, ni dans un contexte vm Node), donc run-tests.mjs ne
  // pourrait pas la relire depuis l'extérieur du script sans ceci.
  if (typeof globalThis !== 'undefined') {
    globalThis.__testResults = results;
  }
  return results;
}

test('état initial : forme et valeurs attendues', () => {

  assertEqual(s.awakeSeconds, 0);

  assertEqual(s.stats, {});
});

test('tick() fait avancer awakeSeconds sans toucher au jour ni aux pièces', () => {
  const s = createInitialState(1);

  assertEqual(s.day, 1);
  assertEqual(s.pieces, 50);
});

test('sérialisation JSON aller-retour identique', () => {
  const s = createInitialState(7);
  s.pieces = 123;
  s.stats.test = 1;
  const roundTripped = JSON.parse(JSON.stringify(s));

});

test('migration factice v0 → version courante', () => {
  const legacy = { day: 3, awakeSeconds: 10, pieces: 80, rngSeed: 9, unlockedTabs: ['ferme'], stats: {} };
  // pas de champ `version` : doit être traité comme version 0 et migré jusqu'au bout
  const migrated = migrate({ v: 0, t: Date.now(), s: legacy });

test('migration v1 (Lot 0) → v2 : garde la partie et ajoute le parc', () => {
  const v1 = { version: 1, day: 4, awakeSeconds: 12, pieces: 200, rngSeed: 3, unlockedTabs: ['ferme'], stats: { a: 1 } };
  const m = migrate({ v: 1, t: 0, s: v1 });

  assertEqual(m.day, 4);
  assertEqual(m.pieces, 200);
  assertEqual(m.stats, { a: 1 });
  assertEqual(m.panneaux.length, 1);
  assertEqual(m.batteries.length, 1);

});

test('migrate() ne plante pas sur une entrée déjà à jour', () => {

test('import d\'un texte invalide sans plantage', () => {
  const badInputs = [null, undefined, {}, { s: null }, 'texte quelconque', 42];

    } catch (e) {

test('formatage des nombres à la française', () => {
  assertEqual(formatNumber(0), '0');
  assertEqual(formatNumber(50), '50');
  assertEqual(formatNumber(1234), '1 234');
  assertEqual(formatNumber(12345), '12,3 k');
  assertEqual(formatNumber(1200), '1 200');

test('générateur aléatoire reproductible à graine égale', () => {
  const rngA = mulberry32(1234);
  const rngB = mulberry32(1234);
  const seqA = [rngA(), rngA(), rngA()];

/* ---------- Lot 1 : heure, parc électrique, eau, Dormir ---------- */

function near(a, b, tol = 1e-6) {
  return Math.abs(a - b) <= tol;
}

// État de test : seul le panneau produit, la pompe est coupée (sauf demande).
function farm({ pump = false } = {}) {
  const s = createInitialState(1);
  s.pompe.allume = pump;
  return s;
}

test('DATA : grilles par niveau, coûts et départ', () => {

  assertEqual(DATA.GRID.batterie.kwh, [5, 10, 20, 40, 80]);
  assertEqual(DATA.GRID.pompe.litresPerS, [1, 2, 4, 6, 10]);
  assertEqual(DATA.GRID.pompe.reservoirL, [40, 80, 160, 300, 500]);

  const s = createInitialState(1);
  assertEqual(s.panneaux.length, 1);
  assertEqual(s.batteries.length, 1);
  assertEqual(s.panneaux[0].niveau, 1);
  assertEqual(s.batteries[0].niveau, 1);
  assertEqual(s.pompe.niveau, 1);
  assertEqual(tankCapacity(s), 40);

});

test('production : un panneau de niveau 1 produit 0,03 kWh/s', () => {

test('production réduite par l\'usure (rendement = 1 − usure ÷ 200)', () => {
  const s = farm();
  s.panneaux[0].usure = 50; // rendement 0,75

  const t = farm();

<script id="app">
'use strict';

/* ==========================================================================
   APP — sauvegarde, interface et boucle. Seul bloc à toucher au DOM, à
   window, au stockage ou à l'horloge.
   ========================================================================== */

const SAVE_KEY = 'ferme-save';
const TICK_MS = 200;
const MAX_FRAME_MS = 1000;
const AUTOSAVE_MS = 10000;
const RENDER_THROTTLE_MS = 200; // ~5 fois par seconde

const TABS = [
  { id: 'ferme', label: 'Ferme', icon: '🌾' },
  { id: 'inventaire', label: 'Inventaire', icon: '📦' },
  { id: 'recettes', label: 'Livre de recette', icon: '📖' },
  { id: 'techno', label: 'Arbre des technologies', icon: '🌳' },
  { id: 'comptoir', label: 'Comptoir', icon: '💰' },
];

let state = null;
let activeTab = 'ferme';
let screen = null; // écran de détail ouvert dans la Ferme : null, 'panneaux' ou 'batteries'
let testMode = false;
let renderScheduled = false;
let lastRenderAt = 0;

/* ---------- stockage : localStorage, toujours entouré de try/catch ---------- */

function safeStorageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}

function safeStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    return false;
  }
}

function loadOrCreateState() {
  const raw = safeStorageGet(SAVE_KEY);
  if (!raw) return createInitialState(makeSeed());
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return createInitialState(makeSeed());
    return migrate(parsed);
  } catch (e) {
    return createInitialState(makeSeed());
  }
}

function makeSeed() {
  // Seule l'app a le droit de lire l'horloge ; l'ENGINE reste pur.
  return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

function persistState() {
  try {
    const payload = JSON.stringify({ v: state.version, t: Date.now(), s: state });
    safeStorageSet(SAVE_KEY, payload);
  } catch (e) {
    // La sauvegarde ne doit jamais faire planter la page.
  }
}

/* ---------- export / import ---------- */

function encodeBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function decodeBase64(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

function exportSaveText() {
  const payload = JSON.stringify({ v: state.version, t: Date.now(), s: state });
  return encodeBase64(payload);
}

function importSaveText(text) {
  try {
    const json = decodeBase64(String(text).trim());
    const parsed = JSON.parse(json);
    if (!parsed || typeof parsed !== 'object' || !parsed.s) {
      throw new Error('format de sauvegarde invalide');
    }
    state = migrate(parsed);
    persistState();
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------- copie dans le presse-papiers ---------- */

// Copie le contenu d'un textarea et n'annonce « Copié » que si la copie a
// vraiment réussi. On essaie d'abord la commande synchrone (elle marche en
// file://), puis l'API asynchrone dont l'échec est capté par la promesse.
function copyFromTextarea(area) {
  area.focus();
  area.select();
  area.setSelectionRange(0, area.value.length);
  let ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  if (ok) {
    showToast('Copié !');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(area.value).then(
      () => showToast('Copié !'),
      () => showToast('Copie impossible : le texte est sélectionné, copie-le à la main.')
    );
    return;
  }
  showToast('Copie impossible : le texte est sélectionné, copie-le à la main.');
}

/* ---------- actions du moteur (jamais d'accès direct à state depuis l'UI) ---------- */

function actionNewGame() {
  state = createInitialState(makeSeed());
  screen = null;
  activeTab = 'ferme';
  persistState();
  refresh();
}

// Applique le résultat d'une action du moteur : message si elle est refusée,
// puis rafraîchissement immédiat (sans attendre la cadence de 5 par seconde).
function applyResult(result) {
  if (result && result.ok === false) showToast(result.error);
  refresh();
  return result;
}

function actionSleep() {
  const report = sleep(state);
  if (!report) {
    showToast('Encore un peu d\'éveil avant de dormir.');
    refresh();
    return;
  }
  persistState(); // sauvegarde après chaque nuit
  refresh();
  openWakeModal(report);
}

function actionTestNights(count) {
  const { report } = testSleepNights(state, count);
  persistState();
  refresh();
  if (report) openWakeModal(report);
}

/* ---------- boucle à pas fixe ---------- */

let accumulatorMs = 0;
let lastFrameTime = null;

function frame(now) {
  if (lastFrameTime === null) lastFrameTime = now;
  let elapsed = now - lastFrameTime;
  lastFrameTime = now;
  if (elapsed > MAX_FRAME_MS) elapsed = MAX_FRAME_MS;
  accumulatorMs += elapsed;
  while (accumulatorMs >= TICK_MS) {
    tick(state, TICK_MS / 1000);
    accumulatorMs -= TICK_MS;
    scheduleRender();
  }
  requestAnimationFrame(frame);
}

function scheduleRender() {
  renderScheduled = true;
}

function renderLoop(now) {
  if (renderScheduled && now - lastRenderAt >= RENDER_THROTTLE_MS) {
    renderScheduled = false;
    lastRenderAt = now;
    render();
  }
  requestAnimationFrame(renderLoop);
}

/* ---------- rendu ---------- */

function render() {
  renderIndicators();
  renderTabbar();
  renderTabContent();
  renderSleepBar();
  renderTestPanel();
}

// Rafraîchit tout de suite (après une action du joueur).
function refresh() {
  renderScheduled = false;
  lastRenderAt = performance.now();
  render();
}

/* Mise à jour du DOM « sur place » : on compare le nouveau gabarit à ce qui
   est affiché et on ne modifie que les textes et attributs qui changent. Les
   boutons et interrupteurs gardent donc le même élément d'un rafraîchissement
   à l'autre : un appui en cours n'est jamais interrompu et le focus clavier
   reste en place. */
function morph(target, html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  patchChildren(target, tpl.content);
}

function patchChildren(from, to) {
  const oldNodes = Array.from(from.childNodes);
  const newNodes = Array.from(to.childNodes);
  const n = Math.max(oldNodes.length, newNodes.length);
  for (let i = 0; i < n; i++) {
    const o = oldNodes[i];
    const w = newNodes[i];
    if (!w) {
      from.removeChild(o);
    } else if (!o) {
      from.appendChild(w);
    } else if (o.nodeType !== w.nodeType || o.nodeName !== w.nodeName) {
      from.replaceChild(w, o);
    } else if (o.nodeType === 1) {
      patchAttributes(o, w);
      patchChildren(o, w);
    } else if (o.nodeValue !== w.nodeValue) {
      o.nodeValue = w.nodeValue;
    }
  }
}

function patchAttributes(o, w) {
  for (const a of Array.from(o.attributes)) {
    if (!w.hasAttribute(a.name)) o.removeAttribute(a.name);
  }
  for (const a of Array.from(w.attributes)) {
    if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
  }
}

function renderIndicators() {
  morph(document.getElementById('indicators'), `
    <span class="indicator" title="Nuit"><span aria-hidden="true">🌙</span><span><span class="visually-hidden">Nuit </span>${state.day}</span></span>
    <span class="indicator" title="Heure"><span aria-hidden="true">🕐</span><span>${formatHour(hourOfDay(state))}</span></span>
    <span class="indicator" title="Eau du réservoir"><span aria-hidden="true">💧</span><span class="num">${formatFixed(state.eau, 1)} L</span></span>
    <span class="indicator" title="Pièces"><span aria-hidden="true">💰</span><span class="num">${formatCoins(state.pieces)}</span></span>
  `);
}

function renderTabbar() {
  const visible = TABS.filter((t) => state.unlockedTabs.includes(t.id));
  morph(
    document.getElementById('tabbar'),
    visible
      .map(
        (t) => `<button type="button" class="tab-btn${t.id === activeTab ? ' active' : ''}" data-action="switch-tab" data-tab="${t.id}">${t.icon} ${t.label}</button>`
      )
      .join('')
  );
}

function renderTabContent() {
  const el = document.getElementById('tab-content');
  if (activeTab === 'ferme') {
    morph(el, screen === 'panneaux' || screen === 'batteries' ? renderDeviceScreen(screen) : renderFerme());
    return;
  }
  const tab = TABS.find((t) => t.id === activeTab) || TABS[0];
  morph(el, `
    <h2>${tab.icon} ${tab.label}</h2>
    <p class="hint">Rien à voir pour l'instant : cet onglet arrivera dans un lot suivant.</p>
  `);
}

function renderSleepBar() {
  const remaining = Math.max(1, Math.ceil(awakeRequired(state) - state.awakeSeconds - EPS));
  morph(
    document.getElementById('sleep-bar'),
    canSleep(state)
      ? '<button type="button" class="btn primary" data-action="sleep">😴 Dormir</button>'
      : `<button type="button" class="btn" data-action="sleep" disabled>😴 Dormir (dans ${remaining} s)</button>`
  );
}

function renderTestPanel() {
  const panel = document.getElementById('test-panel');
  panel.hidden = !testMode;
  if (!testMode) return;
  syncTestDeviceSelect();
  const dump = document.getElementById('state-dump');
  const text = JSON.stringify(state, null, 2);
  if (dump.textContent !== text) dump.textContent = text;
}

// La liste des appareils du mode test n'est reconstruite que si le parc change.
function syncTestDeviceSelect() {
  const sel = document.getElementById('test-device');
  const devices = allDevices(state);
  const signature = devices.map((d) => d.id).join('|');
  if (sel.dataset.signature === signature) return;
  const previous = sel.value;
  sel.innerHTML = devices.map((d) => `<option value="${d.id}">${deviceName(d)}</option>`).join('');
  sel.dataset.signature = signature;
  if (devices.some((d) => d.id === previous)) sel.value = previous;
}

/* ---------- Ferme : cartes et écrans de détail ---------- */

const DEVICE_ICONS = { panneau: '☀️', batterie: '🔋', pompe: '⛲' };
const DEVICE_NAMES = { panneau: 'Panneau', batterie: 'Batterie', pompe: 'Pompe' };

function deviceName(d) {
  if (d.type === 'pompe') return 'Pompe';
  const list = d.type === 'panneau' ? state.panneaux : state.batteries;
  return `${DEVICE_NAMES[d.type]} n°${list.indexOf(d) + 1}`;
}

function costLabel(cost) {
  return cost === 0 ? 'gratuit' : `${formatCoins(cost)} 💰`;
}

function canPay(cost) {
  return state.pieces + EPS >= cost;
}

function alertLine(aEntretenir, enPanne) {
  const parts = [];
  if (enPanne) parts.push(`⛔ ${enPanne} en panne`);
  if (aEntretenir) parts.push(`⚠️ ${aEntretenir} à entretenir`);
  return parts.length ? `<span class="alert">${parts.join(' · ')}</span>` : '';
}

function renderFerme() {
  const e = energyStats(state);
  const p = state.pompe;
  const ps = deviceStatus(state, p);
  const cap = tankCapacity(state);
  const netText =
    e.net > 1e-6
      ? `En charge (${formatRate(e.net)} kWh/s)`
      : e.net < -1e-6
        ? `En décharge (${formatRate(e.net)} kWh/s)`
        : 'Stable (0,00 kWh/s)';
  const tankText =
    state.eau >= cap - EPS
      ? 'Réservoir plein'
      : `Vitesse de remplissage : ${formatRate(state.flux.eau)} L/s`;

  return `
    <h2>🌾 Ferme</h2>
    <div class="cards">
      <button type="button" class="card" data-action="open-screen" data-screen="panneaux">
        <span class="card-title"><span>☀️ Production d'énergie</span><span class="chevron" aria-hidden="true">›</span></span>
        <span class="big">${formatFixed(e.production, 2)} kWh/s</span>
        <span class="muted">${e.panneauxEnMarche} panneau${e.panneauxEnMarche > 1 ? 'x' : ''} en marche sur ${e.panneauxTotal}</span>
        ${alertLine(e.panneauxAEntretenir, e.panneauxEnPanne)}
      </button>
      <button type="button" class="card" data-action="open-screen" data-screen="batteries">
        <span class="card-title"><span>🔋 Stockage d'énergie</span><span class="chevron" aria-hidden="true">›</span></span>
        <span class="big">${formatFixed(e.charge, 2)} / ${formatFixed(e.capacite, 2)} kWh</span>
        <span class="muted">${netText}</span>
        ${alertLine(e.batteriesAEntretenir, e.batteriesEnPanne)}
      </button>
      <div class="card">
        <span class="card-title"><span>⛲ Pompe · niveau ${p.niveau}</span><span class="chip${ps.code === 'panne' ? ' panne' : ''}">${ps.label}</span></span>
        <span class="muted">Débit réel : <span class="num">${formatFixed(p.debit, 2)} L/s</span> (max ${formatFixed(pumpFlow(p), 2)})</span>
        <span class="muted">Consommation : <span class="num">${formatFixed(p.conso, 3)} kWh/s</span></span>
        ${wearHtml(p)}
        ${deviceControls(p)}
      </div>
      <div class="card">
        <span class="card-title"><span>💧 Réservoir</span></span>
        <span class="big">${formatFixed(state.eau, 1)} / ${formatNumber(cap)} L</span>
        <span class="muted">${tankText}</span>
      </div>
    </div>
  `;
}

function wearHtml(d) {
  const pct = Math.round(d.usure * 10) / 10;
  const cls = isBroken(d) ? ' bad' : needsService(d) ? ' warn' : '';
  return `
    <span class="muted">Usure : <span class="num">${formatFixed(pct, 1)} %</span></span>
    <span class="bar" role="progressbar" aria-label="Usure" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(d.usure)}"><span class="bar-fill${cls}" style="width:${pct}%"></span></span>
  `;
}

// Interrupteur à deux positions : rouge à l'arrêt, vert en marche, et l'état
// est aussi écrit (la couleur n'est jamais la seule indication).
function switchHtml(d) {
  const broken = isBroken(d);
  const on = d.allume && !broken;
  const text = broken ? 'En panne' : on ? 'Marche' : 'Arrêt';
  return `<button type="button" class="switch" role="switch" aria-checked="${on}" aria-label="${deviceName(d)}" data-action="toggle" data-id="${d.id}"${broken ? ' disabled' : ''}><span class="knob" aria-hidden="true"></span><span>${text}</span></button>`;
}

function deviceControls(d) {
  const up = upgradeCost(d);
  const maintain = maintainCost(d);
  const repair = repairCost(d);
  const broken = isBroken(d);
  const upgradeBtn =
    up === null
      ? '<button type="button" class="btn" disabled>Niveau max</button>'
      : `<button type="button" class="btn" data-action="upgrade" data-id="${d.id}"${canPay(up) ? '' : ' disabled'}>Améliorer (${costLabel(up)})</button>`;
  const maintainOk = !broken && d.usure > EPS && canPay(maintain);
  const repairOk = broken && canPay(repair);
  return `
    <span class="device-actions">
      ${switchHtml(d)}
      ${upgradeBtn}
      <button type="button" class="btn" data-action="maintain" data-id="${d.id}"${maintainOk ? '' : ' disabled'}>Entretenir (${costLabel(maintain)})</button>
      <button type="button" class="btn" data-action="repair" data-id="${d.id}"${repairOk ? '' : ' disabled'}>Réparer (${costLabel(repair)})</button>
    </span>
  `;
}

function deviceRow(d) {
  const st = deviceStatus(state, d);
  let detail;
  if (d.type === 'panneau') {
    detail = `<span class="muted">Production : <span class="num">${formatFixed(d.prod, 2)} kWh/s</span> (max ${formatFixed(panelOutput(d), 2)})</span>`;
  } else {
    const cap = batteryCapacity(d);
    let flow = 'Ni charge ni décharge';
    if (st.code === 'decharge') flow = `Puissance soutirée : ${formatRate(-d.sortie)} kWh/s`;
    else if (st.code === 'charge') flow = `Charge : ${formatRate(d.entree)} kWh/s`;
    detail = `
      <span class="muted">Charge : <span class="num">${formatFixed(d.charge, 2)} / ${formatFixed(cap, 2)} kWh</span></span>
      <span class="muted">${flow}</span>`;
  }
  const badge = st.badge ? `<span class="chip warn">⚠️ ${st.badge}</span>` : '';
  return `
    <article class="card">
      <span class="card-title"><span>${DEVICE_ICONS[d.type]} ${deviceName(d)} · niveau ${d.niveau}</span><span class="chip${st.code === 'panne' ? ' panne' : ''}">${st.label}</span></span>
      ${badge}
      ${detail}
      ${wearHtml(d)}
      ${deviceControls(d)}
    </article>
  `;
}

function renderDeviceScreen(kind) {
  const isPanels = kind === 'panneaux';
  const list = isPanels ? state.panneaux : state.batteries;
  const type = isPanels ? 'panneau' : 'batterie';
  const e = energyStats(state);
  const price = nextPurchasePrice(state, type);
  const summary = isPanels
    ? `<span class="big">${formatFixed(e.production, 2)} kWh/s</span>
       <span class="muted">${e.panneauxEnMarche} panneau${e.panneauxEnMarche > 1 ? 'x' : ''} en marche sur ${e.panneauxTotal}</span>`
    : `<span class="big">${formatFixed(e.charge, 2)} / ${formatFixed(e.capacite, 2)} kWh</span>
       <span class="muted">Total reçu : ${formatRate(e.entree)} kWh/s · Total soutiré : ${formatRate(-e.sortie)} kWh/s</span>`;
  return `
    <div class="screen-head">
      <button type="button" class="btn" data-action="close-screen">← Ferme</button>
      <h2>${isPanels ? '☀️ Production d\'énergie' : '🔋 Stockage d\'énergie'}</h2>
    </div>
    <div class="stack">${summary}</div>
    <div class="device-list">${list.map(deviceRow).join('')}</div>
    <button type="button" class="btn primary" data-action="buy" data-type="${type}"${canPay(price) ? '' : ' disabled'}>Acheter ${isPanels ? 'un panneau' : 'une batterie'} (${formatCoins(price)} 💰)</button>
  `;
}

/* ---------- écran de réveil ---------- */

function openWakeModal(report) {
  const root = document.getElementById('modal-root');
  const line = (d, text) => {
    const dev = findDevice(state, d.id);
    return `<li>${text.replace('{nom}', dev ? deviceName(dev) : d.id).replace('{usure}', formatFixed(d.usure, 1))}</li>`;
  };
  const problems = [
    ...report.enPanne.map((d) => line(d, '⛔ {nom} : en panne, à réparer.')),
    ...report.aEntretenir.map((d) => line(d, '⚠️ {nom} : à entretenir (usure {usure} %).')),
  ];
  root.innerHTML = `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wake-title" data-stop-propagation>
        <h2 id="wake-title">🌅 Réveil : nuit ${report.nuit}</h2>
        <ul class="report-list">
          <li>⚡ Énergie stockée : <strong class="num">${formatFixed(report.energie, 2)} / ${formatFixed(report.capacite, 2)} kWh</strong></li>
          <li>💧 Eau disponible : <strong class="num">${formatFixed(report.eau, 1)} / ${formatNumber(report.capaciteEau)} L</strong></li>
          ${report.energiePerdue > 0.005 ? `<li>☀️ Énergie perdue pendant la journée (batteries pleines) : <strong class="num">${formatFixed(report.energiePerdue, 2)} kWh</strong></li>` : ''}
          ${problems.length ? problems.join('') : '<li>✅ Tous les appareils sont en bon état.</li>'}
        </ul>
        <button type="button" class="btn primary" data-action="close-modal" id="wake-close">Bonne journée</button>
      </div>
    </div>
  `;
  document.getElementById('wake-close').focus();
}

/* ---------- options (modale) ---------- */

function openOptionsModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal" data-stop-propagation>
        <button class="btn modal-close" type="button" data-action="close-modal">Fermer</button>
        <h2>⚙️ Options</h2>
        <div class="stack">
          <div class="stack">
            <strong>Exporter la sauvegarde</strong>
            <textarea id="export-area" rows="4" readonly></textarea>
            <div class="row">
              <button class="btn" type="button" data-action="do-export">Générer</button>
              <button class="btn" type="button" data-action="copy-export">Copier</button>
            </div>
          </div>
          <div class="stack">
            <strong>Importer une sauvegarde</strong>
            <textarea id="import-area" rows="4" placeholder="Coller le texte exporté ici"></textarea>
            <div class="row">
              <button class="btn" type="button" data-action="do-import">Importer</button>
            </div>
          </div>
          <div class="stack">
            <strong>Nouvelle partie</strong>
            <div class="row" id="new-game-zone">
              <button class="btn danger" type="button" data-action="ask-new-game">Recommencer à zéro</button>
            </div>
          </div>
          <div class="stack">
            <strong>Mode test</strong>
            <label class="row">
              <input type="checkbox" id="test-mode-toggle" ${testMode ? 'checked' : ''}>
              Activer le panneau de mode test
            </label>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('export-area').addEventListener('click', (e) => e.target.select());
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

function showToast(message) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${message}</div>`;
  setTimeout(() => {
    root.innerHTML = '';
  }, 2200);
}

/* ---------- délégation d'événements ---------- */

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case 'open-options':
      openOptionsModal();
      break;
    case 'close-modal':
      if (e.target === target) closeModal();
      break;
    case 'switch-tab':
      activeTab = target.dataset.tab;
      screen = null;
      refresh();
      break;
    case 'open-screen':
      screen = target.dataset.screen;
      refresh();
      break;
    case 'close-screen':
      screen = null;
      refresh();
      break;
    case 'toggle':
      applyResult(toggleDevice(state, target.dataset.id));
      break;
    case 'upgrade':
      applyResult(upgradeDevice(state, target.dataset.id));
      break;
    case 'maintain':
      applyResult(maintainDevice(state, target.dataset.id));
      break;
    case 'repair':
      applyResult(repairDevice(state, target.dataset.id));
      break;
    case 'buy':
      applyResult(buyDevice(state, target.dataset.type));
      break;
    case 'sleep':
      actionSleep();
      break;
    case 'test-add-100':
      applyResult(testAddPieces(state, 100));
      break;
    case 'test-add-1000':
      applyResult(testAddPieces(state, 1000));
      break;
    case 'test-add-panel':
      applyResult(testAddDevice(state, 'panneau'));
      break;
    case 'test-add-battery':
      applyResult(testAddDevice(state, 'batterie'));
      break;
    case 'test-fill-batteries':
      applyResult(testFillBatteries(state));
      break;
    case 'test-fill-tank':
      applyResult(testFillTank(state));
      break;
    case 'test-wear':
      applyResult(testSetWear(state, document.getElementById('test-device').value, DATA.WEAR.BREAKDOWN));
      break;
    case 'test-skip-awake':
      applyResult(testSkipAwake(state));
      break;
    case 'test-nights-1':
      actionTestNights(1);
      break;
    case 'test-nights-5':
      actionTestNights(5);
      break;
    case 'do-export': {
      const area = document.getElementById('export-area');
      area.value = exportSaveText();
      break;
    }
    case 'copy-export': {
      const area = document.getElementById('export-area');
      if (!area.value) area.value = exportSaveText();
      copyFromTextarea(area);
      break;
    }
    case 'do-import': {
      const area = document.getElementById('import-area');
      const ok = importSaveText(area.value);
      showToast(ok ? 'Sauvegarde importée.' : 'Texte invalide, import annulé.');
      if (ok) {
        screen = null;
        closeModal();
        refresh();
      }
      break;
    }
    // Confirmation dans la page (et non confirm()) : certains navigateurs et
    // aperçus bloquent les boîtes de dialogue natives sans rien signaler.
    case 'ask-new-game':
      document.getElementById('new-game-zone').innerHTML = `
        <p class="alert">Toute la progression actuelle sera perdue.</p>
        <div class="row">
          <button class="btn danger" type="button" data-action="do-new-game">Oui, tout effacer</button>
          <button class="btn" type="button" data-action="cancel-new-game">Annuler</button>
        </div>`;
      break;
    case 'cancel-new-game':
      document.getElementById('new-game-zone').innerHTML =
        '<button class="btn danger" type="button" data-action="ask-new-game">Recommencer à zéro</button>';
      break;
    case 'do-new-game':
      actionNewGame();
      closeModal();
      showToast('Nouvelle partie lancée.');
      break;
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'test-mode-toggle') {
    testMode = e.target.checked;
    scheduleRender();
  }
});

document.getElementById('modal-root').addEventListener('click', (e) => {
  // ferme la modale si on clique sur le fond, pas sur son contenu
  if (e.target.dataset.action === 'close-modal' && e.target.classList.contains('modal-backdrop')) {
    closeModal();
  }
});

/* ---------- démarrage ---------- */

state = loadOrCreateState();

const autosaveTimer = setInterval(persistState, AUTOSAVE_MS);
window.addEventListener('beforeunload', persistState);

requestAnimationFrame(frame);
requestAnimationFrame(renderLoop);
render();
</script>
