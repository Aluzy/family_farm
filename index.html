<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ferme Familiale</title>
<style>
:root {
  --color-sun: #f2a71b;
  --color-sun-dark: #d68c0c;
  --color-leaf: #4f8a3d;
  --color-leaf-dark: #386b2a;
  --color-earth: #8a5a34;

  --bg: #faf6ee;
  --bg-elevated: #ffffff;
  --bg-header: #fef3dc;
  --bg-muted: #f1ebdc;
  --text: #2c2416;
  --text-muted: #6b5f4a;
  --border: #e3d9c2;
  --accent: var(--color-leaf);
  --accent-contrast: #ffffff;
  --accent-secondary: var(--color-sun);
  --danger: #c1442e;
  --danger-contrast: #ffffff;
  --shadow: 0 1px 3px rgba(44, 36, 22, 0.12);
  --radius: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1a14;
    --bg-elevated: #26231b;
    --bg-header: #2c2718;
    --bg-muted: #2a271e;
    --text: #f2ecdd;
    --text-muted: #b9ae95;
    --border: #3c3626;
    --accent: #6fae5a;
    --accent-contrast: #10230d;
    --accent-secondary: #f2a71b;
    --danger: #e0664c;
    --danger-contrast: #2a0d06;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

body {
  padding-bottom: 24px;
}

button {
  font-family: inherit;
  font-size: 1rem;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg-header);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.app-title {
  font-weight: 700;
  font-size: 1.05rem;
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.indicators {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-variant-numeric: tabular-nums;
}

.indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.icon-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon-btn:active { transform: translateY(1px); }

main {
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}

.tabbar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}

.tab-btn.active {
  background: var(--accent);
  color: var(--accent-contrast);
  border-color: var(--accent);
}

.panel {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 16px;
}

.panel h2 {
  margin: 0 0 8px;
  font-size: 1.2rem;
}

.panel p.hint {
  color: var(--text-muted);
  margin: 0;
}

.btn {
  min-height: 44px;
  padding: 0 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  cursor: pointer;
  font-weight: 600;
}

.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-contrast);
}

.btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: var(--danger-contrast);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stack { display: flex; flex-direction: column; gap: 12px; }

textarea, input[type="text"] {
  width: 100%;
  min-height: 44px;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-muted);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85rem;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  padding: 0;
}

@media (min-width: 640px) {
  .modal-backdrop { align-items: center; padding: 16px; }
}

.modal {
  background: var(--bg-elevated);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px 16px 28px;
  box-shadow: var(--shadow);
}

@media (min-width: 640px) {
  .modal { border-radius: var(--radius); }
}

.modal h2 {
  margin-top: 0;
}

.modal-close {
  float: right;
}

details.test-panel {
  margin-top: 16px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  background: var(--bg-muted);
}

details.test-panel summary {
  cursor: pointer;
  font-weight: 600;
  padding: 8px 0;
  min-height: 28px;
}

.state-dump {
  white-space: pre-wrap;
  word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
  max-height: 260px;
  overflow-y: auto;
}

.toast {
  position: fixed;
  bottom: 16px;
  left: 16px;
  right: 16px;
  max-width: 480px;
  margin: 0 auto;
  background: var(--text);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 200;
  text-align: center;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">🌾 Ferme Familiale</div>
  <div class="indicators" id="indicators"></div>
  <button class="icon-btn" id="options-btn" type="button" aria-label="Options" data-action="open-options">⚙️</button>
</header>

<main>
  <nav class="tabbar" id="tabbar"></nav>
  <section id="tab-content" class="panel"></section>

  <details class="test-panel" id="test-panel" hidden>
    <summary>🧪 Mode test</summary>
    <div class="stack">
      <div class="row">
        <button class="btn" type="button" data-action="test-add-100">+100 💰</button>
        <button class="btn" type="button" data-action="test-add-1000">+1 000 💰</button>
      </div>
      <div class="state-dump" id="state-dump"></div>
    </div>
  </details>
</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script id="core">
'use strict';

/* ==========================================================================
   DATA — toutes les valeurs d'équilibrage du jeu.
   Les lots suivants viendront peupler cet objet. Aucune valeur d'équilibrage
   ne doit exister ailleurs que dans DATA.
   ========================================================================== */
const DATA = {};

/* ==========================================================================
   ENGINE — simulation pure. Aucun accès au DOM, à window, au stockage ou à
   l'horloge : le temps arrive en paramètre (dt, en secondes) et l'aléatoire
   vient exclusivement du générateur à graine stocké dans l'état.
   ========================================================================== */

// Générateur pseudo-aléatoire à graine (mulberry32).
// Renvoie une fonction () => nombre dans [0, 1).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Liste des étapes exécutées au clic sur "Dormir". Vide au Lot 0 ;
// les lots suivants y ajouteront leurs fonctions (pousse, ponte, repas...).
const NIGHT_STEPS = [];

// État initial du jeu. `seed` doit être fourni par l'appelant (l'app),
// jamais lu depuis l'horloge ici : l'ENGINE reste pur et testable.
function createInitialState(seed = 1) {
  return {
    version: 1,
    day: 1,
    awakeSeconds: 0,
    pieces: 50,
    rngSeed: seed >>> 0,
    unlockedTabs: ['ferme', 'inventaire', 'comptoir'],
    stats: {},
  };
}

// Avance la simulation de dt secondes. Au Lot 0, incrémente seulement le
// temps d'éveil ; les lots suivants y ajouteront les flux d'énergie et d'eau.
function tick(state, dt) {
  state.awakeSeconds += dt;
  return state;
}

// Table de migrations successives : MIGRATIONS[n] transforme un état de
// version n vers n+1. Vide en pratique tant qu'aucune vraie migration n'est
// nécessaire, sauf l'entrée 0 ci-dessous qui sert de filet pour toute
// sauvegarde antérieure au champ `version` (et de cas de test).
const MIGRATIONS = {
  0: (state) => ({ ...state, version: 1 }),
};

// Applique les migrations successives à une sauvegarde { v, t, s } (ou à un
// état brut) jusqu'à atteindre la version courante. Ne lance jamais
// d'exception : une entrée invalide retombe sur un état migré au mieux.
function migrate(save) {
  let state = save && typeof save === 'object' && save.s && typeof save.s === 'object'
    ? { ...save.s }
    : (save && typeof save === 'object' ? { ...save } : {});
  let version = typeof state.version === 'number' ? state.version : 0;
  let guard = 0;
  while (MIGRATIONS[version] && guard < 1000) {
    state = MIGRATIONS[version](state);
    version = typeof state.version === 'number' ? state.version : version + 1;
    guard++;
  }
  if (typeof state.version !== 'number') state.version = version;
  return state;
}

// Formatage des nombres à la française : entiers avec espace tous les
// 3 chiffres en dessous de 10 000, milliers en "k" et millions en "M"
// au-delà, avec une décimale séparée par une virgule.
// Fonction pure : elle vit dans ENGINE pour rester testable par Node, même
// si c'est l'app qui l'utilise pour l'affichage.
function formatNumber(n) {
  if (typeof n !== 'number' || Number.isNaN(n)) return '0';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  if (abs >= 1_000_000) {
    return sign + formatFixed(abs / 1_000_000, 1) + ' M';
  }
  if (abs >= 10_000) {
    return sign + formatFixed(abs / 1_000, 1) + ' k';
  }
  return sign + groupThousands(Math.round(abs));
}

// Groupe un entier positif par milliers avec des espaces : 1234 -> "1 234".
function groupThousands(intValue) {
  const s = String(Math.trunc(intValue));
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const posFromEnd = s.length - i;
    out += s[i];
    if (posFromEnd > 1 && posFromEnd % 3 === 1) out += ' ';
  }
  return out;
}

// Formate un nombre décimal avec `digits` décimales et une virgule française.
function formatFixed(value, digits) {
  return value.toFixed(digits).replace('.', ',');
}
</script>

<script id="tests" type="text/plain">
'use strict';

/* ==========================================================================
   Tests du moteur (bloc "core" uniquement). Petite fonction test/assert
   maison : pas de dépendance externe. Ce bloc est en type="text/plain" pour
   ne jamais s'exécuter dans le navigateur ; run-tests.mjs l'extrait et
   l'exécute avec Node, à la suite du bloc core.
   ========================================================================== */

const __tests = [];

function test(name, fn) {
  __tests.push({ name, fn });
}

function assert(condition, message) {
  if (!condition) throw new Error(message || 'assertion échouée');
}

function assertEqual(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) {
    throw new Error(message || `attendu ${b}, obtenu ${a}`);
  }
}

function runTests() {
  const results = { total: __tests.length, passed: 0, failed: [] };
  for (const t of __tests) {
    try {
      t.fn();
      results.passed++;
    } catch (e) {
      results.failed.push({ name: t.name, error: e && e.message ? e.message : String(e) });
    }
  }
  // Assignation explicite sur globalThis : une déclaration `let`/`const` de
  // premier niveau ne devient pas une propriété de l'objet global (ni dans
  // un navigateur, ni dans un contexte vm Node), donc run-tests.mjs ne
  // pourrait pas la relire depuis l'extérieur du script sans ceci.
  if (typeof globalThis !== 'undefined') {
    globalThis.__testResults = results;
  }
  return results;
}

test('état initial : forme et valeurs attendues', () => {
  const s = createInitialState(42);
  assertEqual(s.version, 1);
  assertEqual(s.day, 1);
  assertEqual(s.awakeSeconds, 0);
  assertEqual(s.pieces, 50);
  assertEqual(s.rngSeed, 42);
  assertEqual(s.unlockedTabs, ['ferme', 'inventaire', 'comptoir']);
  assertEqual(s.stats, {});
});

test('tick() n\'incrémente que awakeSeconds', () => {
  const s = createInitialState(1);
  tick(s, 0.2);
  tick(s, 0.2);
  assert(Math.abs(s.awakeSeconds - 0.4) < 1e-9, 'awakeSeconds devrait valoir 0.4');
  assertEqual(s.day, 1);
  assertEqual(s.pieces, 50);
});

test('sérialisation JSON aller-retour identique', () => {
  const s = createInitialState(7);
  s.pieces = 123;
  s.stats.test = 1;
  const roundTripped = JSON.parse(JSON.stringify(s));
  assertEqual(roundTripped, s);
});

test('migration factice v0 → v1', () => {
  const legacy = { day: 3, awakeSeconds: 10, pieces: 80, rngSeed: 9, unlockedTabs: ['ferme'], stats: {} };
  // pas de champ `version` : doit être traité comme version 0 et migré vers 1
  const migrated = migrate({ v: 0, t: Date.now(), s: legacy });
  assertEqual(migrated.version, 1);
  assertEqual(migrated.day, 3);
  assertEqual(migrated.pieces, 80);
});

test('migrate() ne plante pas sur une entrée déjà à jour', () => {
  const s = createInitialState(5);
  const migrated = migrate({ v: 1, t: Date.now(), s });
  assertEqual(migrated.version, 1);
  assertEqual(migrated.pieces, 50);
});

test('import d\'un texte invalide sans plantage', () => {
  const badInputs = [null, undefined, {}, { s: null }, 'texte quelconque', 42];
  for (const bad of badInputs) {
    let threw = false;
    let result;
    try {
      result = migrate(bad);
    } catch (e) {
      threw = true;
    }
    assert(!threw, 'migrate ne doit jamais lancer d\'exception');
    assert(result && typeof result === 'object', 'migrate doit toujours renvoyer un objet');
  }
});

test('formatage des nombres à la française', () => {
  assertEqual(formatNumber(0), '0');
  assertEqual(formatNumber(50), '50');
  assertEqual(formatNumber(1234), '1 234');
  assertEqual(formatNumber(12345), '12,3 k');
  assertEqual(formatNumber(1200), '1 200');
  assertEqual(formatNumber(3400000), '3,4 M');
  assertEqual(formatNumber(-15000), '-15,0 k');
});

test('générateur aléatoire reproductible à graine égale', () => {
  const rngA = mulberry32(1234);
  const rngB = mulberry32(1234);
  const seqA = [rngA(), rngA(), rngA()];
  const seqB = [rngB(), rngB(), rngB()];
  assertEqual(seqA, seqB);
  for (const v of seqA) {
    assert(v >= 0 && v < 1, 'chaque valeur doit être dans [0, 1)');
  }
  const rngC = mulberry32(9999);
  assert(rngC() !== seqA[0], 'deux graines différentes ne doivent pas (en pratique) produire la même première valeur');
});

// En environnement navigateur, ce bloc n'est jamais exécuté (type="text/plain").
// run-tests.mjs l'exécute explicitly avec Node après avoir lancé runTests().
if (typeof module !== 'undefined' && typeof globalThis !== 'undefined') {
  runTests();
}
</script>

<script id="app">
'use strict';

/* ==========================================================================
   APP — sauvegarde, interface et boucle. Seul bloc à toucher au DOM, à
   window, au stockage ou à l'horloge.
   ========================================================================== */

const SAVE_KEY = 'ferme-save';
const TICK_MS = 200;
const MAX_FRAME_MS = 1000;
const AUTOSAVE_MS = 10000;
const RENDER_THROTTLE_MS = 200; // ~5 fois par seconde

const TABS = [
  { id: 'ferme', label: 'Ferme', icon: '🌾' },
  { id: 'inventaire', label: 'Inventaire', icon: '📦' },
  { id: 'recettes', label: 'Livre de recette', icon: '📖' },
  { id: 'techno', label: 'Arbre des technologies', icon: '🌳' },
  { id: 'comptoir', label: 'Comptoir', icon: '💰' },
];

let state = null;
let activeTab = 'ferme';
let testMode = false;
let renderScheduled = false;
let lastRenderAt = 0;

/* ---------- stockage : localStorage, toujours entouré de try/catch ---------- */

function safeStorageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch (e) {
    return null;
  }
}

function safeStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (e) {
    return false;
  }
}

function loadOrCreateState() {
  const raw = safeStorageGet(SAVE_KEY);
  if (!raw) return createInitialState(makeSeed());
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return createInitialState(makeSeed());
    return migrate(parsed);
  } catch (e) {
    return createInitialState(makeSeed());
  }
}

function makeSeed() {
  // Seule l'app a le droit de lire l'horloge ; l'ENGINE reste pur.
  return (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
}

function persistState() {
  try {
    const payload = JSON.stringify({ v: state.version, t: Date.now(), s: state });
    safeStorageSet(SAVE_KEY, payload);
  } catch (e) {
    // La sauvegarde ne doit jamais faire planter la page.
  }
}

/* ---------- export / import ---------- */

function encodeBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function decodeBase64(b64) {
  return decodeURIComponent(escape(atob(b64)));
}

function exportSaveText() {
  const payload = JSON.stringify({ v: state.version, t: Date.now(), s: state });
  return encodeBase64(payload);
}

function importSaveText(text) {
  try {
    const json = decodeBase64(String(text).trim());
    const parsed = JSON.parse(json);
    if (!parsed || typeof parsed !== 'object' || !parsed.s) {
      throw new Error('format de sauvegarde invalide');
    }
    state = migrate(parsed);
    persistState();
    return true;
  } catch (e) {
    return false;
  }
}

/* ---------- actions du moteur (jamais d'accès direct à state depuis l'UI) ---------- */

function actionNewGame() {
  state = createInitialState(makeSeed());
  persistState();
  scheduleRender();
}

function actionAddPieces(amount) {
  state.pieces += amount;
  scheduleRender();
}

/* ---------- boucle à pas fixe ---------- */

let accumulatorMs = 0;
let lastFrameTime = null;

function frame(now) {
  if (lastFrameTime === null) lastFrameTime = now;
  let elapsed = now - lastFrameTime;
  lastFrameTime = now;
  if (elapsed > MAX_FRAME_MS) elapsed = MAX_FRAME_MS;
  accumulatorMs += elapsed;
  while (accumulatorMs >= TICK_MS) {
    tick(state, TICK_MS / 1000);
    accumulatorMs -= TICK_MS;
    scheduleRender();
  }
  requestAnimationFrame(frame);
}

function scheduleRender() {
  renderScheduled = true;
}

function renderLoop(now) {
  if (renderScheduled && now - lastRenderAt >= RENDER_THROTTLE_MS) {
    renderScheduled = false;
    lastRenderAt = now;
    render();
  }
  requestAnimationFrame(renderLoop);
}

/* ---------- rendu ---------- */

function render() {
  renderIndicators();
  renderTabbar();
  renderTabContent();
  renderTestPanel();
}

function renderIndicators() {
  const el = document.getElementById('indicators');
  el.innerHTML = `
    <span class="indicator" title="Nuit"><span>🌙</span><span>${state.day}</span></span>
    <span class="indicator" title="Pièces"><span>💰</span><span>${formatNumber(state.pieces)}</span></span>
  `;
}

function renderTabbar() {
  const el = document.getElementById('tabbar');
  const visible = TABS.filter((t) => state.unlockedTabs.includes(t.id));
  el.innerHTML = visible
    .map(
      (t) => `<button type="button" class="tab-btn${t.id === activeTab ? ' active' : ''}" data-action="switch-tab" data-tab="${t.id}">${t.icon} ${t.label}</button>`
    )
    .join('');
}

function renderTabContent() {
  const el = document.getElementById('tab-content');
  const tab = TABS.find((t) => t.id === activeTab) || TABS[0];
  el.innerHTML = `
    <h2>${tab.icon} ${tab.label}</h2>
    <p class="hint">Rien à voir pour l'instant, patience — ce lot pose juste le socle.</p>
  `;
}

function renderTestPanel() {
  const panel = document.getElementById('test-panel');
  panel.hidden = !testMode;
  if (!testMode) return;
  const dump = document.getElementById('state-dump');
  dump.textContent = JSON.stringify(state, null, 2);
}

/* ---------- options (modale) ---------- */

function openOptionsModal() {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" data-action="close-modal">
      <div class="modal" data-stop-propagation>
        <button class="btn modal-close" type="button" data-action="close-modal">Fermer</button>
        <h2>⚙️ Options</h2>
        <div class="stack">
          <div class="stack">
            <strong>Exporter la sauvegarde</strong>
            <textarea id="export-area" rows="4" readonly></textarea>
            <div class="row">
              <button class="btn" type="button" data-action="do-export">Générer</button>
              <button class="btn" type="button" data-action="copy-export">Copier</button>
            </div>
          </div>
          <div class="stack">
            <strong>Importer une sauvegarde</strong>
            <textarea id="import-area" rows="4" placeholder="Coller le texte exporté ici"></textarea>
            <div class="row">
              <button class="btn" type="button" data-action="do-import">Importer</button>
            </div>
          </div>
          <div class="stack">
            <strong>Nouvelle partie</strong>
            <div class="row">
              <button class="btn danger" type="button" data-action="do-new-game">Recommencer à zéro</button>
            </div>
          </div>
          <div class="stack">
            <strong>Mode test</strong>
            <label class="row">
              <input type="checkbox" id="test-mode-toggle" ${testMode ? 'checked' : ''}>
              Activer le panneau de mode test
            </label>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('export-area').addEventListener('click', (e) => e.target.select());
}

function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

function showToast(message) {
  const root = document.getElementById('toast-root');
  root.innerHTML = `<div class="toast">${message}</div>`;
  setTimeout(() => {
    root.innerHTML = '';
  }, 2200);
}

/* ---------- délégation d'événements ---------- */

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  switch (action) {
    case 'open-options':
      openOptionsModal();
      break;
    case 'close-modal':
      if (e.target === target) closeModal();
      break;
    case 'switch-tab':
      activeTab = target.dataset.tab;
      scheduleRender();
      break;
    case 'test-add-100':
      actionAddPieces(100);
      break;
    case 'test-add-1000':
      actionAddPieces(1000);
      break;
    case 'do-export': {
      const area = document.getElementById('export-area');
      area.value = exportSaveText();
      break;
    }
    case 'copy-export': {
      const area = document.getElementById('export-area');
      if (!area.value) area.value = exportSaveText();
      area.select();
      try {
        navigator.clipboard.writeText(area.value);
        showToast('Copié !');
      } catch (err) {
        try {
          document.execCommand('copy');
          showToast('Copié !');
        } catch (err2) {
          showToast('Copie impossible, sélectionne et copie manuellement.');
        }
      }
      break;
    }
    case 'do-import': {
      const area = document.getElementById('import-area');
      const ok = importSaveText(area.value);
      showToast(ok ? 'Sauvegarde importée.' : 'Texte invalide, import annulé.');
      if (ok) {
        closeModal();
        scheduleRender();
      }
      break;
    }
    case 'do-new-game': {
      if (confirm('Nouvelle partie ? Toute la progression actuelle sera perdue.')) {
        actionNewGame();
        closeModal();
      }
      break;
    }
  }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'test-mode-toggle') {
    testMode = e.target.checked;
    scheduleRender();
  }
});

document.getElementById('modal-root').addEventListener('click', (e) => {
  // ferme la modale si on clique sur le fond, pas sur son contenu
  if (e.target.dataset.action === 'close-modal' && e.target.classList.contains('modal-backdrop')) {
    closeModal();
  }
});

/* ---------- démarrage ---------- */

state = loadOrCreateState();

const autosaveTimer = setInterval(persistState, AUTOSAVE_MS);
window.addEventListener('beforeunload', persistState);

requestAnimationFrame(frame);
requestAnimationFrame(renderLoop);
render();
</script>

</body>
</html>
